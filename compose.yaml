# The backing services a deployment needs, and which a laptop does not.
#
# Nothing here is required to use this repo: with LAKEHOUSE_CATALOG unset the
# DuckLake catalog is a file under `data/lakehouse/` and none of this runs. It
# exists so the catalog and the Parquet can leave the machine the pipeline runs
# on, which is what the containerised deployment is built on.
#
# `${...}` is interpolated from the repo-root `.env` — the same file `just`
# loads (`set dotenv-load`), so one file configures both. `just compose-up`
# starts it; `just compose-down volumes` destroys the data.
#
# Three of the four ports are bound to 127.0.0.1, and the exception is the
# point: Postgres and SeaweedFS hold the whole landing zone, and Dagster's
# webserver has no authentication at all, so none of them may face a network.
# `site` is the static Evidence build served by nginx, which opens no database
# and is the one thing here meant to be looked at — it binds every interface,
# exactly as `just serve` does (docs/RUNNING_AS_A_SERVICE.md §6).
#
# Image tags are pinned exactly. Dependabot's `docker-compose` ecosystem watches
# the ones here and its `docker` ecosystem watches the `Dockerfile`'s: two
# ecosystems, because they match different files.
name: mds

networks:
  default:
    name: mds

# Every volume is named explicitly, because the run containers mount them by
# name: `dagster_docker` launches them itself, outside this file, so compose's
# `<project>_<volume>` prefixing would leave the launcher naming volumes that do
# not exist. `deploy/dagster.yaml`'s `container_kwargs.volumes` is the other
# half, and a test holds the two lists together.
volumes:
  mds_postgres:
    name: mds_postgres
  mds_seaweedfs:
    name: mds_seaweedfs
  # The warehouse and the landing zone: `data/warehouse.duckdb` is the one file
  # a run container and the service both write, which is why runs are queued.
  mds_data:
    name: mds_data
  # dlt's state — the WDI watermark and the ECB's last fixing. Its own volume
  # because it is the piece a deployment most easily loses: dlt resolves it from
  # $HOME unless DLT_DATA_DIR says otherwise (docs/RUNNING_AS_A_SERVICE.md §3).
  mds_dlt:
    name: mds_dlt
  # The built site, written by a run container and read by nginx.
  mds_site:
    name: mds_site
  # Compute logs and run artifacts, which Dagster keeps on a filesystem even
  # with its storage in Postgres.
  mds_dagster:
    name: mds_dagster

services:
  # The DuckLake catalog (database `lakehouse`), and Dagster's storage
  # (database `dagster`, created by the init script).
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: mds
      # `:?` rather than a default: an unset password would start a database
      # nothing could reach, and the error names the variable.
      POSTGRES_PASSWORD: ${PGPASSWORD:?set it in .env — see .env.example}
      POSTGRES_DB: lakehouse
    volumes:
      - mds_postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # `-h 127.0.0.1`, and not the default socket, because the default answers
      # during initdb. The entrypoint runs a private bootstrap server to execute
      # `init.sql` with `listen_addresses=''` — no TCP — but a live unix socket
      # in `/var/run/postgresql`, which is exactly where `pg_isready` connects
      # when nothing says otherwise. `-d` does not rescue it: that only shapes
      # the conninfo, and `pg_isready` never opens the database it names.
      #
      # Measured on a fresh volume with a `pg_sleep(20)` init script:
      # over the socket it returned 0 at four seconds, while the
      # init was still running and TCP answered `no response`; over TCP it
      # returned 2 until the real server came up. So the socket check let
      # `compose up --wait` return before `init.sql` had created the `dagster`
      # database, and the `just ingest` behind it failed with `connection
      # refused`.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mds -d lakehouse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage for the lakehouse Parquet (LAKEHOUSE_DATA_PATH).
  # `mini` is SeaweedFS's all-in-one: master, volume, filer and S3 gateway.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-testtest}
      S3_BUCKET: ${LAKEHOUSE_S3_BUCKET:-lake}
    volumes:
      - mds_seaweedfs:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      # `/healthz`, not `/`. The S3 gateway answers an unsigned request to `/`
      # with a 403, which is correct behaviour and not a health signal — a check
      # on `/` fails forever against a perfectly good service.
      test: ["CMD-SHELL", "curl -sf -o /dev/null --max-time 3 http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The graph and the dashboard, as one long-running container. Its CMD is
  # `just serve`, so the image restates the toolchain and not the service.
  #
  # Runs do *not* execute here: `deploy/dagster.yaml`'s DockerRunLauncher gives
  # each one its own container from this same image, which is why the docker
  # socket is mounted. That socket is root-equivalent on the host — see
  # docs/RUNNING_AS_A_SERVICE.md §6 before exposing any of this.
  dagster:
    build: .
    image: mds:local
    # `just serve` exits 1 when any of its children dies, so that something
    # restarts it — systemd's `Restart=on-failure` on a host, this line here.
    # Without it one crashed daemon stops the container and it stays down, as
    # does the whole stack after a reboot. It reaches only the four services:
    # a run's container is created by the launcher, not by compose, and is
    # `auto_remove`d when it exits.
    restart: unless-stopped
    # `just` is PID 1 and forks four children; without an init the container
    # ends up reaping nothing and `docker stop` waits out its full grace period.
    init: true
    environment:
      PROJECT_ROOT: /app
      WAREHOUSE_PATH: /app/data/warehouse.duckdb
      LAKEHOUSE_DIR: /app/data/lakehouse
      # Both halves of the landing zone are remote here: the catalog in the
      # Postgres beside it, the Parquet in SeaweedFS. So the only thing a run
      # container and the service share on disk is the warehouse file.
      LAKEHOUSE_CATALOG: postgres://mds@postgres:5432/lakehouse
      LAKEHOUSE_METADATA_SCHEMA: lakehouse
      PGPASSWORD: ${PGPASSWORD:?set it in .env — see .env.example}
      LAKEHOUSE_DATA_PATH: s3://${LAKEHOUSE_S3_BUCKET:-lake}/modern-data-stack/
      LAKEHOUSE_S3_ENDPOINT: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-testtest}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_USER: mds
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_STORAGE_DIR: /dagster-storage
      # Explicit, because dlt resolves its state directory from $HOME and would
      # otherwise put the watermarks inside the container's own filesystem,
      # where they die with it. XDG_DATA_HOME does not work: it loses to an
      # existing ~/.dlt (docs/RUNNING_AS_A_SERVICE.md §3).
      DLT_DATA_DIR: /app/state/dlt
      INGEST_CACHE_DIR: /app/data/cache
      # Where the finished site is copied for nginx to serve. A mount point, so
      # `publish/build_report.py` replaces its contents rather than the
      # directory.
      SITE_ROOT: /srv/site
    volumes:
      - mds_data:/app/data
      - mds_dlt:/app/state
      - mds_site:/srv/site
      - mds_dagster:/dagster-storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Localhost only: Dagster has no authentication (§6).
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # The dashboard. Read-only on the site volume: nothing here writes it, and a
  # static site server that can write its own document root is a liability.
  site:
    image: nginx:1.31.6-alpine
    restart: unless-stopped
    volumes:
      - mds_site:/usr/share/nginx/html:ro
    # Every interface, unlike the other ports, and deliberately: the site is
    # static, and its source queries only aggregate over `customer_id`
    # (RUNNING_AS_A_SERVICE.md §6). Public site means public tables, though.
    ports:
      - "8081:80"
    depends_on:
      - dagster
