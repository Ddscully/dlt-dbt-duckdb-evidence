repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # `ruff` is a legacy alias for this as of 0.12; both still work.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Deliberately not the upstream sqlfluff hook. That one installs its own copy of
  # sqlfluff into an isolated env, which drifted from the venv's: 3.3.0 there
  # rejected an `order by` inside a window clause that the venv's 4.2.2 accepts, so
  # a tree that passed `just lint` failed on commit. Running the recipe itself
  # means there is one sqlfluff — pinned once, in pyproject.toml — and it can't
  # drift again.
  #
  # It also has to run from `dbt/`: the templater opens a dbt connection, and
  # profiles.yml resolves `../data/warehouse.duckdb` relative to the cwd. The
  # upstream hook runs at the repo root and dies on a path one directory too high.
  #
  # `pass_filenames: false` because the recipe lints the whole tree; `files`
  # decides whether it runs at all.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff-lint (just lint)
        entry: just lint
        language: system
        pass_filenames: false
        files: ^dbt/(models|snapshots)/.*\.sql$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
