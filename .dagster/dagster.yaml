# Dagster instance config. The justfile exports DAGSTER_HOME as this directory;
# run and event storage land beside this file (SQLite, gitignored), so the demo
# needs no external services.
telemetry:
  enabled: false

# One run at a time, because DuckDB takes one writer at a time. The executor
# serialises steps *within* a run; this serialises runs, which otherwise start
# ten at once (Dagster's default) and contend for the lock. It governs
# only runs that pass through the queue — the UI, the schedule, backfills — and
# not `dagster job execute`, which is what `just materialize` runs.
concurrency:
  runs:
    max_concurrent_runs: 1

# Keep the local run history from growing without bound.
retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 7
