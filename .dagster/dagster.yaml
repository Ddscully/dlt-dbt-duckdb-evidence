# Dagster instance config. The justfile exports DAGSTER_HOME as this directory;
# run and event storage land beside this file (SQLite, gitignored), so the demo
# needs no external services.
telemetry:
  enabled: false

# Keep the local run history from growing without bound.
retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 7
