appearance:
  default: system
  switcher: true

# Colors below are validated for both light and dark mode: every categorical
# pair clears the OKLab colorblind-separation floor (protanopia/deuteranopia)
# and the normal-vision floor, so series stay distinguishable in every chart
# and to every reader. See reports/README.md ("Chart colors") for the
# per-series conventions built on top of this palette.
theme:
  colors:
    primary:
      light: "#0f6e6e" # deep petrol — links, primary UI
      dark: "#4fd1c5"
    accent:
      light: "#b5530a" # burnt amber — emphasis
      dark: "#f0a058"
    base-100:
      light: "#fbfaf7" # warm paper, not stark white
      dark: "#111417" # near-black with a cool cast
    info:
      light: "#2a78d6"
      dark: "#3987e5"
    positive:
      light: "#0ca30c"
      dark: "#0ca30c"
    negative:
      light: "#d03b3b"
      dark: "#d03b3b"
    warning:
      light: "#fab219"
      dark: "#fab219"
  colorPalettes:
    default:
      light:
        [
          "#2a78d6",
          "#eb6834",
          "#1baf7a",
          "#eda100",
          "#e87ba4",
          "#008300",
          "#4a3aa7",
          "#e34948",
        ]
      dark:
        [
          "#3987e5",
          "#d95926",
          "#199e70",
          "#c98500",
          "#d55181",
          "#008300",
          "#9085e9",
          "#e66767",
        ]

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
