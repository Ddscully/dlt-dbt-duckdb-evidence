version: 2

# The marts' unit tests, kept apart from the per-group ymls (descriptions and
# contracts): one axis of assertion across the models, where those split by
# domain.
#
# Unit tests for `dim_date`'s fiscal arithmetic.
#
# Why these exist when the columns already carry data tests: `fiscal_quarter` is
# guarded by `accepted_range 1-4`, `fiscal_month` by `1-12`, `fiscal_year` by
# `not_null`, and `fiscal_year_start_date` / `fiscal_year_end_date` by nothing at
# all. A range test catches an answer that is out of the domain — which is how
# the `/3 + 1` float-division bug was caught, at fiscal quarter *5*. It cannot
# catch an answer that is wrong and in range: January scored Q2 instead of Q3
# under a July start passes every test in the project.
#
# The second reason is the var. `fiscal_year_start_month` is configurable and the
# warehouse only ever builds one value of it (4), so eleven of the twelve
# policies this model claims to support are untested by construction rather than
# by oversight. `overrides.vars` is the only way to reach them, and it is why
# each test below pins the policy instead of inheriting the project's.
#
# The expected values are generated by an explicit rotation of the calendar
# (`[start, start+1, ..., 12, 1, ..., start-1]`, position = fiscal month), which
# is a different formulation from the modular arithmetic under test. An oracle
# that reuses the expression it is checking proves nothing.
#
# One year of input yields one whole calendar year of output — the model expands
# its bounds to `date_trunc('year', min)` .. end of `max`'s year — so `expect`
# is 366 rows and lives in a CSV fixture. 2024 is deliberately a leap year.

unit_tests:
  - name: dim_date_fiscal_columns_follow_an_april_year_start
    model: dim_date
    description: >
      The project's own policy (`fiscal_year_start_month: 4`). April-June is Q1
      of the fiscal year ending the following March, and January-March is Q4 of
      the year that ends in the same calendar year.
    overrides:
      vars:
        fiscal_year_start_month: 4
    given:
      - input: ref('stg_fx_rates')
        rows:
          - {rate_date: "2024-01-15"}
          - {rate_date: "2024-11-15"}
    expect:
      format: csv
      fixture: dim_date_fiscal_april

  - name: dim_date_fiscal_year_collapses_onto_calendar_year_in_january
    model: dim_date
    description: >
      The documented property that makes the convention legible: with a January
      start, `fiscal_year` must equal `year` and `fiscal_quarter` must equal the
      calendar quarter on every row. If the two ever diverge here, `fiscal_year`
      is not "the calendar year the fiscal year ends in" any more.
    overrides:
      vars:
        fiscal_year_start_month: 1
    given:
      - input: ref('stg_fx_rates')
        rows:
          - {rate_date: "2024-01-15"}
          - {rate_date: "2024-11-15"}
    expect:
      format: csv
      fixture: dim_date_fiscal_january

  - name: dim_date_fiscal_columns_follow_a_july_year_start
    model: dim_date
    description: >
      A policy the warehouse never builds. July-September is Q1; the fiscal year
      boundary falls mid-calendar-year, so January and December sit in different
      fiscal years while sharing a calendar one — the case a January or April
      start cannot exercise.
    overrides:
      vars:
        fiscal_year_start_month: 7
    given:
      - input: ref('stg_fx_rates')
        rows:
          - {rate_date: "2024-01-15"}
          - {rate_date: "2024-11-15"}
    expect:
      format: csv
      fixture: dim_date_fiscal_july

# ---------------------------------------------------------------------------
# Unit tests for `fct_cbam_exposure`.
#
# The most complex model in the project and the one whose wrong answers are
# hardest to see: it is a table of euro costs with a statutory deadline, and
# every figure on it is plausible. Its data tests are `not_null` and
# `accepted_range` with generous bounds, which is all they can be — the numbers
# are transcribed from a legal instrument, so there is no independent quantity to
# check them against. What is left for a unit test is the *rules*: which row a
# value is read off, which goods are priced at all, which mark-up a product group
# gets, and what a window function partitions by.
#
# The row-level fallback and the heading filter belong to
# `int_cbam_default_factors` and are tested there; here are the mark-up and the
# excess window (what it partitions by, and which rows it admits).
#
# **Four mutations of that window against a warehouse copy, and the split
# between them is the argument for the policy the third test pins:**
#
# | mutation                                    | 21 data tests | effect on the warehouse       |
# |---------------------------------------------|---------------|-------------------------------|
# | window loses `filter (where not p.is_fallback_table)` | all pass | **not one cell moves**   |
# | the `case` goes, so the fallback keeps a figure       | 1 fails  | 260 nulls become numbers |
# | both — the expression exactly as it shipped          | 1 fails  | the same 260, +836 t     |
# | partition by product group instead of good           | all pass | 18,153 t -> 29,469 t     |
#
# The first row is the defect that was filed, and it changes nothing, because
# the fallback has never been below the cheapest listed source of a good: for 48
# of the 260 goods it cannot be, and across the other 212 it is dearer than
# 87.5% of listed sources at the median. So no data test could ever see it and
# the fixture is the entire guard. The second row is the half that *is*
# observable, and only because the policy nulls the fallback's figure rather
# than keeping it — one of the 21 data tests fires, the both-directions
# `expression_is_true` on the column, and it is the only one that can. Choosing
# to null is what gave half of this rule a data test at all.
#
# **Every fixture total is chosen to be float-exact under the mark-up**, which is
# not decoration. `total * (1 + 10/100)` is exact for 2.5, 5, 10, 20, 40 and 80
# and inexact for 1, 2, 4, 8 and 50; the 1% fertiliser rate is exact for 50 and
# for almost nothing else. `markup_2026_pct` is not asserted anywhere below for
# the same reason — it is a ratio of two doubles and the warehouse holds three
# distinct values of it that all print as `10.0`
# (9.99999999999998578915, 10.00000000000000888178, 10.00000000000003197442).
# A column with no exact value can only ever carry a range test, which is the
# argument for the mark-up schedule being a seed rather than something measured
# off the annex.
#
# Every input is declared in every test. Two are seeds, and an undeclared seed
# input is not empty — dbt uses the seed's own CSV, which for `cbam_goods` is
# the whole of the annex's goods list. The resolved-factor input is mocked in
# its *output* shape (`direct_/indirect_/total_t_co2e_per_t`, both flags) rather
# than the seed's, which is the point of mocking a model and not its sources.

  - name: cbam_exposure_marks_fertilisers_up_one_percent_and_holds_it_flat
    model: fct_cbam_exposure
    description: >
      The mark-up is a property of the product group, not a constant. Cement,
      iron and steel, aluminium and hydrogen phase in at 10 / 20 / 30% across
      2026-28; fertilisers carry a flat **1% in all three years**, a
      food-security carve-out written into the articles. Hardcoding the common
      schedule overstates every fertiliser line by nine points in 2026 and
      twenty-seven in 2028 — 2,457 rows of the mart — and `markup_2026_pct`'s
      `accepted_range 0-31` cannot see it, because 10 is a legal answer. The
      model used to read this schedule off the annex's own published columns and
      now asserts it from a seed, which is the loss the 2026/1740 correction
      caused; this test is what stands in for the arithmetic that used to check
      it. `eu_ets_price_eur_per_t` is overridden to 100 rather than inherited, on
      the same argument as `dim_date`'s fiscal var: the warehouse only ever
      builds 75, so nothing otherwise proves the price is wired through rather
      than baked in.
    overrides:
      vars:
        eu_ets_price_eur_per_t: 100
    given:
      - input: ref('int_cbam_default_factors')
        rows:
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "3102100000-urea", direct_t_co2e_per_t: 40.0, indirect_t_co2e_per_t: 10.0, total_t_co2e_per_t: 50.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 9.0, indirect_t_co2e_per_t: 1.0, total_t_co2e_per_t: 10.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
      - input: ref('cbam_goods')
        rows:
          - {good_key: "3102100000-urea", product_group: "Fertilisers", cn_code: "3102 10 00 00", goods_description: "Urea, whether or not in aqueous solution"}
          - {good_key: "2523100090-other-clinker", product_group: "Cement", cn_code: "2523 10 00 90", goods_description: "Other clinker, including grey clinker"}
      - input: ref('cbam_markup_schedule')
        rows:
          - {product_group: "Fertilisers", year: 2026, markup_pct: 1}
          - {product_group: "Fertilisers", year: 2027, markup_pct: 1}
          - {product_group: "Fertilisers", year: 2028, markup_pct: 1}
          - {product_group: "Cement", year: 2026, markup_pct: 10}
          - {product_group: "Cement", year: 2027, markup_pct: 20}
          - {product_group: "Cement", year: 2028, markup_pct: 30}
      - input: ref('dim_country')
        rows:
          - {country_iso3: "NOR", country_name: "Norway", region: "Europe & Central Asia", income_group: "High income"}
      - input: ref('dim_grid_emission_factors')
        rows: []
    expect:
      rows:
        # Flat: 50 x 1.01 in every year, and the euro figure at the overridden
        # price rather than the project's 75.
        - {good_key: "3102100000-urea", total_t_co2e_per_t: 50.0, certificates_2026_t_co2e_per_t: 50.5, certificates_2027_t_co2e_per_t: 50.5, certificates_2028_t_co2e_per_t: 50.5, ets_price_eur_per_t: 100, cbam_cost_2026_eur_per_t: 5050.0}
        # Phased: 10 x 1.1 / 1.2 / 1.3.
        - {good_key: "2523100090-other-clinker", total_t_co2e_per_t: 10.0, certificates_2026_t_co2e_per_t: 11.0, certificates_2027_t_co2e_per_t: 12.0, certificates_2028_t_co2e_per_t: 13.0, ets_price_eur_per_t: 100, cbam_cost_2026_eur_per_t: 1100.0}

  - name: cbam_exposure_measures_excess_against_the_same_good_not_the_group
    model: fct_cbam_exposure
    description: >
      `excess_over_cleanest_source_t_co2e_per_t` is a window minimum, and the
      procurement question it answers is "against the cheapest source **of this
      good**". Partitioning it by product group instead of `good_key` compares
      clinker with cement and steel screws with hot-rolled coil — a number that
      is still non-negative, still monotone in the right direction, and wrong.
      `accepted_range min_value 0` passes it, because subtracting a group-wide
      minimum can only make the figure larger. Two goods in one product group is
      the smallest fixture that separates the two partitions: under `good_key`
      the cheapest row of *each* good is zero, under `product_group` only one row
      in the whole table is.
    given:
      - input: ref('int_cbam_default_factors')
        rows:
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 9.0,  indirect_t_co2e_per_t: 1.0,  total_t_co2e_per_t: 10.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Chile",  country_iso3: "CHL", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 18.0, indirect_t_co2e_per_t: 2.0,  total_t_co2e_per_t: 20.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "2523290000-portland-cement", direct_t_co2e_per_t: 36.0, indirect_t_co2e_per_t: 4.0,  total_t_co2e_per_t: 40.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Chile",  country_iso3: "CHL", good_key: "2523290000-portland-cement", direct_t_co2e_per_t: 72.0, indirect_t_co2e_per_t: 8.0,  total_t_co2e_per_t: 80.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
      - input: ref('cbam_goods')
        rows:
          - {good_key: "2523100090-other-clinker", product_group: "Cement", cn_code: "2523 10 00 90", goods_description: "Other clinker, including grey clinker"}
          - {good_key: "2523290000-portland-cement", product_group: "Cement", cn_code: "2523 29 00 00", goods_description: "Other Portland cement"}
      - input: ref('cbam_markup_schedule')
        rows:
          - {product_group: "Cement", year: 2026, markup_pct: 10}
          - {product_group: "Cement", year: 2027, markup_pct: 20}
          - {product_group: "Cement", year: 2028, markup_pct: 30}
      - input: ref('dim_country')
        rows:
          - {country_iso3: "NOR", country_name: "Norway", region: "Europe & Central Asia", income_group: "High income"}
          - {country_iso3: "CHL", country_name: "Chile",  region: "Latin America & Caribbean", income_group: "High income"}
      - input: ref('dim_grid_emission_factors')
        rows: []
    expect:
      rows:
        # Cheapest clinker: zero. Under a group-wide partition it stays zero,
        # which is why this row alone would not catch the mutation.
        - {country_or_territory: "Norway", good_key: "2523100090-other-clinker",   certificates_2026_t_co2e_per_t: 11.0, excess_over_cleanest_source_t_co2e_per_t: 0.0}
        - {country_or_territory: "Chile",  good_key: "2523100090-other-clinker",   certificates_2026_t_co2e_per_t: 22.0, excess_over_cleanest_source_t_co2e_per_t: 11.0}
        # Cheapest cement: also zero, and this is the row that separates them —
        # a group-wide minimum of 11.0 would make it 33.0.
        - {country_or_territory: "Norway", good_key: "2523290000-portland-cement", certificates_2026_t_co2e_per_t: 44.0, excess_over_cleanest_source_t_co2e_per_t: 0.0}
        - {country_or_territory: "Chile",  good_key: "2523290000-portland-cement", certificates_2026_t_co2e_per_t: 88.0, excess_over_cleanest_source_t_co2e_per_t: 44.0}

  - name: cbam_exposure_keeps_the_fallback_table_out_of_the_cheapest_source
    model: fct_cbam_exposure
    description: >
      The annex's "other countries and territories" row is a rule covering every
      country the regulation does not name, not a place goods are made, so it is
      excluded from `excess_over_cleanest_source_t_co2e_per_t` in **both**
      directions: it cannot set the baseline the listed countries measure
      against, and it does not receive a figure of its own.

      **Only a fixture can pose this.** The window ran unfiltered for a year and
      no number in the warehouse was ever wrong for it, because the fallback has
      never been below the cheapest listed source of a good. For 48 of the 260
      goods it cannot be — the resolution rule copies the fallback row onto every
      listed country the annex prints "-" for, so a tie is guaranteed and strict
      undercutting is unreachable — and across the other 212 the fallback is
      dearer than 87.5% of listed sources at the median good, the narrowest
      margin being 72%. That is a fact about this month's regulation, and the
      mark-up's design intent besides: being unlisted is meant to cost you. So
      the fixture prices the fallback *below* both listed countries, which is the
      only shape that separates the two windows, and it moves all three rows —
      unfiltered, Norway's excess is 5.5 rather than 0, Chile's 16.5 rather than
      11, and the fallback's own is 0 rather than absent.
    given:
      - input: ref('int_cbam_default_factors')
        rows:
          - {country_or_territory: "Other countries and territories", country_iso3: null, good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 4.5, indirect_t_co2e_per_t: 0.5, total_t_co2e_per_t: 5.0, production_route_code: "F", is_fallback_table: true, is_country_specific: true}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 9.0,  indirect_t_co2e_per_t: 1.0, total_t_co2e_per_t: 10.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Chile",  country_iso3: "CHL", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 18.0, indirect_t_co2e_per_t: 2.0, total_t_co2e_per_t: 20.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
      - input: ref('cbam_goods')
        rows:
          - {good_key: "2523100090-other-clinker", product_group: "Cement", cn_code: "2523 10 00 90", goods_description: "Other clinker, including grey clinker"}
      - input: ref('cbam_markup_schedule')
        rows:
          - {product_group: "Cement", year: 2026, markup_pct: 10}
          - {product_group: "Cement", year: 2027, markup_pct: 20}
          - {product_group: "Cement", year: 2028, markup_pct: 30}
      - input: ref('dim_country')
        rows:
          - {country_iso3: "NOR", country_name: "Norway", region: "Europe & Central Asia", income_group: "High income"}
          - {country_iso3: "CHL", country_name: "Chile",  region: "Latin America & Caribbean", income_group: "High income"}
      - input: ref('dim_grid_emission_factors')
        rows: []
    expect:
      rows:
        # The cheapest row in the table by construction, and it still carries no
        # excess: the column presupposes a sourcing country and this row is not
        # one. `accepted_range min_value 0` would have passed a 0.0 here.
        - {country_or_territory: "Other countries and territories", country_iso3: null, certificates_2026_t_co2e_per_t: 5.5, excess_over_cleanest_source_t_co2e_per_t: null}
        # The cheapest *listed* source, so zero — which is the assertion that
        # fails when the fallback is allowed into the window.
        - {country_or_territory: "Norway", country_iso3: "NOR", certificates_2026_t_co2e_per_t: 11.0, excess_over_cleanest_source_t_co2e_per_t: 0.0}
        - {country_or_territory: "Chile",  country_iso3: "CHL", certificates_2026_t_co2e_per_t: 22.0, excess_over_cleanest_source_t_co2e_per_t: 11.0}

  - name: cbam_exposure_takes_each_country_latest_grid_factor_and_keeps_the_rest
    model: fct_cbam_exposure
    description: >
      The grid join was mocked `rows: []` by all three CBAM tests above, so
      `grid_factor_year`, `grid_factor_t_co2_per_mwh` and the
      `where is_latest_available` filter were never once exercised — three
      columns of the shipped mart reaching the release untested.

      Two of its three rules are invisible to every data test on this model.

      **"Latest" is per country, not a year.** The mart's factors carry three
      different years — 2025 on 60 countries, 2024 on 59 and 2022 on one — so a
      `where year = 2025` written for the same job looks right and strips the
      factor off **2,584 rows that had one** (the null count goes 261 to 2,845).
      Measured against a warehouse copy: **PASS=22, ERROR=0**. Norway and Chile
      here carry different latest years for that reason, and Norway carries a
      second, dearer row marked `is_latest_available: false`, so taking the
      whole series or the wrong end of it is a different answer rather than the
      same one by luck.

      **The join is left, in both of the ways it can stop being.** The fallback
      table has no `country_iso3` at all and Curaçao is a listed country the
      factor dimension does not cover; an inner join drops both — 11,665 rows to
      11,404, and **all 260 of the "other countries and territories" rows** that
      `reports/pages/cbam.md` reads for its fallback-penalty figure. Also
      **PASS=22, ERROR=0**: uniqueness holds on what is left, no `not_null`
      fires on rows that are gone, and this model has no row-count test.

      The three tests above go red on that same mutation and **not one of them
      is a guard against it** — their grid input is `rows: []`, so an inner join
      against an empty table deletes their whole fixture. Give any of them a
      single factor row and they stop noticing, which is the same trap
      `..._keeps_a_line_whose_country_the_map_has_never_seen` records for the
      country map. This one fails on the rows that matter.

      The third rule, the filter's *presence*, is the one a data test does
      catch: dropping it fans 11,665 rows out to 306,276 and
      `unique_combination_of_columns` on (country_or_territory, good_key) fails
      immediately. Recorded because knowing which half is already guarded is
      worth as much as the fixture, not because it is why this test exists.
    given:
      - input: ref('int_cbam_default_factors')
        rows:
          - {country_or_territory: "Other countries and territories", country_iso3: null, good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 4.5, indirect_t_co2e_per_t: 0.5, total_t_co2e_per_t: 5.0, production_route_code: "F", is_fallback_table: true, is_country_specific: true}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 9.0,  indirect_t_co2e_per_t: 1.0, total_t_co2e_per_t: 10.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Chile",  country_iso3: "CHL", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 18.0, indirect_t_co2e_per_t: 2.0, total_t_co2e_per_t: 20.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
          - {country_or_territory: "Curaçao", country_iso3: "CUW", good_key: "2523100090-other-clinker", direct_t_co2e_per_t: 27.0, indirect_t_co2e_per_t: 3.0, total_t_co2e_per_t: 30.0, production_route_code: "A", is_fallback_table: false, is_country_specific: true}
      - input: ref('cbam_goods')
        rows:
          - {good_key: "2523100090-other-clinker", product_group: "Cement", cn_code: "2523 10 00 90", goods_description: "Other clinker, including grey clinker"}
      - input: ref('cbam_markup_schedule')
        rows:
          - {product_group: "Cement", year: 2026, markup_pct: 10}
          - {product_group: "Cement", year: 2027, markup_pct: 20}
          - {product_group: "Cement", year: 2028, markup_pct: 30}
      - input: ref('dim_country')
        rows:
          - {country_iso3: "NOR", country_name: "Norway", region: "Europe & Central Asia", income_group: "High income"}
          - {country_iso3: "CHL", country_name: "Chile",  region: "Latin America & Caribbean", income_group: "High income"}
          - {country_iso3: "CUW", country_name: "Curaçao", region: "Latin America & Caribbean", income_group: "High income"}
      - input: ref('dim_grid_emission_factors')
        rows:
          # Norway's superseded year. Dearer than the latest, so a join that
          # takes the whole series or the earliest row gives a different number
          # rather than the same one by luck.
          - {country_iso3: "NOR", year: 2024, emission_factor_t_co2_per_mwh: 0.300, is_latest_available: false}
          - {country_iso3: "NOR", year: 2025, emission_factor_t_co2_per_mwh: 0.020, is_latest_available: true}
          # Chile's latest is an older year than Norway's, which is the whole
          # point: "latest available" is a per-country fact.
          - {country_iso3: "CHL", year: 2022, emission_factor_t_co2_per_mwh: 0.400, is_latest_available: true}
          # No row for CUW, and none for the fallback's null key.
    expect:
      rows:
        # Both uncovered rows survive, with a null factor and a null year — the
        # assertion an inner join fails by deleting them.
        - {country_or_territory: "Other countries and territories", country_iso3: null,  grid_factor_year: null, grid_factor_t_co2_per_mwh: null}
        - {country_or_territory: "Norway",  country_iso3: "NOR", grid_factor_year: 2025, grid_factor_t_co2_per_mwh: 0.020}
        - {country_or_territory: "Chile",   country_iso3: "CHL", grid_factor_year: 2022, grid_factor_t_co2_per_mwh: 0.400}
        - {country_or_territory: "Curaçao", country_iso3: "CUW", grid_factor_year: null, grid_factor_t_co2_per_mwh: null}

  # ---------------------------------------------------------------------------
  # fct_fx_rates_daily — the carry-forward.
  #
  # Five mutations against a warehouse copy, every one of them passing all 14 of
  # the model's data tests:
  #
  # | mutation                              | 14 data tests | effect                                    |
  # |---------------------------------------|---------------|-------------------------------------------|
  # | cap 7 -> 30 days                      | all pass      | 46 stale rows gain a rate                 |
  # | cap removed entirely                  | all pass      | all 3,359 stale rows priced, self-contradictory |
  # | `<=` cap becomes `<`                  | all pass      | 2 rows at exactly the cap lose their rate |
  # | `is_rate_stale` uses `>=` not `>`     | all pass      | 2 rows stale *and* priced                 |
  # | window loses `partition by currency`  | all pass      | 113,479 rows (29.7%) carry another currency's rate |
  #
  # The tests that exist guard direction (`rate_source_date <= date_day`, so no
  # backfill from the future) and the grain. Nothing guards the *cap*, because a
  # rate carried 8 days or 3,341 days is still a positive number with a source
  # date in the past. What the cap refuses is worth a number: the ISK's last
  # fixing before the 2008 collapse is 290.00 and the first after the nine-year
  # gap is 125.01, and the ARS goes 0.89130 to 1.76373 across its 26-day gap.
  # Carrying either one forward converts at a rate that is 132% and 98% away
  # from the next real quote.

  - name: fx_daily_never_carries_one_currency_rate_into_another
    model: fct_fx_rates_daily
    description: >
      The carry window is partitioned by currency, and dropping that partition
      is the worst of the five mutations: `last_value(... ignore nulls)` then
      reaches across currencies and 29.7% of the table quotes somebody else's
      fixing — GBP's 0.7094 becomes 0.3718 — with all 14 data tests green,
      because the dates still move forward and the grain is still unique. The
      fixture is built so a missing partition is unmissable: BBB publishes
      *later* than AAA on every day AAA has to carry, so an unpartitioned window
      hands AAA the wrong number on all three of its carried days. BBB's
      lifetime also starts a day after AAA's, which pins the spine clipping to
      each currency's own quoted life rather than to the calendar.
    given:
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-01-01", date_key: 20240101, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-02", date_key: 20240102, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-03", date_key: 20240103, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-04", date_key: 20240104, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
      - input: ref('dim_currency')
        rows:
          - {currency_code: "AAA", is_quoted: true, first_published_date: "2024-01-01", last_published_date: "2024-01-04"}
          # Quoted from the 2nd, so it must have no row on the 1st.
          - {currency_code: "BBB", is_quoted: true, first_published_date: "2024-01-02", last_published_date: "2024-01-04"}
      - input: ref('fct_fx_rates_published')
        rows:
          - {rate_date: "2024-01-01", currency_code: "AAA", base_currency: "EUR", units_per_eur: 10.0, eur_per_unit: 0.1}
          - {rate_date: "2024-01-02", currency_code: "BBB", base_currency: "EUR", units_per_eur: 20.0, eur_per_unit: 0.05}
          - {rate_date: "2024-01-04", currency_code: "BBB", base_currency: "EUR", units_per_eur: 40.0, eur_per_unit: 0.025}
    expect:
      rows:
        # AAA carries its own 10.0 for three days. Unpartitioned it would read
        # 20.0, 20.0 and 40.0 off BBB.
        - {currency_code: "AAA", date_day: "2024-01-01", units_per_eur: 10.0, rate_source_date: "2024-01-01", days_since_published_rate: 0, is_published_rate: true,  is_carried_forward: false, is_rate_stale: false}
        - {currency_code: "AAA", date_day: "2024-01-02", units_per_eur: 10.0, rate_source_date: "2024-01-01", days_since_published_rate: 1, is_published_rate: false, is_carried_forward: true,  is_rate_stale: false}
        - {currency_code: "AAA", date_day: "2024-01-03", units_per_eur: 10.0, rate_source_date: "2024-01-01", days_since_published_rate: 2, is_published_rate: false, is_carried_forward: true,  is_rate_stale: false}
        - {currency_code: "AAA", date_day: "2024-01-04", units_per_eur: 10.0, rate_source_date: "2024-01-01", days_since_published_rate: 3, is_published_rate: false, is_carried_forward: true,  is_rate_stale: false}
        # BBB has no 2024-01-01 row at all: outside its quoted lifetime.
        - {currency_code: "BBB", date_day: "2024-01-02", units_per_eur: 20.0, rate_source_date: "2024-01-02", days_since_published_rate: 0, is_published_rate: true,  is_carried_forward: false, is_rate_stale: false}
        - {currency_code: "BBB", date_day: "2024-01-03", units_per_eur: 20.0, rate_source_date: "2024-01-02", days_since_published_rate: 1, is_published_rate: false, is_carried_forward: true,  is_rate_stale: false}
        - {currency_code: "BBB", date_day: "2024-01-04", units_per_eur: 40.0, rate_source_date: "2024-01-04", days_since_published_rate: 0, is_published_rate: true,  is_carried_forward: false, is_rate_stale: false}

  - name: fx_daily_stops_carrying_a_rate_once_it_passes_the_cap
    model: fct_fx_rates_daily
    description: >
      `fx_max_carry_forward_days` is 7, and no data test can see it: a rate
      carried 8 days is as well-formed as one carried 2. Removing the cap
      altogether prices all 3,359 stale rows and leaves the model contradicting
      itself — `is_rate_stale` true beside a usable rate — with every data test
      green. One currency, one gap that runs past the cap, then a second fixing
      that resets the age: the last row proves the carry restarts rather than
      staying stale for the rest of the series. The calendar deliberately runs
      wider than the currency's quoted life at both ends, so the 1st and the
      17th must not appear.
    given:
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-01-01", date_key: 20240101, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-02", date_key: 20240102, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-03", date_key: 20240103, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-04", date_key: 20240104, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-05", date_key: 20240105, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-06", date_key: 20240106, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-07", date_key: 20240107, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-08", date_key: 20240108, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-09", date_key: 20240109, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-10", date_key: 20240110, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-11", date_key: 20240111, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-12", date_key: 20240112, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-13", date_key: 20240113, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-14", date_key: 20240114, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-15", date_key: 20240115, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-16", date_key: 20240116, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
          - {date_day: "2024-01-17", date_key: 20240117, year: 2024, quarter: 1, month: 1, half: 1, is_weekday: true}
      - input: ref('dim_currency')
        rows:
          - {currency_code: "TST", is_quoted: true, first_published_date: "2024-01-02", last_published_date: "2024-01-16"}
      - input: ref('fct_fx_rates_published')
        rows:
          - {rate_date: "2024-01-02", currency_code: "TST", base_currency: "EUR", units_per_eur: 10.0, eur_per_unit: 0.1}
          # The gap runs 01-03 to 01-10, then a fresh fixing lands.
          - {rate_date: "2024-01-11", currency_code: "TST", base_currency: "EUR", units_per_eur: 20.0, eur_per_unit: 0.05}
    expect:
      rows:
        # The fixing itself, then the first carried day. Pattern for the rest.
        - {date_day: "2024-01-02", units_per_eur: 10.0, days_since_published_rate: 0, is_rate_stale: false}
        - {date_day: "2024-01-03", units_per_eur: 10.0, days_since_published_rate: 1, is_rate_stale: false}
        - {date_day: "2024-01-04", units_per_eur: 10.0, days_since_published_rate: 2, is_rate_stale: false}
        - {date_day: "2024-01-05", units_per_eur: 10.0, days_since_published_rate: 3, is_rate_stale: false}
        - {date_day: "2024-01-06", units_per_eur: 10.0, days_since_published_rate: 4, is_rate_stale: false}
        - {date_day: "2024-01-07", units_per_eur: 10.0, days_since_published_rate: 5, is_rate_stale: false}
        - {date_day: "2024-01-08", units_per_eur: 10.0, days_since_published_rate: 6, is_rate_stale: false}
        # Age 7 is the last day inside the cap: `<= 7` keeps the rate and
        # `> 7` leaves the flag false. Both mutations of that boundary land here.
        - {date_day: "2024-01-09", units_per_eur: 10.0, days_since_published_rate: 7, is_rate_stale: false}
        # Age 8. The rate goes null the moment the row is stale — the two are
        # one decision, which is what an `is_rate_stale` of `>=` would break.
        - {date_day: "2024-01-10", units_per_eur: null, days_since_published_rate: 8, is_rate_stale: true}
        # A fresh fixing resets the age; the carry restarts rather than staying
        # stale for the rest of the currency's life.
        - {date_day: "2024-01-11", units_per_eur: 20.0, days_since_published_rate: 0, is_rate_stale: false}
        - {date_day: "2024-01-12", units_per_eur: 20.0, days_since_published_rate: 1, is_rate_stale: false}
        - {date_day: "2024-01-13", units_per_eur: 20.0, days_since_published_rate: 2, is_rate_stale: false}
        - {date_day: "2024-01-14", units_per_eur: 20.0, days_since_published_rate: 3, is_rate_stale: false}
        - {date_day: "2024-01-15", units_per_eur: 20.0, days_since_published_rate: 4, is_rate_stale: false}
        - {date_day: "2024-01-16", units_per_eur: 20.0, days_since_published_rate: 5, is_rate_stale: false}

  # ---------------------------------------------------------------------------
  # fct_fx_rates_periods — the aggregation.
  #
  # Seven mutations against a warehouse copy. The model has 23 data tests and
  # only one of them notices anything:
  #
  # | mutation                                    | 23 data tests | effect                                        |
  # |---------------------------------------------|---------------|-----------------------------------------------|
  # | `avg_eur_per_unit` = 1 / `avg_units_per_eur`| all pass      | USD 2008 0.683499 -> 0.679923; ISK 2008 off 11.9% |
  # | `max()` for `arg_max(.., rate_date)`        | all pass      | USD 2014 period end 1.2141 -> 1.3953, `period_end_vs_avg_pct` **flips** -8.61% -> +5.03% |
  # | `min()` for `arg_min(.., rate_date)`        | all pass      | `period_start_units_per_eur` wrong on 16,975 rows (85.9%) |
  # | `period_is_complete` `<` instead of `<=`    | all pass      | **nothing at all** — no period ends on the series end |
  # | `period_end_is_stale` `>=` instead of `>`   | all pass      | **nothing at all** — no period-end sits on the cap |
  # | staleness clock to `period_end_date`        | all pass      | 87 of the 116 open periods become stale, every one a false alarm |
  # | average over dense `fct_fx_rates_daily`     | **1 fails**   | caught by `fx_periods_annual_buckets_cover_every_fixing` |
  #
  # The one that fails is the reason to keep that model-level test: summing
  # `n_published_days` over the year buckets and comparing it with the published
  # row count is what makes averaging the gap-filled table impossible to miss.
  # Everything else here is a number that is positive, non-null and inside every
  # range, which is all the column tests can ask.
  #
  # **The staleness distribution is bimodal and the cap sits in the gap**, which
  # is why its boundary joins `period_is_complete`'s in the unreachable column:
  # 19,743 period-ends are 0-3 days old, then nothing at all until 22, and the
  # remaining 22 run 22 / 30 / 62 / 121 / 184 / 305. Any cap from 4 to 21 selects
  # the same 22 rows, so `fx_max_carry_forward_days` is not finely tuned here —
  # it is a threshold in an 18-day-wide empty band, which is a better defence of
  # the number than precision would have been.

  - name: fx_periods_takes_the_last_fixing_of_a_period_not_the_highest
    model: fct_fx_rates_periods
    description: >
      `period_end_*` is `arg_max(.., rate_date)` and `period_start_units_per_eur`
      is `arg_min(.., rate_date)` — the *chronologically* last and first fixing,
      not the largest and smallest. `max()` and `min()` are the plausible slips
      and neither is visible: both return a real rate from inside the period,
      positive and in range. `min()` for the start is wrong on 85.9% of the
      warehouse; `max()` for the end flips the sign of `period_end_vs_avg_pct` on
      USD 2014, which is the column the whole model exists to provide. The
      fixture therefore makes the period *fall* to a low it did not start at and
      peak in the middle, so last, first, max and min are four different numbers.
    given:
      - input: ref('fct_fx_rates_published')
        rows:
          - {rate_date: "2024-03-01", currency_code: "TST", base_currency: "EUR", units_per_eur: 20.0, eur_per_unit: 0.05}
          - {rate_date: "2024-03-15", currency_code: "TST", base_currency: "EUR", units_per_eur: 30.0, eur_per_unit: 0.0333333}
          - {rate_date: "2024-03-29", currency_code: "TST", base_currency: "EUR", units_per_eur: 10.0, eur_per_unit: 0.1}
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-03-01", year: 2024, quarter: 1, half: 1, month_start_date: "2024-03-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-03-15", year: 2024, quarter: 1, half: 1, month_start_date: "2024-03-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-03-29", year: 2024, quarter: 1, half: 1, month_start_date: "2024-03-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
    expect:
      rows:
        # All three fixings fall in one month, so every period type sees the
        # same three and the four rows differ only in their labels and bounds.
        # start 20 (not the min, 10), end 10 (not the max, 30), avg 20,
        # so period_end_vs_avg_pct is -50 and `max()` would make it +50.
        - {period_type: "month",   period_label: "2024-03",  period_start_units_per_eur: 20.0, period_end_units_per_eur: 10.0, min_units_per_eur: 10.0, max_units_per_eur: 30.0, avg_units_per_eur: 20.0, period_end_vs_avg_pct: -50.0, intra_period_range_pct: 200.0, n_published_days: 3}
        - {period_type: "quarter", period_label: "2024-q1", period_start_units_per_eur: 20.0, period_end_units_per_eur: 10.0, min_units_per_eur: 10.0, max_units_per_eur: 30.0, avg_units_per_eur: 20.0, period_end_vs_avg_pct: -50.0, intra_period_range_pct: 200.0, n_published_days: 3}
        - {period_type: "half",    period_label: "2024-1",  period_start_units_per_eur: 20.0, period_end_units_per_eur: 10.0, min_units_per_eur: 10.0, max_units_per_eur: 30.0, avg_units_per_eur: 20.0, period_end_vs_avg_pct: -50.0, intra_period_range_pct: 200.0, n_published_days: 3}
        - {period_type: "year",    period_label: "2024",    period_start_units_per_eur: 20.0, period_end_units_per_eur: 10.0, min_units_per_eur: 10.0, max_units_per_eur: 30.0, avg_units_per_eur: 20.0, period_end_vs_avg_pct: -50.0, intra_period_range_pct: 200.0, n_published_days: 3}

  - name: fx_periods_averages_each_direction_over_its_own_series
    model: fct_fx_rates_periods
    description: >
      The mean of the reciprocals is not the reciprocal of the mean, and
      `avg_eur_per_unit` is the former. Writing it as `1 / avg_units_per_eur` is
      the natural-looking simplification and it passes all 23 data tests: the
      number stays positive and non-null, and it is only 0.07% out in a calm
      year. The gap grows with how far the rate moved inside the period — 0.52%
      for EUR/USD in 2008 and **11.9% for the Icelandic krona that same year** —
      so it is largest exactly when someone is most likely to be looking. Two
      fixings four-fold apart make the two constructions unmistakable: the mean
      of 0.5 and 0.125 is 0.3125, while one over the mean of 2 and 8 is 0.2.
      Every value here is exact in binary floating point on purpose.
      `period_end_eur_per_unit` is asserted alongside because a single point
      *does* invert exactly — 1/8 is 0.125 — and that asymmetry is the reason
      only the averages need care.
    given:
      - input: ref('fct_fx_rates_published')
        rows:
          - {rate_date: "2024-05-10", currency_code: "TST", base_currency: "EUR", units_per_eur: 2.0, eur_per_unit: 0.5}
          - {rate_date: "2024-05-20", currency_code: "TST", base_currency: "EUR", units_per_eur: 8.0, eur_per_unit: 0.125}
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-05-10", year: 2024, quarter: 2, half: 1, month_start_date: "2024-05-01", quarter_start_date: "2024-04-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-05-20", year: 2024, quarter: 2, half: 1, month_start_date: "2024-05-01", quarter_start_date: "2024-04-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
    expect:
      rows:
        - {period_type: "month",   period_label: "2024-05",  avg_units_per_eur: 5.0, avg_eur_per_unit: 0.3125, period_end_eur_per_unit: 0.125}
        - {period_type: "quarter", period_label: "2024-q2", avg_units_per_eur: 5.0, avg_eur_per_unit: 0.3125, period_end_eur_per_unit: 0.125}
        - {period_type: "half",    period_label: "2024-1",  avg_units_per_eur: 5.0, avg_eur_per_unit: 0.3125, period_end_eur_per_unit: 0.125}
        - {period_type: "year",    period_label: "2024",    avg_units_per_eur: 5.0, avg_eur_per_unit: 0.3125, period_end_eur_per_unit: 0.125}

  - name: fx_periods_counts_a_period_complete_on_the_day_the_series_reaches_its_end
    model: fct_fx_rates_periods
    description: >
      `period_is_complete` is `period_end_date <= max(rate_date)`, and its
      boundary is unreachable by the warehouse: **no period ends on the series
      end date**, so changing `<=` to `<` moves nothing at all. It is only live
      on the days the ECB's last fixing happens to land on a month, quarter,
      half or year end — roughly one day in thirty for the month grain and one
      in three hundred and sixty-five for the year. Same category as `dim_date`'s
      eleven unbuilt fiscal policies: a branch the data cannot reach, so the
      fixture poses it. The last fixing here is 31 January, so the month is
      complete on the nose and the three longer periods are not.
    given:
      - input: ref('fct_fx_rates_published')
        rows:
          - {rate_date: "2024-01-02", currency_code: "TST", base_currency: "EUR", units_per_eur: 4.0, eur_per_unit: 0.25}
          - {rate_date: "2024-01-31", currency_code: "TST", base_currency: "EUR", units_per_eur: 4.0, eur_per_unit: 0.25}
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-01-02", year: 2024, quarter: 1, half: 1, month_start_date: "2024-01-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-01-31", year: 2024, quarter: 1, half: 1, month_start_date: "2024-01-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
    expect:
      rows:
        # The month ends exactly on the series end: complete under `<=`, and the
        # single row a `<` would take away.
        - {period_type: "month",   period_end_date: "2024-01-31", period_is_complete: true}
        - {period_type: "quarter", period_end_date: "2024-03-31", period_is_complete: false}
        - {period_type: "half",    period_end_date: "2024-06-30", period_is_complete: false}
        - {period_type: "year",    period_end_date: "2024-12-31", period_is_complete: false}

  - name: fx_periods_ages_the_closing_fixing_against_the_last_date_it_speaks_for
    model: fct_fx_rates_periods
    description: >
      `period_end_is_stale` is this model's half of the staleness policy
      `fct_fx_rates_daily` has always had, and both of its plausible
      implementations are wrong in a way no data test can see — the column stays
      a non-null boolean either way.

      **Reading `is_rate_stale` off the sibling instead of computing it here**
      catches 5 of the warehouse's 22 stale period-ends. The daily model stops
      emitting rows once a currency leaves the ECB's panel, so the 17 rows that
      most need the flag have nothing to join to and a left join calls them
      clean. That mutation is unreachable from a unit test — it is a missing
      join, not a wrong value — which is why the model comment carries the
      argument and this fixture pins what is left.

      **Ageing the fixing against `period_end_date` alone** is the reachable one,
      and it flags 87 of the warehouse's 116 open periods: a period that has not
      finished has a period end in the future, so every current month, quarter,
      half and year is stale by construction. `least(period_end_date,
      series_end_date)` asks how old the fixing is relative to the last date the
      value could be speaking for. LIV's half and year below are the pin — both
      incomplete, both quoting a fixing that *is* the series end, both fresh.

      The third mutation is the cap boundary, and **no row in the warehouse sits
      on it** — the staleness distribution stops at 3 days and resumes at 22, so
      `>=` for `>` moves nothing at all and only a fixture can pose the
      question. CAP therefore publishes its last fixing seven days before its
      month ends: at the cap and so **not** stale, the same `<=` the daily model
      uses. CAP's longer periods run past the cap and are stale while
      incomplete, which is the case the flag exists to catch early — a currency
      that stops publishing mid-period, before it has aged into a finished
      one.
    given:
      - input: ref('fct_fx_rates_published')
        rows:
          # CAP leaves the panel on 24 January; LIV publishes on to 31 March and
          # so sets the series end for both.
          - {rate_date: "2024-01-24", currency_code: "CAP", base_currency: "EUR", units_per_eur: 4.0, eur_per_unit: 0.25}
          - {rate_date: "2024-01-31", currency_code: "LIV", base_currency: "EUR", units_per_eur: 4.0, eur_per_unit: 0.25}
          - {rate_date: "2024-03-31", currency_code: "LIV", base_currency: "EUR", units_per_eur: 4.0, eur_per_unit: 0.25}
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-01-24", year: 2024, quarter: 1, half: 1, month_start_date: "2024-01-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-01-31", year: 2024, quarter: 1, half: 1, month_start_date: "2024-01-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
          - {date_day: "2024-03-31", year: 2024, quarter: 1, half: 1, month_start_date: "2024-03-01", quarter_start_date: "2024-01-01", half_start_date: "2024-01-01", year_start_date: "2024-01-01"}
    expect:
      rows:
        # CAP's month ends 7 days after its last fixing — on the cap, not past
        # it. `>=` would flip this row and nothing else here.
        - {currency_code: "CAP", period_type: "month",   period_label: "2024-01",  period_is_complete: true,  period_end_stale_days: 7,  period_end_is_stale: false}
        # 24 Jan to 31 Mar is 7 + 29 + 31 = 67 days. The quarter has finished;
        # the half and the year have not, and are stale all the same because the
        # currency stopped rather than the calendar.
        - {currency_code: "CAP", period_type: "quarter", period_label: "2024-q1", period_is_complete: true,  period_end_stale_days: 67, period_end_is_stale: true}
        - {currency_code: "CAP", period_type: "half",    period_label: "2024-1",  period_is_complete: false, period_end_stale_days: 67, period_end_is_stale: true}
        - {currency_code: "CAP", period_type: "year",    period_label: "2024",    period_is_complete: false, period_end_stale_days: 67, period_end_is_stale: true}
        # LIV is current in every period. Its half and year are incomplete and
        # fresh — the two rows that fail if the clock runs to `period_end_date`
        # instead of stopping at the series end.
        - {currency_code: "LIV", period_type: "month",   period_label: "2024-01",  period_is_complete: true,  period_end_stale_days: 0,  period_end_is_stale: false}
        - {currency_code: "LIV", period_type: "month",   period_label: "2024-03",  period_is_complete: true,  period_end_stale_days: 0,  period_end_is_stale: false}
        - {currency_code: "LIV", period_type: "quarter", period_label: "2024-q1", period_is_complete: true,  period_end_stale_days: 0,  period_end_is_stale: false}
        - {currency_code: "LIV", period_type: "half",    period_label: "2024-1",  period_is_complete: false, period_end_stale_days: 0,  period_end_is_stale: false}
        - {currency_code: "LIV", period_type: "year",    period_label: "2024",    period_is_complete: false, period_end_stale_days: 0,  period_end_is_stale: false}

  # ---------------------------------------------------------------------------
  # fct_retail_returns — the inferred join.
  #
  # Six mutations against a warehouse copy, all eleven data tests green on every
  # one:
  #
  # | mutation                                      | effect                                          |
  # |-----------------------------------------------|-------------------------------------------------|
  # | `match_status` checks "no prior purchase" first | 352 unmatchable rows change bucket            |
  # | "quantity exceeds" uses `>=`                  | matched 16,032 -> 10,416, excess 366 -> 5,982   |
  # | `quantity_is_consistent` uses `<`             | consistent 16,032 -> 10,416                     |
  # | `returns` drops `item_type = 'product'`       | +1,207 rows: postage and fee cancellations      |
  # | `purchases` drops `quantity > 0`              | **nothing** — every write-off is anonymous, so  |
  # |                                               | `customer_id is not null` already excludes them |
  # | asof `>=` becomes `>`                         | 88 rows re-resolved: 2 unmatched, 86 moved to   |
  # |                                               | an older sale. `matched` *rises* by 2           |
  #
  # The middle two land on the same 10,416 because both turn on
  # `quantity_returned = original_quantity` (5,616 rows).
  #
  # `accepted_values` on `match_status` is the trap the retail skill already
  # names: it proves the answer is in the list, never that it is the right
  # member, and the first three mutations move tens of thousands of rows between
  # legal buckets without touching a total.
  #
  # The matching-rule mutations (the `item_type` filter, `quantity > 0`, the
  # asof boundary) and the tie-break are pinned in `int_retail_return_matches`;
  # the table stays whole because it was measured whole. Below is the `case`,
  # mocked on matched rows.

  - name: retail_returns_names_each_miss_by_the_reason_it_missed
    model: fct_retail_returns
    description: >
      Four outcomes and the order they are tested in. A return with no customer
      id is structurally unmatchable and a return whose purchase predates the
      extract is left-censored; both arrive from `int_retail_return_matches`
      with a null original, so only the order of the `case` separates them.
      Swapping the first two branches relabels all 352 no-customer rows as "no
      prior purchase in window" and every data test stays green, because both
      strings are in `accepted_values`. This is the classification half of the
      returns model and nothing else: the matching rule's own edges — the
      non-product filter and the `>=` on the asof condition — are asserted in
      `int_retail_return_matches`, against the model that decides them. Posing
      matched rows directly is what makes the `case` the only thing under test;
      it used to be reached through eight raw invoice lines and an inferred
      join.
    given:
      # Three rows, and only because the model joins the calendar for
      # `date_key` — the same conformed key `fct_retail_order_line` carries at
      # the identical grain. Nothing here is under test; it exists so the inner
      # join keeps all four posed returns, which is itself the assertion that
      # the join cannot silently drop one.
      - input: ref('dim_date')
        rows:
          - {date_day: "2024-01-10", date_key: 20240110}
          - {date_day: "2024-01-11", date_key: 20240111}
          - {date_day: "2024-01-12", date_key: 20240112}
      - input: ref('int_retail_return_matches')
        rows:
          # Within the purchase: a clean match.
          - {invoice: "C601", line_number: 1, customer_id: "C1", stock_code: "SKU1", quantity_returned: 3, unit_price: 2.0, return_amount_gbp: -6.0, invoice_date: "2024-01-10", original_invoice: "500", original_line_number: 1, original_invoice_date: "2024-01-05", original_quantity: 5, original_unit_price: 2.0, original_amount_gbp: 10.0}
          # More than was bought: the rule found a sale, but the wrong one.
          - {invoice: "C602", line_number: 1, customer_id: "C1", stock_code: "SKU1", quantity_returned: 8, unit_price: 2.0, return_amount_gbp: -16.0, invoice_date: "2024-01-12", original_invoice: "500", original_line_number: 1, original_invoice_date: "2024-01-05", original_quantity: 5, original_unit_price: 2.0, original_amount_gbp: 10.0}
          # No customer id: nothing to match *on*. Kept, not dropped.
          - {invoice: "C603", line_number: 1, customer_id: null, stock_code: "SKU1", quantity_returned: 1, unit_price: 2.0, return_amount_gbp: -2.0, invoice_date: "2024-01-11", original_invoice: null, original_line_number: null, original_invoice_date: null, original_quantity: null, original_unit_price: null, original_amount_gbp: null}
          # A customer who never bought this in the window: left-censored. Both
          # this and the row above reach the `case` as a null match, which is
          # exactly why the branch order is the thing worth pinning.
          - {invoice: "C604", line_number: 1, customer_id: "C2", stock_code: "SKU9", quantity_returned: 2, unit_price: 2.0, return_amount_gbp: -4.0, invoice_date: "2024-01-11", original_invoice: null, original_line_number: null, original_invoice_date: null, original_quantity: null, original_unit_price: null, original_amount_gbp: null}
    expect:
      rows:
        - {invoice: "C601", quantity_returned: 3, match_status: "matched",                            is_matched: true,  original_quantity: 5,    quantity_is_consistent: true,  days_to_return: 5}
        - {invoice: "C602", quantity_returned: 8, match_status: "matched, quantity exceeds purchase", is_matched: true,  original_quantity: 5,    quantity_is_consistent: false, days_to_return: 7}
        - {invoice: "C603", quantity_returned: 1, match_status: "no customer id",                     is_matched: false, original_quantity: null, quantity_is_consistent: null,  days_to_return: null}
        - {invoice: "C604", quantity_returned: 2, match_status: "no prior purchase in window",        is_matched: false, original_quantity: null, quantity_is_consistent: null,  days_to_return: null}
  # --- fct_retail_customer_cohorts -----------------------------------------
  #
  # Eleven data tests, and neither of the two things that define the triangle's
  # *edge* is among them. Mutated against a warehouse copy, running the model's
  # full data suite each time:
  #
  # | mutation                                    | effect                                          |
  # |---------------------------------------------|-------------------------------------------------|
  # | `<=` to `<` on the ragged bound             | the last diagonal vanishes: 325 rows -> 300,    |
  # |                                             | 615 active customers and GBP 342k with it       |
  # | `is_complete_period` `<` to `<=`            | 300 complete -> 325. Every still-open period    |
  # |                                             | is relabelled finished; no other column moves   |
  # | revenue uses activity's filter              | +GBP 949,283 and +12.4% on                      |
  # |                                             | `revenue_per_active_customer_gbp`               |
  # | drop `quantity > 0` from `activity`         | nothing at all                                  |
  #
  # All four stay green. Only two mutations go red, both on
  # `fct_retail_cohorts_month_zero_is_full_retention`: pointing `activity` at
  # `is_revenue_line`, and adding a month to the offset arithmetic.
  #
  # That test is the shape worth copying — it pins a *structural* property (a
  # cohort is defined by its first purchase, so month zero is 100% by
  # construction) rather than a value, and it is why `activity`'s filter is not
  # free to change: it has to agree with `dim_retail_customer`'s `purchases`,
  # which is the identical `invoice_type = 'sale' and quantity > 0`. What it
  # cannot see is anything about `monthly_revenue`, filtered on
  # `is_revenue_line` instead. Both filters are right — "active" means bought,
  # "revenue" means net product revenue — but only one end of the ratio is
  # anchored, which is why the third mutation is invisible. 88 of 25,598 active
  # customer-months (0.34%) sit in that gap: in the denominator of
  # `revenue_per_active_customer_gbp` and not its numerator.
  #
  # `quantity > 0` is dead here for the reason it is dead in
  # `int_retail_return_matches`' `purchases`: every stock write-off is
  # anonymous, so `customer_id is not null` has already excluded them. It stays
  # because it states the intent. Only the other one is posed by a fixture —
  # `..._never_point_at_a_stock_write_off` — and that is a judgement about
  # consequence rather than an oversight: a write-off admitted to the *matching*
  # rule makes a return point at a sale that never happened and writes five
  # `original_*` columns off it, which is a wrong answer rather than a missing
  # one. What it would do to this model has not been measured, so nothing here
  # claims it is harmless.
  #
  # **One fixture, four tests, each asserting a different column set**, so a
  # failure names which edge moved. The fixture has a gap month (which must
  # survive as a zero row), a customer returning in the last month, and a
  # postage line that is a purchase but not revenue — without which the two
  # filters select identically and the asymmetry above is unreachable.

  - name: cohorts_triangle_stops_at_the_last_month_of_data
    model: fct_retail_customer_cohorts
    description: >
      The ragged edge. Offsets run `0..date_diff(cohort_month, last_month)`
      inclusive, so a cohort first seen in January with data through March gets
      three rows and not two. `<` in place of `<=` deletes the newest diagonal
      of every cohort — 25 of 325 rows in the warehouse — and leaves a table
      that is still unique on its grain, still has month zero at 100%, and is
      simply missing the most recent month anyone would look at. February is
      the other half: a month nobody bought in is a zero row, not an absent
      one, or a retention curve closes silently over its own holes.
    overrides:
      vars:
        # Pinned rather than inherited: the project builds 36 and the widest
        # cohort in the extract is 24 months, so the cap has never bound.
        # `cohorts_offsets_stop_at_the_configured_cap` is the only place it is
        # reachable at all.
        retail_max_cohort_age_months: 36
    given: &cohort_fixture
      - input: ref('dim_retail_customer')
        rows:
          - {customer_id: "C1", cohort_month: "2024-01", is_left_censored_cohort: false}
          - {customer_id: "C2", cohort_month: "2024-01", is_left_censored_cohort: false}
      - input: ref('stg_retail_lines')
        rows:
          # Both arrive in January: month zero is the whole cohort.
          - {customer_id: "C1", invoice_month: "2024-01", invoice_type: "sale", quantity: 1, line_amount_gbp: 100.0, is_revenue_line: true}
          - {customer_id: "C2", invoice_month: "2024-01", invoice_type: "sale", quantity: 1, line_amount_gbp: 50.0, is_revenue_line: true}
          # Nobody buys in February. March is the last month in the data and so
          # the edge under test.
          - {customer_id: "C1", invoice_month: "2024-03", invoice_type: "sale", quantity: 1, line_amount_gbp: 200.0, is_revenue_line: true}
          # Postage: a sale line with a positive quantity, so `activity` counts
          # C2 present in March — and not `is_revenue_line`, so it contributes
          # nothing to the money. This single row is what makes the two filters
          # distinguishable in the fixture.
          - {customer_id: "C2", invoice_month: "2024-03", invoice_type: "sale", quantity: 1, line_amount_gbp: 18.0, is_revenue_line: false}
    expect:
      rows:
        - {months_since_first_order: 0, activity_month: "2024-01", active_customers: 2, retention_pct: 100.0}
        - {months_since_first_order: 1, activity_month: "2024-02", active_customers: 0, retention_pct: 0.0}
        - {months_since_first_order: 2, activity_month: "2024-03", active_customers: 2, retention_pct: 100.0}

  - name: cohorts_mark_only_the_still_open_period_incomplete
    model: fct_retail_customer_cohorts
    description: >
      `is_complete_period` exists to say "this month is still being lived in,
      do not read a retention drop into it". It is `activity_month <
      last_month`, and `<=` makes it uniformly true — the warehouse goes from
      300 complete periods to all 325, so the one row a reader is meant to
      discount becomes the one claiming to be finished. No number moves with it
      and no data test covers the column, which is the blind spot
      `fct_fx_rates_periods.period_is_complete` has too, except that boundary is
      unreachable and this one is every cohort's newest row.
    overrides:
      vars:
        retail_max_cohort_age_months: 36
    given: *cohort_fixture
    expect:
      rows:
        - {activity_month: "2024-01", is_complete_period: true}
        - {activity_month: "2024-02", is_complete_period: true}
        # March *is* `last_month`, so it is the period still open.
        - {activity_month: "2024-03", is_complete_period: false}

  - name: cohorts_count_a_buyer_active_even_when_the_purchase_earns_no_revenue
    model: fct_retail_customer_cohorts
    description: >
      The asymmetry, stated as behaviour rather than left implicit. `active` is
      `invoice_type = 'sale' and quantity > 0`, because it has to agree with the
      cohort definition in `dim_retail_customer`; the money is `is_revenue_line`,
      because that is what net revenue means everywhere else in the warehouse.
      So a customer whose only March purchase is postage is **active and worth
      nothing**, and `revenue_per_active_customer_gbp` is a ratio across two
      populations — 88 of 25,598 active customer-months in the warehouse.
      Pointing the money at activity's filter instead moves GBP 949,283 and
      12.4% of that ratio with every data test green. Whether the two should be
      reconciled is a modelling decision; this pins which one is in force.
    overrides:
      vars:
        retail_max_cohort_age_months: 36
    given: *cohort_fixture
    expect:
      rows:
        # 150 over two buyers.
        - {activity_month: "2024-01", active_customers: 2, net_revenue_gbp: 150.0, revenue_per_active_customer_gbp: 75.0}
        # A hole: no buyers, no money, and no division.
        - {activity_month: "2024-02", active_customers: 0, net_revenue_gbp: 0.0, revenue_per_active_customer_gbp: null}
        # Two active, one of them earning nothing: the GBP 18 of postage is
        # absent from the numerator while C2 is present in the denominator, so
        # the ratio is 200/2 and not 218/2 or 200/1.
        - {activity_month: "2024-03", active_customers: 2, net_revenue_gbp: 200.0, revenue_per_active_customer_gbp: 100.0}

  - name: cohorts_offsets_stop_at_the_configured_cap
    model: fct_retail_customer_cohorts
    description: >
      `retail_max_cohort_age_months` is configurable and has never bound: the
      project sets 36 and the widest cohort in the extract is 24 months, so the
      `generate_series` ceiling is unreachable by construction the way
      `dim_date`'s eleven unbuilt fiscal policies are. Overriding it is the only
      way to reach it. With a cap of 1 the same three months of data must yield
      two diagonals, not three — the cap binds before the ragged bound does, so
      a reader who lowers this var to shorten the triangle gets what they asked
      for rather than a table that ignores them.
    overrides:
      vars:
        retail_max_cohort_age_months: 1
    given: *cohort_fixture
    expect:
      rows:
        - {months_since_first_order: 0, activity_month: "2024-01"}
        - {months_since_first_order: 1, activity_month: "2024-02"}

  # --- dim_retail_customer --------------------------------------------------
  #
  # `dim_retail_customer` carries 11 data tests over 22 columns, and every one
  # of them lands on a date, a count or an identifier. Not one touches money.
  # The two structural tests are `unique(customer_id)` and
  # `last_order_date >= first_order_date`; neither can see a wrong number.
  #
  # Eight mutations against a warehouse copy, running the full data suite each
  # time. **None went red.**
  #
  # | mutation                                | effect                                            |
  # |-----------------------------------------|---------------------------------------------------|
  # | drop `, invoice` from the tie-break     | **not reproducible between builds** — see below   |
  # | `cohort_month` off `lines`, not         | left-censored 955 -> 1,030; tenure +14,914 days   |
  # | `purchases`                             |                                                   |
  # | `first_order_gbp` over every line       | its 47 nulls become values; total +GBP 53,664     |
  # | `min(country)` for `max(country)`       | 13 customers relabelled — caught now, see below   |
  # | drop the sign flip on `return_rate_pct` | mean +5.89% -> -5.89%                             |
  # | `n_orders >= 1` for repeat customers    | 4,255 -> 5,881, i.e. everyone                     |
  # | `n_orders` counts every invoice type    | 36,975 -> 44,811 (+21%)                           |
  # | `left join` to `first_purchase`         | nothing — see the caveat                          |
  #
  # The last proved nothing: the inner join to `first_order_value` still drops
  # the same 61 customers, cancelling the change. So: seven informative
  # mutations, none caught.
  #
  # **The tie-break is the one that matters, and it is the `fct_retail_returns`
  # failure again.** Removing `, invoice` from `first_order_line`'s window makes
  # the model non-deterministic: four builds against byte-identical sources gave
  # `sum(first_order_gbp)` of 2,389,787.55 / 2,392,164.88 / 2,392,755.43 /
  # 2,392,698.88 against a baseline of 2,394,006.56 that held to the penny over
  # three runs. 10 customers have two invoices tied on their earliest timestamp
  # and the tie-break decides all ten; the worst single swing is GBP 1,182.10,
  # and customer 12709's two tied invoices differ by whether `first_order_gbp`
  # is a value or a null at all. `accepted_range` cannot see any of it, because
  # both candidates are legal money.
  #
  # **Five of the eight are covered below. The repeat-customer boundary and
  # `n_orders`' invoice filter are still unguarded** — they are wrong-but-stable,
  # where the others are the ones that either move a published number or make the
  # model disagree with itself between builds.
  #
  # **A ninth defect no mutation reaches:** `max_by` skips null values, so a
  # customer whose winning label maps to no code (a `not_a_country` seed row)
  # would take the other label's code. Latent on current data; the third
  # fixture pins it, and with it `min(country)`.
  #
  # **Separate fixtures**, because the tie-break and the revenue filter surface
  # in the same column (`first_order_gbp`); with one shared fixture each mutation
  # fails two tests and a failure cannot name its rule.
  #
  # So the first fixture is nothing but ties, and the second carries the rest:
  # C2 has an earlier non-purchase row, postage inside its first order and a
  # later return; C3's only line is postage; C4 is the ordinary customer, two
  # clean invoices, present so the normal path is asserted alongside the edges.

  - name: customer_first_order_breaks_a_tied_invoice_the_same_way_every_build
    model: dim_retail_customer
    description: >
      `first_order_line` ranks on `min(invoice_ts)` then `invoice`, and the
      second term is load-bearing: 10 customers in the extract open two invoices
      at the same minute, so without it `row_number()` picks arbitrarily and
      `first_order_gbp` changes between builds for no change in the data.
      `dim_retail_customer` exposes no invoice column, so the value is the only
      observable, and none of these three customers has a non-revenue line —
      nothing but the tie-break can move the numbers this test asserts.
      **Three tied customers, and the count is not decoration.** A single one is
      a flaky test: with the tie-break deleted DuckDB returns the first-listed
      row 92.5% of the time and the correct one by luck 5% (40 trials), so one
      customer passes a broken model about one run in twenty — measured, after
      a first version of this test did exactly that on its third run. The
      correct answer sits **last** for C1, **first** for C1B and **in the
      middle** for C1C, so no positional rule can satisfy all three, and
      `expect` is full-set equality, so one wrong row is a failure.
    given:
      - input: ref('stg_retail_lines')
        rows:
          # C1 — the lowest invoice carries the lowest amount and is listed last.
          - {invoice: "802", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 5, unit_price: 100.0, line_amount_gbp: 500.0, invoice_ts: "2024-01-10 09:00:00", invoice_date: "2024-01-10", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "801", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 3, unit_price: 100.0, line_amount_gbp: 300.0, invoice_ts: "2024-01-10 09:00:00", invoice_date: "2024-01-10", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "800", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 1, unit_price: 100.0, line_amount_gbp: 100.0, invoice_ts: "2024-01-10 09:00:00", invoice_date: "2024-01-10", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          # C1B — winner listed first, so "take the last row" cannot pass either.
          - {invoice: "810", line_number: 1, customer_id: "C1B", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 3, unit_price: 50.0, line_amount_gbp: 150.0, invoice_ts: "2024-01-11 09:00:00", invoice_date: "2024-01-11", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "812", line_number: 1, customer_id: "C1B", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 14, unit_price: 50.0, line_amount_gbp: 700.0, invoice_ts: "2024-01-11 09:00:00", invoice_date: "2024-01-11", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "811", line_number: 1, customer_id: "C1B", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 8, unit_price: 50.0, line_amount_gbp: 400.0, invoice_ts: "2024-01-11 09:00:00", invoice_date: "2024-01-11", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          # C1C — winner in the middle, which no edge rule reaches at all.
          - {invoice: "822", line_number: 1, customer_id: "C1C", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 60, unit_price: 10.0, line_amount_gbp: 600.0, invoice_ts: "2024-01-12 09:00:00", invoice_date: "2024-01-12", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "820", line_number: 1, customer_id: "C1C", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 12, unit_price: 10.0, line_amount_gbp: 120.0, invoice_ts: "2024-01-12 09:00:00", invoice_date: "2024-01-12", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
          - {invoice: "821", line_number: 1, customer_id: "C1C", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 35, unit_price: 10.0, line_amount_gbp: 350.0, invoice_ts: "2024-01-12 09:00:00", invoice_date: "2024-01-12", invoice_month: "2024-01", country: "United Kingdom", is_revenue_line: true}
    expect:
      rows:
        # The lowest invoice wins each tie, whatever order it was listed in.
        - {customer_id: "C1", first_order_gbp: 100.0}
        - {customer_id: "C1B", first_order_gbp: 150.0}
        - {customer_id: "C1C", first_order_gbp: 120.0}

  - name: customer_cohort_is_the_first_purchase_not_the_first_appearance
    model: dim_retail_customer
    description: >
      `first_purchase` reads `purchases`, not `lines`, so a customer who shows
      up on a cancellation before they ever buy anything is dated from the
      purchase. 140 customers in the extract have an earlier non-purchase row,
      and dating them from it puts them in a cohort they bought nothing in —
      which also drags the extract's first cohort month backwards and
      relabels 75 more cohorts as left-censored (955 -> 1,030). Every data test
      stays green: `cohort_month` is `not_null` and nothing else, and a wrong
      month is as non-null as a right one. C2 carries the December cancellation
      that makes the two readings differ. `first_order_date` is asserted beside
      it, and C4's two purchase dates are what hold it to `min` rather than
      `max` — both aggregates return the same answer for a customer who bought
      on one day, which is every other customer here.
    given: &customer_fixture
      - input: ref('stg_retail_lines')
        rows:
          # C2 — an earlier non-purchase row, then the first real order, then a
          # return. The December cancellation is what separates "first
          # appearance" from "first purchase"; the postage line on invoice 900
          # is what separates the first order's *value* from its *total*; the
          # February cancellation is the only return in the fixture.
          - {invoice: "C900", line_number: 1, customer_id: "C2", stock_code: "POST", invoice_type: "cancellation", item_type: "postage", quantity: -1, unit_price: 12.0, line_amount_gbp: -12.0, invoice_ts: "2023-12-20 10:00:00", invoice_date: "2023-12-20", invoice_month: "2023-12", country: "France", is_revenue_line: false}
          - {invoice: "900", line_number: 1, customer_id: "C2", stock_code: "SKU2", invoice_type: "sale", item_type: "product", quantity: 4, unit_price: 50.0, line_amount_gbp: 200.0, invoice_ts: "2024-01-15 10:00:00", invoice_date: "2024-01-15", invoice_month: "2024-01", country: "France", is_revenue_line: true}
          - {invoice: "900", line_number: 2, customer_id: "C2", stock_code: "POST", invoice_type: "sale", item_type: "postage", quantity: 1, unit_price: 15.0, line_amount_gbp: 15.0, invoice_ts: "2024-01-15 10:00:00", invoice_date: "2024-01-15", invoice_month: "2024-01", country: "France", is_revenue_line: false}
          - {invoice: "C901", line_number: 1, customer_id: "C2", stock_code: "SKU2", invoice_type: "cancellation", item_type: "product", quantity: -1, unit_price: 50.0, line_amount_gbp: -50.0, invoice_ts: "2024-02-15 10:00:00", invoice_date: "2024-02-15", invoice_month: "2024-02", country: "France", is_revenue_line: true}
          # C3 — a purchase that earns nothing. `sale` with a positive quantity,
          # so it is a real first order, and no revenue line anywhere in it.
          - {invoice: "950", line_number: 1, customer_id: "C3", stock_code: "POST", invoice_type: "sale", item_type: "postage", quantity: 1, unit_price: 18.0, line_amount_gbp: 18.0, invoice_ts: "2024-03-01 11:00:00", invoice_date: "2024-03-01", invoice_month: "2024-03", country: "Germany", is_revenue_line: false}
          # C4 — the ordinary customer: all product, nothing sent back, and two
          # purchases on different dates — the only rows in either fixture that
          # separate `min(invoice_date)` from `max`.
          - {invoice: "960", line_number: 1, customer_id: "C4", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 2, unit_price: 40.0, line_amount_gbp: 80.0, invoice_ts: "2024-01-20 12:00:00", invoice_date: "2024-01-20", invoice_month: "2024-01", country: "Spain", is_revenue_line: true}
          - {invoice: "961", line_number: 1, customer_id: "C4", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 3, unit_price: 40.0, line_amount_gbp: 120.0, invoice_ts: "2024-02-20 12:00:00", invoice_date: "2024-02-20", invoice_month: "2024-02", country: "Spain", is_revenue_line: true}
    expect:
      rows:
        # December is when C2 first appears. January is when they first buy.
        - {customer_id: "C2", first_order_date: "2024-01-15", cohort_month: "2024-01"}
        - {customer_id: "C3", first_order_date: "2024-03-01", cohort_month: "2024-03"}
        - {customer_id: "C4", first_order_date: "2024-01-20", cohort_month: "2024-01"}

  - name: customer_first_order_value_is_revenue_only_and_null_when_there_is_none
    model: dim_retail_customer
    description: >
      `first_order_gbp` sums `line_amount_gbp` filtered on `is_revenue_line`,
      exactly as `net_revenue_gbp` does, so the two are the same measurement
      over different windows and the ratio between them means something. Two
      consequences, and the second is the one no data test can reach: postage
      and vouchers on the first invoice are excluded from its value, and a first
      order carrying no revenue line at all is **null, not zero** — 47 customers
      in the extract, whose orders are a Manual adjustment or the test SKU. Zero
      would say they bought nothing; null says this order has no revenue
      reading. Dropping the filter takes all 47 nulls to values and the total up
      by GBP 53,664, under an `accepted_range` that never sees a null either way.
    given: *customer_fixture
    expect:
      rows:
        # GBP 200 of product, and the GBP 15 of postage on the same invoice is
        # not part of what the customer arrived with.
        - {customer_id: "C2", first_order_gbp: 200.0, gross_revenue_gbp: 200.0, net_revenue_gbp: 150.0}
        # A real first order with no revenue in it. Null all the way down.
        - {customer_id: "C3", first_order_gbp: null, gross_revenue_gbp: null, net_revenue_gbp: null}
        # Two orders, GBP 200 in total, of which GBP 80 is what they arrived
        # with — the pair of columns the whole first-order analysis rests on.
        - {customer_id: "C4", first_order_gbp: 80.0, gross_revenue_gbp: 200.0, net_revenue_gbp: 200.0}

  - name: customer_return_rate_is_a_positive_share_of_what_they_bought
    model: dim_retail_customer
    description: >
      `returned_gbp` is negative — a return is a negative line amount — so
      `return_rate_pct` carries a `-100.0` to come out positive, and "a 25%
      return rate" reads the way anyone would expect. The column has **no data
      test at all**: dropping the sign flip turns the warehouse mean from +5.89%
      to -5.89% and nothing anywhere goes red. It is also measured by value and
      not by order count, deliberately — a customer who returns one item from
      each of ten orders is not the same risk as one who sends back a pallet.
      Null, not zero, where there is nothing to divide — and C3 and C4 are blank
      for different reasons: C3 has no revenue to measure against, C4 simply
      never sent anything back.
    given: *customer_fixture
    expect:
      rows:
        # GBP 50 back out of GBP 200 in: a quarter, stated positive.
        - {customer_id: "C2", returned_gbp: -50.0, return_rate_pct: 25.0}
        - {customer_id: "C3", returned_gbp: null, return_rate_pct: null}
        - {customer_id: "C4", returned_gbp: null, return_rate_pct: null}

  - name: customer_country_code_belongs_to_the_label_the_dimension_picked
    model: dim_retail_customer
    description: >
      `country` and `country_iso3` are two aggregates over the same rows, and
      the row is only coherent if they agree about which country won. The
      pairing is what `max_by` is there for — but **`max_by` skips nulls**:
      DuckDB's `arg_max` ignores rows whose value argument is null, and three
      seed labels map to no code on purpose. So the plain
      `max_by(country_iso3, country)` returned the code of a *different* label
      whenever the winning one was `Unspecified`, `West Indies` or
      `European Community`, which is precisely the mismatch the comment beside
      it says it prevents. Wrapping the code in a struct keeps the row, because
      a struct holding a null field is not itself null.

      **A third fixture, and it is the only one that can see this.** All 13
      multi-country customers in the extract use mapped labels, so the defect is
      latent on today's data and no data test can reach it — `country_iso3` has
      no `not_null` (the three labels are legitimately blank) and nothing
      compares the two columns. The seed is exhaustive against the landing
      table, so a new unmapped label from a re-ingest is the arrival path.

      C5 is the pair that breaks: `Unspecified` sorts after `United Kingdom`, so
      it wins the label and the code must come back null rather than `GBR`. C6
      is the ordinary multi-country customer, present so the normal path is
      asserted alongside the edge and so that swapping `max(country)` for
      `min(country)` — a mutation the eight above left unguarded — fails here
      too, on both rows.
    given:
      - input: ref('stg_retail_lines')
        rows:
          # C5 — one mapped label and one deliberately unmapped one. The
          # unmapped label sorts last, so it wins, and its code is null.
          - {invoice: "980", line_number: 1, customer_id: "C5", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 2, unit_price: 50.0, line_amount_gbp: 100.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01", invoice_month: "2024-04", country: "United Kingdom", country_iso3: "GBR", is_revenue_line: true}
          - {invoice: "981", line_number: 1, customer_id: "C5", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 1, unit_price: 50.0, line_amount_gbp: 50.0, invoice_ts: "2024-04-02 09:00:00", invoice_date: "2024-04-02", invoice_month: "2024-04", country: "Unspecified", country_iso3: null, is_revenue_line: true}
          # C6 — two mapped labels, so the code travels with the later one.
          - {invoice: "990", line_number: 1, customer_id: "C6", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 2, unit_price: 30.0, line_amount_gbp: 60.0, invoice_ts: "2024-04-03 09:00:00", invoice_date: "2024-04-03", invoice_month: "2024-04", country: "France", country_iso3: "FRA", is_revenue_line: true}
          - {invoice: "991", line_number: 1, customer_id: "C6", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 3, unit_price: 30.0, line_amount_gbp: 90.0, invoice_ts: "2024-04-04 09:00:00", invoice_date: "2024-04-04", invoice_month: "2024-04", country: "Germany", country_iso3: "DEU", is_revenue_line: true}
    expect:
      rows:
        # The label wins and takes its own code with it — here, no code at all.
        - {customer_id: "C5", country: "Unspecified", country_iso3: null, n_countries: 2, has_moved_country: true}
        - {customer_id: "C6", country: "Germany", country_iso3: "DEU", n_countries: 2, has_moved_country: true}

  - name: weather_year_keeps_the_two_degree_day_conventions_apart
    model: fct_country_weather_year
    description: >
      The two `hdd` columns are the same shape, the same unit and the same order
      of magnitude, so swapping them in the final SELECT is a wrong answer that
      is entirely legal — every data test on this mart passes on it. `_country_stats.yml`
      carried a comment claiming one convention is never colder than the other
      and that a test therefore caught the swap; both halves were false, and the
      expression under it was non-negativity that is invariant under the swap.
      Measured against a warehouse copy: with the two swapped in the final
      SELECT the model builds and **all 29 of `fct_country_weather_year`'s data
      tests pass**, DEU 2022 reading 2170.55 where it should read 2177.70.

      **The fixture puts the two directions on either side of it, which is the
      part that matters.** AAA's `(max + min)/2` total lands above its mean-based
      one and BBB's lands below, because over the real archive `hdd_minmax_total`
      is the larger in 253 of 656 rows (38.6%) and the smaller in 403. So this
      pins that the columns are distinguishable *without* asserting an ordering
      between them — a test that assumed one would be red on the warehouse.

      Every total in the expectation is distinct from every other within its row,
      so a rotation of the three degree-day columns fails as loudly as a swap of
      two, and each value is exact in binary floating point so the comparison is
      not a tolerance question.
    given:
      - input: ref('stg_weather_daily')
        rows:
          # AAA: the midpoint convention runs warmer here (5.5 against 3.5).
          - {country_iso3: "AAA", weather_date: "2024-01-01", hdd_c: 2.0, hdd_minmax_c: 3.0, cdd_c: 0.25, heating_base_c: 15.5, cooling_base_c: 22.0}
          - {country_iso3: "AAA", weather_date: "2024-01-02", hdd_c: 1.5, hdd_minmax_c: 2.5, cdd_c: 0.75, heating_base_c: 15.5, cooling_base_c: 22.0}
          # BBB: and colder here (9.5 against 12.0). Same year, so the two rows
          # of output differ only in the direction of the gap.
          - {country_iso3: "BBB", weather_date: "2024-01-01", hdd_c: 8.0, hdd_minmax_c: 6.0, cdd_c: 1.5, heating_base_c: 15.5, cooling_base_c: 22.0}
          - {country_iso3: "BBB", weather_date: "2024-01-02", hdd_c: 4.0, hdd_minmax_c: 3.5, cdd_c: 0.5, heating_base_c: 15.5, cooling_base_c: 22.0}
    expect:
      rows:
        - {country_iso3: "AAA", year: 2024, hdd_total: 3.5, hdd_minmax_total: 5.5, cdd_total: 1.0}
        - {country_iso3: "BBB", year: 2024, hdd_total: 12.0, hdd_minmax_total: 9.5, cdd_total: 2.0}
