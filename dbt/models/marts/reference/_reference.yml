version: 2

models:
  - name: dim_country
    config:
      contract:
        enforced: true
    description: >
      The country dimension: one row per `country_iso3`, 228 of them. Names,
      the World Bank region and income classification, the capital city and its
      coordinates.

      **The published answer to "what is a country" in this warehouse.** It is
      what `dim_country_year` is crossed with, what `fct_cbam_exposure` resolves
      its annex names against, and what a release consumer joins to instead of
      deduplicating 62,928 spine rows. `stg_country` is the `reference` group's
      working copy of one API response; this is the contracted, `public` table
      that ships as its own Parquet file. The facts that also carry
      `country_name`, `region` and `income_group` inline keep them, for the
      reason in `docs/WAREHOUSE.md`.

      Its `income_group` is the World Bank's **current** classification applied
      to every year, because the `/country` endpoint publishes no history. A
      country reclassified in 2019 reads as its 2026 class in a 1990 rollup.
      That is a Type-1 attribute; `dim_country_income_history` holds the
      classification as it stood each year.
    columns:
      - name: country_iso3
        description: >
          ISO 3166-1 alpha-3, except where the World Bank's own list is not
          ISO: `CHI` is the Channel Islands, which ISO splits into JEY and GGY.
          The dimension is the authority here, because it is what every
          `country_iso3` in the warehouse has to join to.
        data_type: VARCHAR
        data_tests: [not_null, unique]
      - name: country_iso2
        data_type: VARCHAR
        description: >
          ISO 3166-1 alpha-2, the key Eurostat prices arrive with (after staging maps
          its `EL` and `UK`). Follows the World Bank where it is not ISO: the Channel
          Islands are `JG`.
        data_tests: [not_null, unique]
      - name: country_name
        data_type: VARCHAR
        description: >
          The World Bank's English name (`St. Martin (French part)`, `West Bank and
          Gaza`); the `country_overrides` seed names the territories the World Bank does
          not list.
        data_tests: [not_null]
      - name: region
        description: >
          Trimmed World Bank region — the API pads two of them. Never null: the
          `country_overrides` seed fills it for every territory it adds,
          precisely so that a null region would mean "not a country" rather than
          "not in the World Bank's list", and Antarctica is deliberately absent.
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: income_group
        description: >
          World Bank income classification, and **nullable on purpose**: 10 of
          the 11 `country_overrides` territories have none, so a `not_null` here
          would fail on reality rather than on a bug. `is_manual_entry` is how
          you tell that case from a missing value.
        data_type: VARCHAR
        data_tests:
          - accepted_values:
              arguments:
                values: [High income, Upper middle income, Lower middle income, Low income]
      - name: capital_city
        description: Null for the manual entries, which the World Bank does not list.
        data_type: VARCHAR
      - name: latitude
        description: >
          The capital's coordinates, and not decoration — `stg_weather_daily`
          exists because these are here, and the ingest layer sends them to
          Open-Meteo. Null where the API sends an empty string.
        data_type: DOUBLE
        meta:
          additivity: non_additive
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -90, max_value: 90}
      - name: longitude
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The capital's longitude, from the World Bank. Null where the API sends an
          empty string, and for every `country_overrides` territory.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -180, max_value: 180}
      - name: is_manual_entry
        description: >
          True for the 11 rows the `country_overrides` seed supplies because the
          World Bank `/country` endpoint omits them — Taiwan is the material one
          at ~286 Mt CO2. Carried rather than inferred: it is the answer to "why
          is `income_group` null here", and it is not the same question, because
          the seed fills Taiwan's.
        data_type: BOOLEAN
        data_tests: [not_null]
    data_tests:
      # Model-level, not on the column: `expression_is_true` attached to a column
      # prefixes the column name onto the expression, so the same check there
      # compiles to `not(country_iso3 length(country_iso3) = 3)` and dies in the
      # parser. The staging models write it this way for the same reason.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(country_iso3) = 3"
      # The dimension and the spine must know the same countries. The failure it
      # catches is wholesale: an empty `int_country_year_observed` empties the
      # spine, which `not_null` and uniqueness tests pass, and the country-stats
      # mart (which inner-joins the spine) empties with it.
      #
      # **Each `except` must be parenthesised.** `EXCEPT` and `UNION` share a
      # precedence level and associate left, so `A except B union all B except A`
      # parses as `((A−B) ∪ B) − A` = `B \ A`, the one direction that cannot
      # happen. With the spine forced empty (measured): 0 rows unparenthesised,
      # 228 parenthesised.
      - dbt_utils.expression_is_true:
          name: dim_country_holds_exactly_the_countries_the_spine_does
          arguments:
            expression: >
              (select count(*) from (
                  (select country_iso3 from {{ ref('dim_country') }}
                   except
                   select country_iso3 from {{ ref('dim_country_year') }})
                  union all
                  (select country_iso3 from {{ ref('dim_country_year') }}
                   except
                   select country_iso3 from {{ ref('dim_country') }}))) = 0

  - name: dim_date
    config:
      contract:
        enforced: true
    description: >
      The calendar: one row per day, 1999-01-01 to the end of the year the FX
      series reaches, dense and gapless by construction. 10,227 rows today, and
      both ends move with the data rather than being pinned.

      It exists so that "which quarter is this", "is this a weekday" and "which
      fiscal year does this fall in" are answered by a join and answered
      identically everywhere. The annual models join on `year`, not a date.

      Two things it deliberately does not claim. It is **not a market calendar**
      — the ECB's TARGET closures are not derivable from any weekday rule, so
      they are observed as absences in `fct_fx_rates_daily` rather than asserted
      here. And its **fiscal columns are a policy**, taken from the
      `fiscal_year_start_month` var and carried on every row, because the same
      Tuesday belongs to different fiscal years depending on whose books you are
      keeping.
    data_tests:
      # Dense and gapless: one row per day between the ends, no more and no less.
      # A date dimension with a hole in it is worse than none, because every
      # left join onto it silently loses rows instead of failing.
      - dbt_utils.expression_is_true:
          name: dim_date_has_no_missing_days
          arguments:
            expression: >
              (select count(*) from {{ ref('dim_date') }})
              = (
                  select date_diff('day', min(date_day), max(date_day)) + 1
                  from {{ ref('dim_date') }}
              )
    columns:
      - name: date_day
        data_type: DATE
        description: >
          The calendar day, and the dimension's natural key. Whole years from the first
          year of the ECB series (1999) to the end of the last, so a year-to-date query
          never runs off the end.
        data_tests: [not_null, unique]
      - name: date_key
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: "Integer surrogate, yyyymmdd — sorts and reads like the date."
        data_tests: [not_null, unique]
      - name: year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar year.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1999, max_value: 2100}
      - name: quarter
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar quarter, 1-4.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 4}
      - name: month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar month, 1-12.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}
      - name: day_of_month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Day of the month, 1-31.
      - name: day_of_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Day of the year, 1-366.
      - name: month_name
        data_type: VARCHAR
        description: English month name, e.g. `January`.
      - name: year_start_date
        data_type: TIMESTAMP
        description: 1 January of `year`.
      - name: year_end_date
        data_type: TIMESTAMP
        description: 31 December of `year`.
      - name: quarter_start_date
        data_type: TIMESTAMP
        description: First day of the calendar quarter.
      - name: quarter_end_date
        data_type: TIMESTAMP
        description: Last day of the calendar quarter.
      - name: month_start_date
        data_type: TIMESTAMP
        description: First day of the month; the column to group a monthly series on.
      - name: month_end_date
        data_type: DATE
        description: Last day of the month.
      - name: half
        data_type: VARCHAR
        description: "'S1'/'S2', spelled Eurostat's way so the price models join without a translation."
        data_tests:
          - accepted_values:
              arguments: {values: ['S1', 'S2']}
      - name: half_start_date
        data_type: DATE
        description: >
          1 January or 1 July: the first day of `half`.
      - name: iso_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The ISO-8601 week-numbering year, which is **not** `year`. 2021-01-01
          is a Friday in ISO week 53 of ISO year 2020, and 2019-12-30 is already
          in week 1 of 2020 — so grouping weekly by (year, iso_week) splits one
          week across two buckets and files week 53 next to week 1. Pair this
          with `iso_week`, or group on `iso_week_start_date`.
        data_tests: [not_null]
      - name: iso_week
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          ISO 8601 week number, 1-53. It belongs to `iso_year`, not `year`: 1 January
          1999 is in week 53 of 1998.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 53}
      - name: iso_week_label
        data_type: VARCHAR
        description: >
          `<iso_year>-w<week>`, zero-padded, e.g. `1998-w53`. Sorts correctly as text.
      - name: iso_week_start_date
        data_type: DATE
        description: The Monday of this row's ISO week — the safe weekly grouping key.
        data_tests: [not_null]
      - name: day_of_week
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: ISO day number, 1 = Monday.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 7}
      - name: day_name
        data_type: VARCHAR
        description: English day name, e.g. `Monday`.
      - name: is_weekday
        data_type: BOOLEAN
        description: >
          Monday-Friday. A generic flag, not a business-day one: whether a given
          weekday is a trading day depends on a market calendar this model does
          not have.
        data_tests: [not_null]
      - name: is_weekend
        data_type: BOOLEAN
        description: >
          Saturday or Sunday. The complement of `is_weekday`; public holidays are not
          flagged.
      - name: fiscal_year_start_month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The policy that produced the fiscal columns, carried per row so anything
          joining on them can tell which convention built the table.
        data_tests: [not_null]
      - name: fiscal_year_start_date
        data_type: DATE
        description: >
          First day of the fiscal year this date falls in, set by
          `fiscal_year_start_month` (April in this build).
      - name: fiscal_year_end_date
        data_type: TIMESTAMP
        description: Last day of the fiscal year this date falls in.
      - name: fiscal_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The calendar year the fiscal year *ends* in — the convention that makes
          this collapse onto `year` when `fiscal_year_start_month` is 1.
        data_tests: [not_null]
      - name: fiscal_quarter
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          Quarter of the fiscal year, 1-4, counted from `fiscal_year_start_month`, so
          with an April start January is fiscal Q4.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 4}
      - name: fiscal_month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Month of the fiscal year, 1-12; 1 is the `fiscal_year_start_month`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}

  - name: dim_country_income_history
    config:
      contract:
        enforced: true
    description: >
      The World Bank income classification as it stood in each year, beside the
      one `dim_country` carries today. Grain: one row per (country_iso3, year)
      the World Bank classified, fiscal 1989 (data year 1987) onward.

      **Published because every other `income_group` in this warehouse is a
      Type-1 attribute.** The `/country` endpoint serves only the current
      classification, so the 2026 answer is stamped on 1990 wherever a model
      groups by it — and 49% of the economies classified at both ends of this
      table changed group in between. That makes "emissions by income group in
      1990" a 2026 grouping of 1990 emissions.

      Nothing is repointed at this. It is the fact published beside the
      existing column so the distortion is one query rather than an argument;
      whether `dim_country_year.income_group` becomes as-of-year is a contract
      change on eight relations and is deliberately a separate decision.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_type: VARCHAR
        description: >
          ISO3 as the World Bank spells it, from `OGHIST.xlsx`. **Not tested
          against `dim_country`**, and that is the point of the model: an economy
          the dimension has since dropped still had an income group in the years
          it existed, and the 2026 file lists 218 economies where the 2024 one
          listed 223.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The GNI data year the classification was computed from — the seed's
          `data_year`, renamed to the conformed key so this joins to the rest of
          the warehouse like every other country-year relation.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1987, max_value: 2030}
      - name: fiscal_year
        data_type: VARCHAR
        description: >
          The World Bank fiscal year the classification governed, `FY89`-style
          and two ahead of `year`. Kept because the World Bank's own published
          lists are indexed by it, so it is what makes this table checkable
          against the source.
        data_tests: [not_null]
      - name: income_group
        data_type: VARCHAR
        description: The classification in force that year. Never null — an unclassified year has no row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Low income", "Lower middle income", "Upper middle income", "High income"]
      - name: income_group_code
        data_type: VARCHAR
        description: >
          The publisher's own code — `L`, `LM`, `UM`, `H`. `LM*` appears on Yemen
          in 1987-88 and is a footnote rather than a fifth group; the
          transcription maps it to `LM` and stops on any other starred code.
        data_tests: [not_null]
      - name: current_income_group
        data_type: VARCHAR
        description: >
          What `dim_country` says today, carried on every row so the comparison
          needs no join. **Nullable on purpose**: the `country_overrides`
          territories have no World Bank classification, and neither does an
          economy the dimension no longer lists.
      - name: differs_from_current
        data_type: BOOLEAN
        description: >
          Whether that year's classification differs from today's. False rather
          than null where `current_income_group` is unknown — a row whose current
          group nobody knows is not a row that agrees, and a null here would drop
          out of `where differs_from_current` without saying so.
        data_tests: [not_null]

  - name: dim_currency
    config:
      contract:
        enforced: true
    description: >
      One row per currency the ECB series has ever quoted, joining the
      `currencies` seed to the series' own evidence of when each code was live.
      47 rows: 46 quoted plus the euro, which is the base of every quote and so
      never appears as one.

      It exists because the panel is not fixed. 17 codes have stopped — ten at a
      euro adoption, two at a redenomination, five without an explanation this
      project is willing to invent — and two of the survivors have interior gaps
      where the currency itself stopped working (Iceland 2008-2018, Argentina
      2002). Anything that carries a rate forward has to know all of that, which
      is why `first_published_date` / `last_published_date` bound the spine in
      `fct_fx_rates_daily`.
    data_tests:
      # The seed's claim, checked against the series from the other side: a
      # currency the seed says was retired must have stopped being quoted, and
      # one it says nothing about must not have a retirement date invented for it.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_currently_published"
          config:
            where: "retired_on is not null"
      # And the other direction of the same seed/series agreement: a seed row the
      # series has never quoted. EUR is the one legitimate case — it is the base
      # of every quote — so anything else unquoted is a code that was typed into
      # the seed and never existed. The seed's `retired_on` test cannot catch it:
      # its subquery returns NULL for a code with no rates, and `retired_on >
      # NULL` is not false, it is null, so the row passes by being unknown.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "currency_code = 'EUR'"
          config:
            where: "not is_quoted"
    columns:
      - name: currency_code
        data_type: VARCHAR
        description: >
          ISO 4217 code, one row per currency in the hand-maintained `currencies` seed.
          The ECB quotes each against the euro.
        data_tests: [not_null, unique]
      - name: currency_name
        data_type: VARCHAR
        description: English name from the `currencies` seed.
        data_tests: [not_null]
      - name: first_published_date
        data_type: DATE
        description: Null only for EUR, which is quoted against rather than quoted.
      - name: last_published_date
        data_type: DATE
        description: >
          The last day the ECB published a rate for this currency. Null for a seeded
          currency it has never quoted, which is what `is_quoted` flags.
      - name: n_published_days
        data_type: BIGINT
        meta:
          additivity: additive
        description: >
          How many days carry a published rate. Business days only: the ECB publishes
          none at weekends or on TARGET holidays.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: is_quoted
        data_type: BOOLEAN
        description: >
          False for exactly one row, EUR. Filter on it before ranking or charting
          rates, or the base currency joins in with nulls everywhere.
        data_tests: [not_null]
      - name: is_currently_published
        data_type: BOOLEAN
        description: >
          Whether the code still has a live quote, tolerant of missing the single
          newest day by the same margin the carry-forward uses — so this and
          "carried forward to today" cannot disagree.
      - name: longest_gap_days
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: >
          The longest run of calendar days between two consecutive fixings. 3 for
          a weekend, 5 for the Christmas closures, and only two values far beyond
          that: ISK at 3,341 and ARS at 34.
      - name: has_interior_gap
        data_type: BOOLEAN
        description: A quote that stopped and resumed, rather than one that stopped.
        data_tests: [not_null]
      - name: retired_on
        data_type: DATE
        description: >
          When the ECB stopped quoting it, from the seed, e.g. `2026-01-01` for the lev.
          Null for a currency still quoted.
      - name: retired_reason
        data_type: VARCHAR
        description: >
          Why it was retired: `euro_adoption` or `redenomination`. Null while quoted.
      - name: replaced_by_currency
        data_type: VARCHAR
        description: >
          What replaced it: `EUR` on euro adoption, the new code on a redenomination.
          Null while quoted.
      - name: retirement_is_explained
        data_type: BOOLEAN
        description: >
          Whether the seed records a reason. Five retirements deliberately have
          none — reading their null `retired_on` as "still current" is the mistake
          this column exists to prevent.
        data_tests: [not_null]

  - name: fct_fx_rates_published
    config:
      contract:
        enforced: true
    description: >
      Every ECB euro reference rate as published, one row per (rate_date,
      currency_code). 265,035 rows over 7,066 publication days and 46
      currencies. Sparse on purpose: no row on a weekend, a TARGET holiday, or
      for a currency outside its quoted lifetime.

      **The project's only incremental model.** Every other table here
      is a re-derivation of a source that is fully re-fetched, so rebuilding it
      is how a restatement gets picked up rather than waste. This one grows by
      ~30 rows a day forever and a published fixing never changes, which is the
      shape `materialized='incremental'` is actually for. `delete+insert` on the
      grain rather than `append`, because ingestion re-asks for a lookback window
      and an append would duplicate every row in it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_code]
      # An incremental model can drift from its source in a way a table model
      # cannot — a missed window, or a `unique_key` that stopped matching the
      # grain — and nothing else would notice. This is the cheap guard, and it is
      # the reason to keep this model a faithful copy of the view rather than
      # letting it filter or reshape: as long as that holds, one row count
      # answers "did the incremental logic lose anything".
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_fx_rates')
    columns:
      - name: rate_date
        data_type: DATE
        description: >
          The business day the ECB published the reference rate for. No weekends
          and no TARGET holidays; 1999-01-04 is the first.
        data_tests: [not_null]
      - name: currency_code
        data_type: VARCHAR
        description: ISO 4217 code of the quoted currency.
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
        description: >
          Always `EUR`: every ECB reference rate is quoted against the euro.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['EUR']}
      - name: units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: Units of the quote currency per 1 EUR, exactly as the ECB quotes it.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: eur_per_unit
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          Euros per one unit of `currency_code`: the reciprocal of `units_per_eur`,
          shipped so nobody inverts it by hand.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: date_key
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          Computed here rather than joined from `dim_date`, so this model has no
          dependencies and can be backfilled or rebuilt on its own.
        data_tests: [not_null]

  - name: fct_fx_rates_daily
    config:
      contract:
        enforced: true
    description: >
      The reference rates on every calendar day within each currency's quoted
      lifetime, gap-filled. Grain: one row per (date_day, currency_code).
      381,414 rows — 265,035 published, 113,020 carried forward and 3,359 stale.

      **The gap is the model.** 30% of calendar days carry no fixing (2,878
      weekend days and 134 weekday TARGET closures), so a transaction dated on a
      Sunday forces a decision. This carries the last published rate forward,
      which is what a finance system does and is the same operation as a
      slowly-changing lookup — and it caps the carry at
      `fx_max_carry_forward_days`, because the alternative is filling Iceland's
      nine-year suspension with a pre-collapse rate. `rate_source_date` says
      which fixing every row is quoting.

      Each currency's rows run from its first fixing to its last, so the kuna
      stops on 2022-12-30 rather than being carried into the euro era. **For a
      rate over a period, use `fct_fx_rates_periods`; do not average this
      table**: the carry repeats Friday's fixing on Saturday and Sunday, so a
      monthly average here averages the calendar, not the market.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, currency_code]
      # No row may quote a fixing from the future. This is the whole correctness
      # condition of a carry-forward, and it is one wrong window frame away from
      # being false — a default frame reaches forward and backfills the past.
      #
      # Both of these are named explicitly: dbt derives a test's stored-failure
      # table name from the model and the column *tokens* in the expression, so
      # two tests over the same two columns collide on one name and the project
      # fails to compile.
      - dbt_utils.expression_is_true:
          name: fx_daily_never_quotes_a_future_fixing
          arguments:
            expression: "rate_source_date <= date_day"
      # Every published rate must survive into the dense table unchanged. Catches
      # a fill that overwrote real observations with carried ones.
      - dbt_utils.expression_is_true:
          name: fx_daily_keeps_published_rates_on_their_own_day
          arguments:
            expression: "rate_source_date = date_day"
          config:
            where: "is_published_rate"
    columns:
      - name: date_day
        data_type: DATE
        description: >
          Every calendar day from the currency's first published rate to its last,
          weekends and holidays included.
        data_tests: [not_null]
      - name: date_key
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          `dim_date`'s integer surrogate, yyyymmdd.
      - name: currency_code
        data_type: VARCHAR
        description: >
          ISO 4217 code of the quoted currency. Only currencies the ECB has quoted; a
          seeded one it never has gets no rows.
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
        description: Always `EUR`.
        data_tests: [not_null]
      - name: units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          Null where the carry has run past the cap, so a stale number cannot be
          multiplied by anything by accident. That is 3,359 rows: Iceland
          2008-2018 and Argentina in early 2002.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: eur_per_unit
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          Euros per one unit of `currency_code`: the published rate, or the last one
          carried forward. Null once the carry exceeds `fx_max_carry_forward_days`, like
          `units_per_eur`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: rate_source_date
        data_type: DATE
        description: The publication date of the fixing this row is quoting.
        data_tests: [not_null]
      - name: days_since_published_rate
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: 0 on a publication day, 1-2 over a weekend, more over a holiday.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: is_published_rate
        data_type: BOOLEAN
        description: >
          True on a day the ECB published a rate for this currency. The complement of
          `is_carried_forward`.
        data_tests: [not_null]
      - name: is_carried_forward
        data_type: BOOLEAN
        description: >
          True on a day with no published rate, so the value is the last published one
          (or null, if that is too old). Every weekend day is one.
        data_tests: [not_null]
      - name: is_rate_stale
        data_type: BOOLEAN
        description: >
          The carry ran past the cap and the rate is null. Not an error — an
          absence you can count, which is the point of keeping the row.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar year of `date_day`, from `dim_date`.
      - name: quarter
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar quarter, 1-4, from `dim_date`.
      - name: month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar month, 1-12, from `dim_date`.
      - name: half
        data_type: VARCHAR
        description: >
          'S1' or 'S2', from `dim_date`, spelled Eurostat's way.
      - name: is_weekday
        data_type: BOOLEAN
        description: >
          Monday to Friday. A weekday can still be carried forward: the ECB also closes
          on TARGET holidays.

  - name: fct_fx_rates_periods
    config:
      contract:
        enforced: true
    description: >
      Rates aggregated to month, quarter, half and year. Grain: one row per
      (period_type, period_start_date, currency_code).

      **It exists for one decision: spot or average.** A stock — a balance, a
      position at an instant — converts at the closing rate; a flow — revenue,
      spend, a price paid over a period — converts at the period average. Both
      ship, named for what they are, and this model picks for nobody.
      `period_end_vs_avg_pct` measures the cost of choosing wrong: +11.7% for
      EUR/USD in 2003, -8.6% in 2014, and +98% for the Icelandic krona in 2008.

      Two subtleties baked in. The averages are taken over *published fixings*,
      not over the dense daily table, which would weight every Friday three times
      and more over a holiday weekend. And `avg_eur_per_unit` is not
      1 / `avg_units_per_eur` — the mean of reciprocals is not the reciprocal of
      the mean, and the two differ by 0.07% in a calm year and 0.53% in 2008.

      **Check `period_end_is_stale` before converting a stock.** A period end is
      the last fixing published inside the period however old that is, so a
      currency that left the ECB's panel mid-period still gets a closing rate —
      the rouble's 2022 year end is a fixing from 1 March, 305 days earlier.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_type, period_start_date, currency_code]
      # The annual average must be reconstructible from the fixings it covers.
      # Guards the join to `dim_date` — a period key that drifted by a day would
      # silently move fixings between buckets.
      - dbt_utils.expression_is_true:
          name: fx_periods_annual_buckets_cover_every_fixing
          arguments:
            expression: >
              (
                  select sum(n_published_days)
                  from {{ ref('fct_fx_rates_periods') }}
                  where period_type = 'year'
              )
              = (select count(*) from {{ ref('fct_fx_rates_published') }})
    columns:
      - name: period_type
        data_type: VARCHAR
        description: >
          `month`, `quarter`, `half` or `year`. Every rate is counted once per type, so
          filter on one: summing across types counts each day four times.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['month', 'quarter', 'half', 'year']}
      - name: period_start_date
        data_type: TIMESTAMP
        description: First day of the period.
        data_tests: [not_null]
      - name: period_label
        data_type: VARCHAR
        description: "'2022-05', '2022-q2', '2022-S1', '2022' — the half spelled Eurostat's way."
        data_tests: [not_null]
      - name: period_end_date
        data_type: TIMESTAMP
        description: >
          Last day of the period, whether or not it has happened yet: see
          `period_is_complete`.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Calendar year the period starts in.
      - name: currency_code
        data_type: VARCHAR
        description: ISO 4217 code of the quoted currency.
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
        description: Always `EUR`.
      - name: avg_units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: For flows. The mean of the fixings actually published in the period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: avg_eur_per_unit
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The mean of the reciprocals, which is not the reciprocal of the mean —
          see the model description. Convert in the direction the rate is quoted
          where you have the choice.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: period_end_units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: For stocks. The last fixing published inside the period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: period_end_eur_per_unit
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: Its exact reciprocal — a single point inverts without the averaging problem.
        data_tests: [not_null]
      - name: period_start_units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The first published rate in the period, units per euro: the opening rate.
        data_tests: [not_null]
      - name: period_end_vs_avg_pct
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          How far the closing rate sits from the average, as a percent of the
          average. Deliberately untested for range: a currency crisis legitimately
          puts it near +100%.
      - name: min_units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: The lowest published rate in the period, units per euro.
      - name: max_units_per_eur
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: The highest published rate in the period, units per euro.
      - name: intra_period_range_pct
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: High-to-low spread within the period, as a percent of the low.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: n_published_days
        data_type: BIGINT
        meta:
          additivity: additive
        description: >
          Days in the period with a published rate: the number the averages are over.
          Low for a currency that joined or left the panel mid-period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: first_rate_date
        data_type: DATE
        description: >
          The first published rate date in the period. Later than `period_start_date`
          whenever the period opens on a weekend, a holiday, or before the currency was
          quoted.
      - name: last_rate_date
        data_type: DATE
        description: >
          The last published rate date in the period, the one the period-end columns are
          read from.
      - name: period_is_complete
        data_type: BOOLEAN
        description: >
          False where the period has not finished, so the current year's average
          is over the months that have happened. The `price_is_partial_year`
          lesson from the Eurostat models, arriving again.
        data_tests: [not_null]
      - name: period_end_stale_days
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: >
          Age in days of the fixing behind `period_end_*`, measured to the last
          date that value could be speaking for — the period end, or the end of
          the series where the period has not finished. Zero on the 69% of
          period-ends that fall on a publishing day.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: period_end_is_stale
        data_type: BOOLEAN
        description: >
          True where `period_end_stale_days` exceeds `fx_max_carry_forward_days`
          (7), the same cap `fct_fx_rates_daily` applies. **The value is
          disclosed, not nulled** — 290.00 ISK/EUR was the last real fixing of
          2008 and a balance closed on 31 December would have converted at it;
          what the reader needs is that it was three weeks old because the
          currency had stopped trading. True on 22 complete period-ends across 7
          currencies, of which 16 are currencies that left the ECB's panel (RUB
          2022-03-01; ARS, DZD, MAD and TWD together on 2020-10-30), 5 are the
          two currency crises and 1 is the ROL redenomination. The worst is the
          rouble's 2022 year end at 305 days, not the krona's famous 2008 at 22.
        data_tests: [not_null]
