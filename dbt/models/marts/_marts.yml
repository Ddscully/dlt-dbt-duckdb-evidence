version: 2

models:
  - name: dim_country_year
    description: >
      Country-year spine: `stg_country` crossed with every year the warehouse
      covers (the span is read from the sources, so both ends move with the
      data). Grain is one row per (country_iso3, year), and it is the *complete*
      set of them — left-join a fact onto this to see coverage gaps as rows
      instead of inferring them from what's missing.
      `fct_emissions_energy` is built on it, filtered to the country-years at
      least one source reports.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        description: >
          ISO3 code, from the country dimension. Codes the sources emit but the
          dimension doesn't carry (World Bank aggregates like `WLD`, and
          Antarctica) are not countries and so are not here — which is what
          keeps them out of the fact.
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: region
        description: World Bank region, trimmed. Never null — see `stg_country`.
        data_tests: [not_null]
      - name: income_group
        description: >
          World Bank income group. Null for the territories in
          `country_overrides`, which the World Bank does not classify.

  - name: dim_grid_emission_factors
    description: >
      Grid emission factors as a reference product: one row per
      (country_iso3, year) that has a published factor, with the vintage and the
      lineage a reporter needs beside the number.

      `emission_factor_g_co2_per_kwh` is the same series as
      `fct_emissions_energy.carbon_intensity_elec_g_kwh`. It is modelled again
      here because the use is different — under the GHG Protocol this *is* the
      location-based Scope 2 emission factor, the figure a multi-site company
      multiplies its metered kWh by for the electricity line of a CSRD, SECR or
      CDP disclosure, and that reader wants a lookup table rather than a
      60-column fact.

      Three caveats travel with every row and are stated on the Scope 2 page
      rather than hidden: it is **location-based** (a market-based factor needs
      contractual instruments — RECs, GOs — that no public dataset carries), it
      is an **annual average** rather than hourly-matched, and OWID's series is
      **production-based**, so it ignores imported electricity.

      Not built on the full spine, unlike every other model here: a country-year
      with no factor is an absence, not a reference value. `dim_country_year` is
      where absences are rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      # The contract that makes `is_latest_available` usable as a lookup: filter
      # on it and you get one row per country, not two and not zero.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3]
          config:
            where: "is_latest_available"
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1985, max_value: 2030}
      - name: emission_factor_g_co2_per_kwh
        description: >
          Grams of CO2 per kWh generated. Never null — a row exists only where
          a factor does.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2000}
      - name: emission_factor_t_co2_per_mwh
        description: >
          The same factor in the unit meter data arrives in: tonnes CO2e per
          MWh, i.e. g/kWh / 1000. Shipped rather than left as a division because
          a reporter doing it by hand is how a filing gains a factor of 1000.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2}
      - name: is_latest_available
        description: >
          The most recent year this country has a published factor for — the row
          to use when the question is "the current factor for country X".
          **That is not the same year for every country**: today it is 2025 for
          90 of them, 2024 for 105, 2023 for 10 and 2022 for 2, so a
          `where year = <latest>` cross-section would drop more than half the
          world. Same lesson as `latest_years.sql`, load-bearing here for a
          number with a legal consequence.
        data_tests: [not_null]
      - name: latest_available_year
        description: This country's newest factor year, repeated on every one of its rows.
        data_tests: [not_null]
      - name: latest_factor_lag_years
        description: >
          How far `latest_available_year` sits behind the newest factor year in
          the whole table — how stale the *best* number available for this
          country is. 0 for the countries at the frontier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: factor_version_count
        description: >
          Versions of this factor the warehouse has held, from
          `snap_grid_emission_factors`. **Null before 2015**, which is where the
          snapshot starts, and 1 for everything else on a warehouse built from
          scratch — a snapshot can only record a revision it was present for.
      - name: first_published_factor_g_co2_per_kwh
        description: >
          The factor as first snapshotted. The point of keeping it is that a
          disclosure filed against a superseded number has to stay reconcilable;
          it does not become wrong when OWID restates.
      - name: is_restated
        description: Whether the factor has changed since the snapshot first saw it. Null before 2015.
      - name: factor_basis
        description: >
          Always `location-based`. Constant on every row on purpose: this table
          ships as a standalone Parquet file in the data release, and a factor
          detached from its basis is the one thing a reporter must not be handed.
        data_tests: [not_null]
      - name: source_dataset
        description: Always `owid_energy.carbon_intensity_elec`.
        data_tests: [not_null]
      - name: source_loaded_at
        description: >
          When this pipeline pulled the extract the factor came out of (dlt's
          `_dlt_load_id`) — not when the publisher computed it.
        data_tests: [not_null]

  - name: fct_co2_estimate_versions
    description: >
      Version history of OWID's CO2 estimates, summarised off the
      `snap_co2_estimates` SCD2 snapshot: how many versions of each country-year
      the warehouse has held, the first, the current, and the change.
      Grain: one row per (country_iso3, year) in the snapshot, 1990 onwards.

      `is_revised` is the interesting filter, and it is **all false on a
      warehouse built from scratch** — a snapshot can only record a revision it
      was present for. That is also why the published copy is unrevised: the
      Pages and release workflows both start from an empty DuckDB file.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1990, max_value: 2030}
      - name: is_revised
        description: Whether the estimate has changed since it was first loaded.
        data_tests: [not_null]
      - name: version_count
        description: Versions the snapshot holds for this country-year.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: first_loaded_at
        description: >
          `min(dbt_valid_from)` — when this country-year first entered the
          snapshot, not when OWID first published it.
      - name: last_revised_at
        description: >
          When the most recent version appeared. Null while `version_count` is 1,
          since "revised at" would otherwise read as the first load.
      - name: co2_mt_change
        description: Latest estimate minus the first, million tonnes. Signed.
      - name: co2_mt_change_pct
        description: >
          The same as a percentage of the first estimate. Null where the first
          estimate was zero.

  - name: fct_emissions_energy
    description: >
      Country-year fact combining OWID emissions & energy, World Bank WDI
      (GDP, life expectancy, population, poverty, internet, urbanisation, forest,
      renewable electricity, energy imports) and Eurostat household electricity
      prices (EU only), with World Bank classifications.

      Built on `dim_country_year`: every measure is a left join off the spine, so
      a country-year that only OWID energy or only WDI reports arrives with the
      other sources' columns null instead of being dropped.
    data_tests:
      # The grain contract. Every join in this model is a left join off the
      # spine, so a duplicate on either side of any of the four would fan rows
      # out here without changing the row count of anything upstream.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: region
        description: >
          World Bank region, trimmed (the API pads 'Sub-Saharan Africa ' and
          'Latin America & Caribbean '). Comes from the spine, so never null —
          the ISO3 codes the World Bank omits are filled by the
          `country_overrides` seed and Antarctica isn't in the dimension at all.
      - name: income_group
        description: >
          World Bank income group (dimension attribute for grouping marts).
          Null for the territories in `country_overrides`, which the World Bank
          does not classify.
      - name: co2_per_gdp
        description: >
          OWID's kg CO2 per 2011 international-$ (PPP). Ends in 2022 and covers
          164 countries — for a current, fuller series use
          `co2_per_gdp_const_usd` in `analytics.co2_intensity`.
      - name: gdp_per_capita_usd
        description: GDP per capita, current US$ (WDI NY.GDP.PCAP.CD).
      - name: gdp_usd
        description: >
          GDP, current US$ (WDI NY.GDP.MKTP.CD). Moves with inflation and the
          exchange rate — use `gdp_constant_usd` for anything measured over time.
      - name: gdp_constant_usd
        description: >
          GDP, constant 2015 US$ (WDI NY.GDP.MKTP.KD). The real-terms series;
          denominator for carbon intensity in `analytics.co2_intensity`.
      - name: life_expectancy
        description: Life expectancy at birth, years (WDI SP.DYN.LE00.IN).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: co2_mt
        description: Territorial CO2 emissions, million tonnes (OWID).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: population
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: renewables_share_pct
        description: >
          Renewables as a share of primary energy, % (OWID). **79 countries** in
          every year — the narrowest widely-used column in this table. For
          country coverage use `low_carbon_share_elec_pct` (~210) instead; it is
          a share of electricity rather than of all energy, so the two are not
          interchangeable in levels.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: fossil_share_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: consumption_co2
        description: >
          Consumption-based CO2, million tonnes (OWID): territorial emissions
          adjusted for carbon embodied in trade. ~120 countries and one year
          behind `co2_mt`, so null here alongside a populated `co2_mt` is the
          normal case. This is the column that answers the "emissions were just
          offshored" objection to any territorial trend.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: trade_co2
        description: >
          `consumption_co2 - co2_mt`. Positive = net importer of embodied carbon.
          Signed, so no `min_value`.
      - name: trade_co2_share
        description: >
          `trade_co2` as a percent of territorial emissions. Deliberately
          untested: the real range is about -98% to +1023%.
      - name: cumulative_co2
        description: CO2 emitted since 1750, million tonnes (OWID). Stock, not flow.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_global_cumulative_co2
        description: >
          Share of all CO2 ever emitted, %. Ranks countries very differently to
          `share_global_co2`: the US is 23.8% cumulative against 12.9% of the
          2023 flow, China 15.1% against 32.0%.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: carbon_intensity_elec_g_kwh
        description: >
          Grams of CO2 per kWh generated (OWID). ~210 countries — the
          broad-coverage alternative to `renewables_share_pct`, and in a unit a
          reader can hold.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2000}
      - name: low_carbon_share_elec_pct
        description: Renewables plus nuclear as a share of electricity generated, %.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: internet_users_pct
        description: Individuals using the internet, % of population (WDI IT.NET.USER.ZS).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: renew_elec_pct
        description: Renewable electricity output, % of total (WDI EG.ELC.RNEW.ZS).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: electricity_price_eur_kwh
        description: >
          Household electricity price, EUR/kWh incl. all taxes, medium band DC
          (Eurostat nrg_pc_204). Null for non-EU/EEA countries. **Averaged over
          the year's two half-years**, which is what the annual grain costs:
          within-year moves of 300% have happened. Use
          `fct_eu_electricity_prices_semiannual` for anything about prices over
          time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}
      - name: price_is_partial_year
        description: >
          True when `electricity_price_eur_kwh` averages a single half-year — the
          state of the newest year between Eurostat's S1 and S2 releases, when an
          "annual" price is really a January-June one. Null wherever the price is.
          `sources/warehouse/latest_years.sql` excludes these years from
          `price_year`, so the site's price cross-section is always a full year.

  - name: fct_eu_electricity_prices_semiannual
    description: >
      EU/EEA household electricity prices at Eurostat's published grain: one row
      per (country_iso3, year, half), 2007 onwards. The only non-annual fact in
      the warehouse, and the reason it exists is that the annual average is lossy
      — the mean absolute half-over-half change was 19% across
      countries in 2022 and 13% in 2023, against 3-4% through the 2010s.

      Built on `dim_country_year` for its dimension attributes, so like every
      other fact here it can only carry countries the dimension knows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year, half]
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 2007, max_value: 2030}
      - name: half
        description: "'S1' (January-June) or 'S2' (July-December), from Eurostat's period code."
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['S1', 'S2']}
      - name: period
        description: Eurostat's period label, e.g. '2022-S1'.
        data_tests: [not_null]
      - name: period_start_date
        description: First day of the half-year — the column to put on a time axis.
        data_tests: [not_null]
      - name: electricity_price_eur_kwh
        description: >
          EUR/kWh incl. all taxes, medium consumption band DC. Unaveraged, so this
          is the column that shows the 2021-23 energy crisis as it actually
          arrived.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}
      - name: change_vs_previous_half_eur_kwh
        description: >
          Change from the preceding half-year, EUR/kWh. Signed. Null at the start
          of each country's series and across any gap in it — the previous row a
          country has is not always the previous half, so this is only reported
          when it is.
      - name: change_vs_previous_half_pct
        description: >
          The same change as a percent. Deliberately untested: the Dutch 2022-S2
          figure is +320% off a rebate-suppressed S1, which is reality rather than
          a bug. Also null where the previous price was zero.

  - name: fct_example_scope2_emissions
    description: >
      The worked example for `dim_grid_emission_factors`: metered MWh x factor
      -> tonnes CO2e, per site, which is the whole of location-based Scope 2
      accounting under the GHG Protocol.

      **The twelve sites are invented** — `seeds/example_scope2_sites.csv`, the
      only fabricated data in this warehouse. The factors they are multiplied by
      are real, and each site takes the most recent one published for its
      country, which is a different year for different countries. The seed's
      countries are constrained to the fixture slice so the `not_null` gates
      below stay real under CI; see the seed's own description.

      It is modelled rather than left as a query on the Scope 2 page because the
      arithmetic is the product. `scope2_at_best_grid_t_co2e` and
      `scope2_at_worst_grid_t_co2e` reprice the identical consumption on the
      cleanest and dirtiest grid the group already operates on, so the spread is
      the cost of siting decisions already taken rather than a hypothetical.

      Grain: one row per site.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [site_id]
    columns:
      - name: site_id
        data_tests: [not_null]
      - name: country_iso3
        data_tests: [not_null]
      - name: annual_electricity_mwh
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: factor_year
        description: >
          The vintage of the factor applied to this site. Deliberately on the
          fact rather than looked up: two sites in the same group can be priced
          off different years, and a disclosure has to be able to say so.
        data_tests: [not_null]
      - name: emission_factor_g_co2_per_kwh
        description: >
          Null would mean a site in a country with no published factor — a group
          total that quietly under-reports. The join is a left join so that
          arrives here as a failing row rather than a missing site.
        data_tests: [not_null]
      - name: scope2_t_co2e
        description: Location-based Scope 2 emissions for one year, tonnes CO2e.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_of_group_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: scope2_at_best_grid_t_co2e
        description: The same consumption on the cleanest grid the group operates on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: scope2_at_worst_grid_t_co2e
        description: The same consumption on the dirtiest grid the group operates on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
