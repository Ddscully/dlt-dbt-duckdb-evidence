version: 2

models:
  - name: dim_country_year
    config:
      contract:
        enforced: true
      group: country_stats
    description: >
      Country-year spine: `stg_country` crossed with every year the warehouse
      covers (the span is read from the sources, so both ends move with the
      data). Grain is one row per (country_iso3, year), and it is the *complete*
      set of them — left-join a fact onto this to see coverage gaps as rows
      instead of inferring them from what's missing.
      `fct_emissions_energy` is built on it, filtered to the country-years at
      least one source reports.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_type: VARCHAR
        description: >
          ISO3 code, from the country dimension. Codes the sources emit but the
          dimension doesn't carry (World Bank aggregates like `WLD`, and
          Antarctica) are not countries and so are not here — which is what
          keeps them out of the fact.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: country_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
        description: World Bank region, trimmed. Never null — see `stg_country`.
        data_tests: [not_null]
      - name: income_group
        data_type: VARCHAR
        description: >
          World Bank income group. Null for the territories in
          `country_overrides`, which the World Bank does not classify.

  - name: dim_grid_emission_factors
    config:
      contract:
        enforced: true
      group: compliance
    description: >
      Grid emission factors as a reference product: one row per
      (country_iso3, year) that has a published factor, with the vintage and the
      lineage a reporter needs beside the number.

      `emission_factor_g_co2_per_kwh` is the same series as
      `fct_emissions_energy.carbon_intensity_elec_g_kwh`. It is modelled again
      here because the use is different — under the GHG Protocol this *is* the
      location-based Scope 2 emission factor, the figure a multi-site company
      multiplies its metered kWh by for the electricity line of a CSRD, SECR or
      CDP disclosure, and that reader wants a lookup table rather than a
      60-column fact.

      Three caveats travel with every row and are stated on the Scope 2 page
      rather than hidden: it is **location-based** (a market-based factor needs
      contractual instruments — RECs, GOs — that no public dataset carries), it
      is an **annual average** rather than hourly-matched, and OWID's series is
      **production-based**, so it ignores imported electricity.

      Not built on the full spine, unlike every other model here: a country-year
      with no factor is an absence, not a reference value. `dim_country_year` is
      where absences are rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      # The contract that makes `is_latest_available` usable as a lookup: filter
      # on it and you get one row per country, not two and not zero.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3]
          config:
            where: "is_latest_available"
    columns:
      - name: country_iso3
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: income_group
        data_type: VARCHAR
      - name: year
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1985, max_value: 2030}
      - name: emission_factor_g_co2_per_kwh
        data_type: DOUBLE
        description: >
          Grams of CO2 per kWh generated. Never null — a row exists only where
          a factor does.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2000}
      - name: emission_factor_t_co2_per_mwh
        data_type: DOUBLE
        description: >
          The same factor in the unit meter data arrives in: tonnes CO2e per
          MWh, i.e. g/kWh / 1000. Shipped rather than left as a division because
          a reporter doing it by hand is how a filing gains a factor of 1000.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2}
      - name: electricity_generation_twh
        data_type: DOUBLE
      - name: low_carbon_share_elec_pct
        data_type: DOUBLE
      - name: is_latest_available
        data_type: BOOLEAN
        description: >
          The most recent year this country has a published factor for — the row
          to use when the question is "the current factor for country X".
          **That is not the same year for every country**: today it is 2025 for
          90 of them, 2024 for 105, 2023 for 10 and 2022 for 2, so a
          `where year = <latest>` cross-section would drop more than half the
          world. Same lesson as `latest_years.sql`, load-bearing here for a
          number with a legal consequence.
        data_tests: [not_null]
      - name: latest_available_year
        data_type: INTEGER
        description: This country's newest factor year, repeated on every one of its rows.
        data_tests: [not_null]
      - name: latest_factor_lag_years
        data_type: INTEGER
        description: >
          How far `latest_available_year` sits behind the newest factor year in
          the whole table — how stale the *best* number available for this
          country is. 0 for the countries at the frontier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: factor_version_count
        data_type: BIGINT
        description: >
          Versions of this factor the warehouse has held, from
          `snap_grid_emission_factors`. **Null before 2015**, which is where the
          snapshot starts, and 1 for everything else on a warehouse built from
          scratch — a snapshot can only record a revision it was present for.
      - name: first_published_factor_g_co2_per_kwh
        data_type: DOUBLE
        description: >
          The factor as first snapshotted. The point of keeping it is that a
          disclosure filed against a superseded number has to stay reconcilable;
          it does not become wrong when OWID restates.
      - name: is_restated
        data_type: BOOLEAN
        description: Whether the factor has changed since the snapshot first saw it. Null before 2015.
      - name: first_published_at
        data_type: TIMESTAMP
      - name: last_revised_at
        data_type: TIMESTAMP
      - name: factor_basis
        data_type: VARCHAR
        description: >
          Always `location-based`. Constant on every row on purpose: this table
          ships as a standalone Parquet file in the data release, and a factor
          detached from its basis is the one thing a reporter must not be handed.
        data_tests: [not_null]
      - name: source_dataset
        data_type: VARCHAR
        description: Always `owid_energy.carbon_intensity_elec`.
        data_tests: [not_null]
      - name: source_loaded_at
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          When this pipeline pulled the extract the factor came out of (dlt's
          `_dlt_load_id`) — not when the publisher computed it.
        data_tests: [not_null]

  - name: fct_co2_estimate_versions
    config:
      contract:
        enforced: true
      group: country_stats
    description: >
      Version history of OWID's CO2 estimates, summarised off the
      `snap_co2_estimates` SCD2 snapshot: how many versions of each country-year
      the warehouse has held, the first, the current, and the change.
      Grain: one row per (country_iso3, year) in the snapshot, 1990 onwards.

      `is_revised` is the interesting filter, and it is **all false on a
      warehouse built from scratch** — a snapshot can only record a revision it
      was present for. That is also why the published copy is unrevised: the
      Pages and release workflows both start from an empty DuckDB file.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: year
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1990, max_value: 2030}
      - name: is_revised
        data_type: BOOLEAN
        description: Whether the estimate has changed since it was first loaded.
        data_tests: [not_null]
      - name: version_count
        data_type: BIGINT
        description: Versions the snapshot holds for this country-year.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: first_loaded_at
        data_type: TIMESTAMP
        description: >
          `min(dbt_valid_from)` — when this country-year first entered the
          snapshot, not when OWID first published it.
      - name: last_revised_at
        data_type: TIMESTAMP
        description: >
          When the most recent version appeared. Null while `version_count` is 1,
          since "revised at" would otherwise read as the first load.
      - name: first_co2_mt
        data_type: DOUBLE
      - name: latest_co2_mt
        data_type: DOUBLE
      - name: co2_mt_change
        data_type: DOUBLE
        description: Latest estimate minus the first, million tonnes. Signed.
      - name: co2_mt_change_pct
        data_type: DOUBLE
        description: >
          The same as a percentage of the first estimate. Null where the first
          estimate was zero.
      - name: first_co2_per_capita
        data_type: DOUBLE
      - name: latest_co2_per_capita
        data_type: DOUBLE

  - name: fct_emissions_energy
    # The project's one versioned model, and the reason it is this one: nothing
    # inside the project refs it, and the monthly release ships it as a Parquet
    # file to consumers who cannot be paged. A rename here is free in-repo and
    # breaking out of it, which is exactly the case `versions:` exists for.
    #
    # `ref('fct_emissions_energy')` resolves to the latest version, so every
    # consumer that doesn't ask for a version gets v2. v2 is aliased back to the
    # bare relation name for the same reason: the Evidence source query, the
    # lake's `ARCHIVED_TABLES`, `TABLE_TO_DBT_MODEL` and the release notes all
    # name `marts.fct_emissions_energy`, and a migration that renames the table
    # out from under them is not a migration.
    latest_version: 2
    versions:
      - v: 2
        config:
          alias: fct_emissions_energy
      - v: 1
        # The window. dbt warns on every parse once this date is inside 30 days
        # and errors for anyone still `ref`-ing v1 after it passes; the release
        # notes carry the same date, because the consumers who need it are the
        # ones who never see a dbt log.
        deprecation_date: 2026-11-01
        columns:
          - include: all
            exclude: [co2_kg_per_gdp_ppp_2011]
          - name: co2_per_gdp
            data_type: DOUBLE
            description: >
              **Deprecated — use `co2_kg_per_gdp_ppp_2011` in v2.** Same numbers,
              a name that says neither the unit nor the basis. Kept until the
              deprecation date above so a release consumer has a version to
              migrate *from* rather than a column that vanished.
    config:
      contract:
        enforced: true
      group: country_stats
    description: >
      Country-year fact combining OWID emissions & energy, World Bank WDI
      (GDP, life expectancy, population, poverty, internet, urbanisation, forest,
      renewable electricity, energy imports) and Eurostat household electricity
      prices (EU only), with World Bank classifications.

      Built on `dim_country_year`: every measure is a left join off the spine, so
      a country-year that only OWID energy or only WDI reports arrives with the
      other sources' columns null instead of being dropped.
    data_tests:
      # The grain contract. Every join in this model is a left join off the
      # spine, so a duplicate on either side of any of the four would fan rows
      # out here without changing the row count of anything upstream.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
        description: >
          World Bank region, trimmed (the API pads 'Sub-Saharan Africa ' and
          'Latin America & Caribbean '). Comes from the spine, so never null —
          the ISO3 codes the World Bank omits are filled by the
          `country_overrides` seed and Antarctica isn't in the dimension at all.
      - name: income_group
        data_type: VARCHAR
        description: >
          World Bank income group (dimension attribute for grouping marts).
          Null for the territories in `country_overrides`, which the World Bank
          does not classify.
      - name: year
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: co2_mt
        data_type: DOUBLE
        description: Territorial CO2 emissions, million tonnes (OWID).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: co2_per_capita
        data_type: DOUBLE
      # Renamed in v2 from `co2_per_gdp`, which said neither the unit nor the
      # basis while a second, differently-based intensity column sat one schema
      # away. v1 serves it under the old name until the deprecation date.
      - name: co2_kg_per_gdp_ppp_2011
        data_type: DOUBLE
        description: >
          OWID's kg CO2 per 2011 international-$ (PPP). Ends in 2022 and covers
          164 countries — for a current, fuller series use
          `co2_per_gdp_const_usd` in `analytics.co2_intensity`, which is kg CO2
          per **constant 2015 US$** and so is not comparable in levels.
      - name: share_global_co2
        data_type: DOUBLE
      - name: coal_co2
        data_type: DOUBLE
      - name: oil_co2
        data_type: DOUBLE
      - name: gas_co2
        data_type: DOUBLE
      - name: consumption_co2
        data_type: DOUBLE
        description: >
          Consumption-based CO2, million tonnes (OWID): territorial emissions
          adjusted for carbon embodied in trade. ~120 countries and one year
          behind `co2_mt`, so null here alongside a populated `co2_mt` is the
          normal case. This is the column that answers the "emissions were just
          offshored" objection to any territorial trend.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: consumption_co2_per_capita
        data_type: DOUBLE
      - name: trade_co2
        data_type: DOUBLE
        description: >
          `consumption_co2 - co2_mt`. Positive = net importer of embodied carbon.
          Signed, so no `min_value`.
      - name: trade_co2_share
        data_type: DOUBLE
        description: >
          `trade_co2` as a percent of territorial emissions. Deliberately
          untested: the real range is about -98% to +1023%.
      - name: cumulative_co2
        data_type: DOUBLE
        description: CO2 emitted since 1750, million tonnes (OWID). Stock, not flow.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_global_cumulative_co2
        data_type: DOUBLE
        description: >
          Share of all CO2 ever emitted, %. Ranks countries very differently to
          `share_global_co2`: the US is 23.8% cumulative against 12.9% of the
          2023 flow, China 15.1% against 32.0%.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: primary_energy_twh
        data_type: DOUBLE
      - name: renewables_share_pct
        data_type: DOUBLE
        description: >
          Renewables as a share of primary energy, % (OWID). **79 countries** in
          every year — the narrowest widely-used column in this table. For
          country coverage use `low_carbon_share_elec_pct` (~210) instead; it is
          a share of electricity rather than of all energy, so the two are not
          interchangeable in levels.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: fossil_share_pct
        data_type: DOUBLE
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: electricity_generation_twh
        data_type: DOUBLE
      - name: carbon_intensity_elec_g_kwh
        data_type: DOUBLE
        description: >
          Grams of CO2 per kWh generated (OWID). ~210 countries — the
          broad-coverage alternative to `renewables_share_pct`, and in a unit a
          reader can hold.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2000}
      - name: low_carbon_share_elec_pct
        data_type: DOUBLE
        description: Renewables plus nuclear as a share of electricity generated, %.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: solar_share_elec_pct
        data_type: DOUBLE
      - name: wind_share_elec_pct
        data_type: DOUBLE
      - name: nuclear_share_elec_pct
        data_type: DOUBLE
      - name: coal_share_elec_pct
        data_type: DOUBLE
      - name: gas_share_elec_pct
        data_type: DOUBLE
      - name: gdp_per_capita_usd
        data_type: DOUBLE
        description: GDP per capita, current US$ (WDI NY.GDP.PCAP.CD).
      - name: gdp_usd
        data_type: DOUBLE
        description: >
          GDP, current US$ (WDI NY.GDP.MKTP.CD). Moves with inflation and the
          exchange rate — use `gdp_constant_usd` for anything measured over time.
      - name: gdp_constant_usd
        data_type: DOUBLE
        description: >
          GDP, constant 2015 US$ (WDI NY.GDP.MKTP.KD). The real-terms series;
          denominator for carbon intensity in `analytics.co2_intensity`.
      - name: life_expectancy
        data_type: DOUBLE
        description: Life expectancy at birth, years (WDI SP.DYN.LE00.IN).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: population
        data_type: DOUBLE
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: poverty_rate
        data_type: DOUBLE
      - name: internet_users_pct
        data_type: DOUBLE
        description: Individuals using the internet, % of population (WDI IT.NET.USER.ZS).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: urban_pop_pct
        data_type: DOUBLE
      - name: forest_area_pct
        data_type: DOUBLE
      - name: renew_elec_pct
        data_type: DOUBLE
        description: Renewable electricity output, % of total (WDI EG.ELC.RNEW.ZS).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: energy_imports_pct
        data_type: DOUBLE
      - name: electricity_price_eur_kwh
        data_type: DOUBLE
        description: >
          Household electricity price, EUR/kWh incl. all taxes, medium band DC
          (Eurostat nrg_pc_204). Null for non-EU/EEA countries. **Averaged over
          the year's two half-years**, which is what the annual grain costs:
          within-year moves of 300% have happened. Use
          `fct_eu_electricity_prices_semiannual` for anything about prices over
          time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}
      - name: price_is_partial_year
        data_type: BOOLEAN
        description: >
          True when `electricity_price_eur_kwh` averages a single half-year — the
          state of the newest year between Eurostat's S1 and S2 releases, when an
          "annual" price is really a January-June one. Null wherever the price is.
          `sources/warehouse/latest_years.sql` excludes these years from
          `price_year`, so the site's price cross-section is always a full year.

  - name: fct_eu_electricity_prices_semiannual
    config:
      contract:
        enforced: true
      group: country_stats
    description: >
      EU/EEA household electricity prices at Eurostat's published grain: one row
      per (country_iso3, year, half), 2007 onwards. The only non-annual fact in
      the warehouse, and the reason it exists is that the annual average is lossy
      — the mean absolute half-over-half change was 19% across
      countries in 2022 and 13% in 2023, against 3-4% through the 2010s.

      Built on `dim_country_year` for its dimension attributes, so like every
      other fact here it can only carry countries the dimension knows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year, half]
    columns:
      - name: country_iso3
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: income_group
        data_type: VARCHAR
      - name: year
        data_type: BIGINT
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 2007, max_value: 2030}
      - name: half
        data_type: VARCHAR
        description: "'S1' (January-June) or 'S2' (July-December), from Eurostat's period code."
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['S1', 'S2']}
      - name: period
        data_type: VARCHAR
        description: Eurostat's period label, e.g. '2022-S1'.
        data_tests: [not_null]
      - name: period_start_date
        data_type: DATE
        description: First day of the half-year — the column to put on a time axis.
        data_tests: [not_null]
      - name: electricity_price_eur_kwh
        data_type: DOUBLE
        description: >
          EUR/kWh incl. all taxes, medium consumption band DC. Unaveraged, so this
          is the column that shows the 2021-23 energy crisis as it actually
          arrived.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}
      - name: change_vs_previous_half_eur_kwh
        data_type: DOUBLE
        description: >
          Change from the preceding half-year, EUR/kWh. Signed. Null at the start
          of each country's series and across any gap in it — the previous row a
          country has is not always the previous half, so this is only reported
          when it is.
      - name: change_vs_previous_half_pct
        data_type: DOUBLE
        description: >
          The same change as a percent. Deliberately untested: the Dutch 2022-S2
          figure is +320% off a rebate-suppressed S1, which is reality rather than
          a bug. Also null where the previous price was zero.
      - name: electricity_price_usd_kwh
        data_type: DOUBLE
        description: >
          The same price in US dollars, converted at the *average* USD/EUR rate
          over the same half-year, because a price paid across a period is a flow
          and not a balance. This is the warehouse's only currency conversion,
          and it exists because this is its only euro-denominated measurement
          sitting beside dollar-denominated GDP.

          It changes the story rather than restating it: across the 39 countries
          present in both halves, the average household price rose **35%**
          between 2021-S1 and 2022-S2 in euros and **13.5%** in dollars, because
          the euro fell from 1.205 to 1.014 over the same eighteen months.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2, inclusive: false}
      - name: usd_per_eur_period_avg
        data_type: DOUBLE
        description: >
          The rate actually used, on the row it was used on. A converted figure
          whose rate is not visible is a figure nobody downstream can check.
        data_tests: [not_null]
      - name: usd_per_eur_period_end
        data_type: DOUBLE
        description: >
          The closing rate for the same half — shipped and deliberately *not*
          used. It is the correct rate for a balance and the wrong one for a
          price, and carrying both is what keeps that a visible choice.
        data_tests: [not_null]
      - name: usd_conversion_is_partial_period
        data_type: BOOLEAN
        description: >
          True when the half-year's FX average is over a period that has not
          finished. Same caveat as `price_is_partial_year` one model over, for
          the same reason.
        data_tests: [not_null]

  - name: fct_example_scope2_emissions
    config:
      contract:
        enforced: true
      group: compliance
    description: >
      The worked example for `dim_grid_emission_factors`: metered MWh x factor
      -> tonnes CO2e, per site, which is the whole of location-based Scope 2
      accounting under the GHG Protocol.

      **The twelve sites are invented** — `seeds/example_scope2_sites.csv`, the
      only fabricated data in this warehouse. The factors they are multiplied by
      are real, and each site takes the most recent one published for its
      country, which is a different year for different countries. The seed's
      countries are constrained to the fixture slice so the `not_null` gates
      below stay real under CI; see the seed's own description.

      It is modelled rather than left as a query on the Scope 2 page because the
      arithmetic is the product. `scope2_at_best_grid_t_co2e` and
      `scope2_at_worst_grid_t_co2e` reprice the identical consumption on the
      cleanest and dirtiest grid the group already operates on, so the spread is
      the cost of siting decisions already taken rather than a hypothetical.

      Grain: one row per site.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [site_id]
    columns:
      - name: site_id
        data_type: VARCHAR
        data_tests: [not_null]
      - name: site_name
        data_type: VARCHAR
      - name: site_type
        data_type: VARCHAR
      - name: country_iso3
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_name
        data_type: VARCHAR
      - name: annual_electricity_mwh
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: factor_year
        data_type: INTEGER
        description: >
          The vintage of the factor applied to this site. Deliberately on the
          fact rather than looked up: two sites in the same group can be priced
          off different years, and a disclosure has to be able to say so.
        data_tests: [not_null]
      - name: latest_factor_lag_years
        data_type: INTEGER
      - name: emission_factor_g_co2_per_kwh
        data_type: DOUBLE
        description: >
          Null would mean a site in a country with no published factor — a group
          total that quietly under-reports. The join is a left join so that
          arrives here as a failing row rather than a missing site.
        data_tests: [not_null]
      - name: low_carbon_share_elec_pct
        data_type: DOUBLE
      - name: scope2_t_co2e
        data_type: DOUBLE
        description: Location-based Scope 2 emissions for one year, tonnes CO2e.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_of_group_pct
        data_type: DOUBLE
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: scope2_at_best_grid_t_co2e
        data_type: DOUBLE
        description: The same consumption on the cleanest grid the group operates on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: scope2_at_worst_grid_t_co2e
        data_type: DOUBLE
        description: The same consumption on the dirtiest grid the group operates on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: fct_cbam_exposure
    config:
      contract:
        enforced: true
      group: compliance
    description: >
      What a tonne of an imported CBAM good costs at the EU border, by where it
      was made: Annex I's default values resolved against the annex's own
      fallback rule, marked up on the statutory schedule, and multiplied by an
      EU ETS price.

      Grain: one row per (country or territory listed in the annex, good) —
      12,532 rows over 119 countries and 287 goods. Countries the annex does not
      list are deliberately absent: the regulation sends every one of them to the
      same "other countries and territories" table, so ranking them against each
      other would be ranking a hundred copies of one number. That table is here
      as its own row, flagged `is_fallback_table`.

      **The carbon price is a parameter, not a measurement.** There is no clean
      free API for EUA spot, so `eu_ets_price_eur_per_t` is a dbt var (EUR 75)
      and the tonnage columns ship beside the euro columns so a consumer can
      re-price without a rebuild. `reports/pages/cbam.md` draws the EUR 60-120
      sensitivity straight off them.

      **A screening tool, not a filing.** These are administrative values with a
      mark-up designed to be worse than reality, so that going and getting
      verified supplier data pays. What this ranks is which sourcing lanes are
      worth that effort — not what any particular importer will owe.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_or_territory, good_key]
    columns:
      - name: country_or_territory
        data_type: VARCHAR
        data_tests: [not_null]
      - name: country_iso3
        data_type: VARCHAR
        description: >
          Null only for the fallback table's own row. Not tested against the
          country dimension: the annex lists Taiwan and Kosovo, and the join to
          `stg_country` is a left join so a territory the World Bank does not
          carry keeps its default values rather than vanishing.
      - name: country_name
        data_type: VARCHAR
      - name: country_display_name
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: income_group
        data_type: VARCHAR
      - name: product_group
        data_type: VARCHAR
        data_tests: [not_null]
      - name: cn_code
        data_type: VARCHAR
      - name: goods_description
        data_type: VARCHAR
      - name: good_key
        data_type: VARCHAR
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cbam_goods')
                field: good_key
      - name: production_route_code
        data_type: VARCHAR
      - name: is_fallback_table
        data_type: BOOLEAN
      - name: is_country_specific
        data_type: BOOLEAN
        description: >
          False where the annex prints "-" for this country and good and the
          value below came from the fallback table. 1,601 of 12,532 rows — one in
          eight — so a model that only handled *unlisted* countries would leave
          that many rows with a null cost.
        data_tests: [not_null]
      - name: markup_is_inferred
        data_type: BOOLEAN
      - name: direct_t_co2e_per_t
        data_type: DOUBLE
      - name: indirect_t_co2e_per_t
        data_type: DOUBLE
      - name: total_t_co2e_per_t
        data_type: DOUBLE
        description: Embedded emissions per tonne of good, before the mark-up.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: certificates_2026_t_co2e_per_t
        data_type: DOUBLE
        description: >
          Certificates surrendered per tonne, i.e. after the mark-up. Not null
          anywhere: every row either carries a country-specific value or resolves
          to the fallback, and this test is what proves the fallback join covers
          the annex.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: certificates_2027_t_co2e_per_t
        data_type: DOUBLE
      - name: certificates_2028_t_co2e_per_t
        data_type: DOUBLE
      - name: markup_2026_pct
        data_type: DOUBLE
        description: >
          Derived from the published values, not asserted. Fertilisers carry 1%
          in all three years where every other group carries 10 / 20 / 30% — 2,416
          rows, consistent across every country, so it reads as intended. A model
          that hardcoded 10/20/30 would overstate every fertiliser line by nine
          points in 2026 and twenty-seven in 2028.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 31}
      - name: markup_schedule_is_irregular
        data_type: BOOLEAN
        description: >
          Five cement rows (Angola grey clinker / grey Portland / grey hydraulic,
          Argentina grey clinker / grey Portland) compound the mark-up — x1.1,
          x1.21, x1.331 — where every other row adds it. Flagged, not corrected:
          the annex is the legal instrument and this model does not overrule it.
      - name: ets_price_eur_per_t
        data_type: INTEGER
      - name: cbam_cost_2026_eur_per_t
        data_type: DOUBLE
        description: Certificates x `eu_ets_price_eur_per_t`, EUR per tonne of good.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: cbam_cost_2027_eur_per_t
        data_type: DOUBLE
      - name: cbam_cost_2028_eur_per_t
        data_type: DOUBLE
      - name: excess_over_cleanest_source_t_co2e_per_t
        data_type: DOUBLE
        description: >
          This country's 2026 certificates per tonne minus the cheapest listed
          source of the same good. The procurement number: the same tonne of steel
          carries a different border cost depending only on which country smelted
          it.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: grid_factor_year
        data_type: INTEGER
      - name: grid_factor_t_co2_per_mwh
        data_type: DOUBLE
        description: >
          The country's latest OWID grid emission factor, as context for the
          indirect column. **Not the factor the annex used** — the annex's
          indirect values come from IEA data under a non-commercial licence this
          project does not redistribute. Sitting beside, not reconciled against.
      - name: source_instrument
        data_type: VARCHAR
        data_tests: [not_null]
      - name: factor_basis
        data_type: VARCHAR

  - name: dim_date
    config:
      contract:
        enforced: true
      group: reference
    description: >
      The calendar: one row per day, 1999-01-01 to the end of the year the FX
      series reaches, dense and gapless by construction. 10,227 rows today, and
      both ends move with the data rather than being pinned.

      The warehouse ran without one until the daily FX rates landed, because
      nothing here had a grain finer than a year. It exists so that "which
      quarter is this", "is this a weekday" and "which fiscal year does this fall
      in" are answered by a join and answered identically everywhere.

      Two things it deliberately does not claim. It is **not a market calendar**
      — the ECB's TARGET closures are not derivable from any weekday rule, so
      they are observed as absences in `fct_fx_rates_daily` rather than asserted
      here. And its **fiscal columns are a policy**, taken from the
      `fiscal_year_start_month` var and carried on every row, because the same
      Tuesday belongs to different fiscal years depending on whose books you are
      keeping.
    data_tests:
      # Dense and gapless: one row per day between the ends, no more and no less.
      # A date dimension with a hole in it is worse than none, because every
      # left join onto it silently loses rows instead of failing.
      - dbt_utils.expression_is_true:
          name: dim_date_has_no_missing_days
          arguments:
            expression: >
              (select count(*) from {{ ref('dim_date') }})
              = (
                  select date_diff('day', min(date_day), max(date_day)) + 1
                  from {{ ref('dim_date') }}
              )
    columns:
      - name: date_day
        data_type: DATE
        data_tests: [not_null, unique]
      - name: date_key
        data_type: INTEGER
        description: "Integer surrogate, yyyymmdd — sorts and reads like the date."
        data_tests: [not_null, unique]
      - name: year
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1999, max_value: 2100}
      - name: quarter
        data_type: INTEGER
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 4}
      - name: month
        data_type: INTEGER
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}
      - name: day_of_month
        data_type: INTEGER
      - name: day_of_year
        data_type: INTEGER
      - name: month_name
        data_type: VARCHAR
      - name: year_start_date
        data_type: TIMESTAMP
      - name: year_end_date
        data_type: TIMESTAMP
      - name: quarter_start_date
        data_type: TIMESTAMP
      - name: quarter_end_date
        data_type: TIMESTAMP
      - name: month_start_date
        data_type: TIMESTAMP
      - name: month_end_date
        data_type: DATE
      - name: half
        data_type: VARCHAR
        description: "'S1'/'S2', spelled Eurostat's way so the price models join without a translation."
        data_tests:
          - accepted_values:
              arguments: {values: ['S1', 'S2']}
      - name: half_start_date
        data_type: DATE
      - name: iso_year
        data_type: INTEGER
        description: >
          The ISO-8601 week-numbering year, which is **not** `year`. 2021-01-01
          is a Friday in ISO week 53 of ISO year 2020, and 2019-12-30 is already
          in week 1 of 2020 — so grouping weekly by (year, iso_week) splits one
          week across two buckets and files week 53 next to week 1. Pair this
          with `iso_week`, or group on `iso_week_start_date`.
        data_tests: [not_null]
      - name: iso_week
        data_type: INTEGER
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 53}
      - name: iso_week_label
        data_type: VARCHAR
      - name: iso_week_start_date
        data_type: DATE
        description: The Monday of this row's ISO week — the safe weekly grouping key.
        data_tests: [not_null]
      - name: day_of_week
        data_type: INTEGER
        description: ISO day number, 1 = Monday.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 7}
      - name: day_name
        data_type: VARCHAR
      - name: is_weekday
        data_type: BOOLEAN
        description: >
          Monday-Friday. A generic flag, not a business-day one: whether a given
          weekday is a trading day depends on a market calendar this model does
          not have.
        data_tests: [not_null]
      - name: is_weekend
        data_type: BOOLEAN
      - name: fiscal_year_start_month
        data_type: INTEGER
        description: >
          The policy that produced the fiscal columns, carried per row so anything
          joining on them can tell which convention built the table.
        data_tests: [not_null]
      - name: fiscal_year_start_date
        data_type: DATE
      - name: fiscal_year_end_date
        data_type: TIMESTAMP
      - name: fiscal_year
        data_type: INTEGER
        description: >
          The calendar year the fiscal year *ends* in — the convention that makes
          this collapse onto `year` when `fiscal_year_start_month` is 1.
        data_tests: [not_null]
      - name: fiscal_quarter
        data_type: INTEGER
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 4}
      - name: fiscal_month
        data_type: INTEGER
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}

  - name: dim_currency
    config:
      contract:
        enforced: true
      group: reference
    description: >
      One row per currency the ECB series has ever quoted, joining the
      `currencies` seed to the series' own evidence of when each code was live.
      47 rows: 46 quoted plus the euro, which is the base of every quote and so
      never appears as one.

      It exists because the panel is not fixed. 17 codes have stopped — ten at a
      euro adoption, two at a redenomination, five without an explanation this
      project is willing to invent — and two of the survivors have interior gaps
      where the currency itself stopped working (Iceland 2008-2018, Argentina
      2002). Anything that carries a rate forward has to know all of that, which
      is why `first_published_date` / `last_published_date` bound the spine in
      `fct_fx_rates_daily`.
    data_tests:
      # The seed's claim, checked against the series from the other side: a
      # currency the seed says was retired must have stopped being quoted, and
      # one it says nothing about must not have a retirement date invented for it.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_currently_published"
          config:
            where: "retired_on is not null"
    columns:
      - name: currency_code
        data_type: VARCHAR
        data_tests: [not_null, unique]
      - name: currency_name
        data_type: VARCHAR
        data_tests: [not_null]
      - name: first_published_date
        data_type: DATE
        description: Null only for EUR, which is quoted against rather than quoted.
      - name: last_published_date
        data_type: DATE
      - name: n_published_days
        data_type: BIGINT
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: is_quoted
        data_type: BOOLEAN
        description: >
          False for exactly one row, EUR. Filter on it before ranking or charting
          rates, or the base currency joins in with nulls everywhere.
        data_tests: [not_null]
      - name: is_currently_published
        data_type: BOOLEAN
        description: >
          Whether the code still has a live quote, tolerant of missing the single
          newest day by the same margin the carry-forward uses — so this and
          "carried forward to today" cannot disagree.
      - name: longest_gap_days
        data_type: BIGINT
        description: >
          The longest run of calendar days between two consecutive fixings. 3 for
          a weekend, 5 for the Christmas closures, and only two values far beyond
          that: ISK at 3,341 and ARS at 34.
      - name: has_interior_gap
        data_type: BOOLEAN
        description: A quote that stopped and resumed, rather than one that stopped.
        data_tests: [not_null]
      - name: retired_on
        data_type: DATE
      - name: retired_reason
        data_type: VARCHAR
      - name: replaced_by_currency
        data_type: VARCHAR
      - name: retirement_is_explained
        data_type: BOOLEAN
        description: >
          Whether the seed records a reason. Five retirements deliberately have
          none — reading their null `retired_on` as "still current" is the mistake
          this column exists to prevent.
        data_tests: [not_null]

  - name: fct_fx_rates_published
    config:
      contract:
        enforced: true
      group: reference
    description: >
      Every ECB euro reference rate as published, one row per (rate_date,
      quote_currency). 265,035 rows over 7,066 publication days and 46
      currencies. Sparse on purpose: no row on a weekend, a TARGET holiday, or
      for a currency outside its quoted lifetime.

      **The project's first and only incremental model.** Every other table here
      is a re-derivation of a source that is fully re-fetched, so rebuilding it
      is how a restatement gets picked up rather than waste. This one grows by
      ~30 rows a day forever and a published fixing never changes, which is the
      shape `materialized='incremental'` is actually for. `delete+insert` on the
      grain rather than `append`, because ingestion re-asks for a lookback window
      and an append would duplicate every row in it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, quote_currency]
      # An incremental model can drift from its source in a way a table model
      # cannot — a missed window, or a `unique_key` that stopped matching the
      # grain — and nothing else would notice. This is the cheap guard, and it is
      # the reason to keep this model a faithful copy of the view rather than
      # letting it filter or reshape: as long as that holds, one row count
      # answers "did the incremental logic lose anything".
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_fx_rates')
    columns:
      - name: rate_date
        data_type: DATE
        data_tests: [not_null]
      - name: quote_currency
        data_type: VARCHAR
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['EUR']}
      - name: units_per_eur
        data_type: DOUBLE
        description: Units of the quote currency per 1 EUR, exactly as the ECB quotes it.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: eur_per_unit
        data_type: DOUBLE
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: date_key
        data_type: INTEGER
        description: >
          Computed here rather than joined from `dim_date`, so this model has no
          dependencies and can be backfilled or rebuilt on its own.
        data_tests: [not_null]

  - name: fct_fx_rates_daily
    config:
      contract:
        enforced: true
      group: reference
    description: >
      The reference rates on every calendar day within each currency's quoted
      lifetime, gap-filled. Grain: one row per (date_day, currency_code).
      381,414 rows — 265,035 published, 113,020 carried forward and 3,359 stale.

      **The gap is the model.** 30% of calendar days carry no fixing (2,878
      weekend days and 134 weekday TARGET closures), so a transaction dated on a
      Sunday forces a decision. This carries the last published rate forward,
      which is what a finance system does and is the same operation as a
      slowly-changing lookup — and it caps the carry at
      `fx_max_carry_forward_days`, because the alternative is filling Iceland's
      nine-year suspension with a pre-collapse rate. `rate_source_date` says
      which fixing every row is quoting.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, currency_code]
      # No row may quote a fixing from the future. This is the whole correctness
      # condition of a carry-forward, and it is one wrong window frame away from
      # being false — a default frame reaches forward and backfills the past.
      #
      # Both of these are named explicitly: dbt derives a test's stored-failure
      # table name from the model and the column *tokens* in the expression, so
      # two tests over the same two columns collide on one name and the project
      # fails to compile.
      - dbt_utils.expression_is_true:
          name: fx_daily_never_quotes_a_future_fixing
          arguments:
            expression: "rate_source_date <= date_day"
      # Every published rate must survive into the dense table unchanged. Catches
      # a fill that overwrote real observations with carried ones.
      - dbt_utils.expression_is_true:
          name: fx_daily_keeps_published_rates_on_their_own_day
          arguments:
            expression: "rate_source_date = date_day"
          config:
            where: "is_published_rate"
    columns:
      - name: date_day
        data_type: DATE
        data_tests: [not_null]
      - name: date_key
        data_type: INTEGER
      - name: currency_code
        data_type: VARCHAR
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
        data_tests: [not_null]
      - name: units_per_eur
        data_type: DOUBLE
        description: >
          Null where the carry has run past the cap, so a stale number cannot be
          multiplied by anything by accident. That is 3,359 rows: Iceland
          2008-2018 and Argentina in early 2002.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: eur_per_unit
        data_type: DOUBLE
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: rate_source_date
        data_type: DATE
        description: The publication date of the fixing this row is quoting.
        data_tests: [not_null]
      - name: days_since_published_rate
        data_type: BIGINT
        description: 0 on a publication day, 1-2 over a weekend, more over a holiday.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: is_published_rate
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: is_carried_forward
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: is_rate_stale
        data_type: BOOLEAN
        description: >
          The carry ran past the cap and the rate is null. Not an error — an
          absence you can count, which is the point of keeping the row.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
      - name: quarter
        data_type: INTEGER
      - name: month
        data_type: INTEGER
      - name: half
        data_type: VARCHAR
      - name: is_weekday
        data_type: BOOLEAN

  - name: fct_fx_rates_periods
    config:
      contract:
        enforced: true
      group: reference
    description: >
      Rates aggregated to month, quarter, half and year. Grain: one row per
      (period_type, period_start_date, currency_code).

      **It exists for one decision: spot or average.** A stock — a balance, a
      position at an instant — converts at the closing rate; a flow — revenue,
      spend, a price paid over a period — converts at the period average. Both
      ship, named for what they are, and this model picks for nobody.
      `period_end_vs_avg_pct` measures the cost of choosing wrong: +11.7% for
      EUR/USD in 2003, -8.6% in 2014, and +98% for the Icelandic krona in 2008.

      Two subtleties baked in. The averages are taken over *published fixings*,
      not over the dense daily table, which would weight every Friday three times
      and more over a holiday weekend. And `avg_eur_per_unit` is not
      1 / `avg_units_per_eur` — the mean of reciprocals is not the reciprocal of
      the mean, and the two differ by 0.07% in a calm year and 0.53% in 2008.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [period_type, period_start_date, quote_currency]
      # The annual average must be reconstructible from the fixings it covers.
      # Guards the join to `dim_date` — a period key that drifted by a day would
      # silently move fixings between buckets.
      - dbt_utils.expression_is_true:
          name: fx_periods_annual_buckets_cover_every_fixing
          arguments:
            expression: >
              (
                  select sum(n_published_days)
                  from {{ ref('fct_fx_rates_periods') }}
                  where period_type = 'year'
              )
              = (select count(*) from {{ ref('fct_fx_rates_published') }})
    columns:
      - name: period_type
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['month', 'quarter', 'half', 'year']}
      - name: period_start_date
        data_type: TIMESTAMP
        data_tests: [not_null]
      - name: period_label
        data_type: VARCHAR
        description: "'2022-05', '2022-q2', '2022-S1', '2022' — the half spelled Eurostat's way."
        data_tests: [not_null]
      - name: period_end_date
        data_type: TIMESTAMP
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
      - name: quote_currency
        data_type: VARCHAR
        data_tests: [not_null]
      - name: base_currency
        data_type: VARCHAR
      - name: avg_units_per_eur
        data_type: DOUBLE
        description: For flows. The mean of the fixings actually published in the period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: avg_eur_per_unit
        data_type: DOUBLE
        description: >
          The mean of the reciprocals, which is not the reciprocal of the mean —
          see the model description. Convert in the direction the rate is quoted
          where you have the choice.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: period_end_units_per_eur
        data_type: DOUBLE
        description: For stocks. The last fixing published inside the period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: period_end_eur_per_unit
        data_type: DOUBLE
        description: Its exact reciprocal — a single point inverts without the averaging problem.
        data_tests: [not_null]
      - name: period_start_units_per_eur
        data_type: DOUBLE
        data_tests: [not_null]
      - name: period_end_vs_avg_pct
        data_type: DOUBLE
        description: >
          How far the closing rate sits from the average, as a percent of the
          average. Deliberately untested for range: a currency crisis legitimately
          puts it near +100%.
      - name: min_units_per_eur
        data_type: DOUBLE
      - name: max_units_per_eur
        data_type: DOUBLE
      - name: intra_period_range_pct
        data_type: DOUBLE
        description: High-to-low spread within the period, as a percent of the low.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: n_published_days
        data_type: BIGINT
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: first_rate_date
        data_type: DATE
      - name: last_rate_date
        data_type: DATE
      - name: period_is_complete
        data_type: BOOLEAN
        description: >
          False where the period has not finished, so the current year's average
          is over the months that have happened. The `price_is_partial_year`
          lesson from the Eurostat models, arriving again.
        data_tests: [not_null]

  - name: fct_retail_order_line
    config:
      contract:
        enforced: true
      group: retail
    description: >
      Order lines priced in GBP, EUR and USD and joined to `dim_date`, at
      (invoice, line_number). The warehouse's finest grain and the first fact in
      it that records something a person did. This is also where the currency and
      calendar work stops being a demonstration: it is the only fact here with a
      timestamp and a transactional money amount, which is the shape that
      actually needs both.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice, line_number]
      # The fact must not lose or gain a line against staging. It is an inner
      # join to the date dimension, so a transaction dated outside the calendar's
      # range would vanish silently — this is what makes that loud.
      - dbt_utils.equal_rowcount:
          arguments: {compare_model: ref('stg_retail_lines')}
      # Every line converts. GBP is quoted for the whole 2009-2011 window so
      # there is no legitimate null here, and one would mean the carry-forward
      # cap had been hit — which for GBP would be news.
      - dbt_utils.expression_is_true:
          name: fct_retail_every_line_converts_to_eur
          arguments: {expression: "line_amount_eur is not null"}
    columns:
      - name: invoice
        data_type: VARCHAR
        data_tests: [not_null]
      - name: line_number
        data_type: BIGINT
        data_tests: [not_null]
      - name: invoice_type
        data_type: VARCHAR
      - name: item_type
        data_type: VARCHAR
      - name: stock_code
        data_type: VARCHAR
      - name: description
        data_type: VARCHAR
      - name: customer_id
        data_type: VARCHAR
      - name: country
        data_type: VARCHAR
      - name: invoice_ts
        data_type: TIMESTAMP
      - name: invoice_date
        data_type: DATE
      - name: invoice_month
        data_type: VARCHAR
      - name: date_key
        data_type: INTEGER
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        description: >
          Calendar year, and the Parquet lake's partition column. Carried
          explicitly rather than reusing the `iso_year` beside it: the two agree
          on every row here only because the business shuts from 23 December to
          4 January, so no order lands on a day where ISO week 1 crosses the new
          year. Partitioning on `iso_year` would be correct today and wrong the
          first New Year they trade.
        data_tests: [not_null]
      - name: iso_year
        data_type: INTEGER
      - name: iso_week
        data_type: INTEGER
      - name: iso_week_start_date
        data_type: DATE
      - name: day_name
        data_type: VARCHAR
      - name: is_weekend
        data_type: BOOLEAN
      - name: fiscal_year
        data_type: INTEGER
      - name: fiscal_quarter
        data_type: INTEGER
      - name: quantity
        data_type: BIGINT
      - name: unit_price
        data_type: DOUBLE
      - name: line_amount_gbp
        data_type: DOUBLE
        data_tests: [not_null]
      - name: line_amount_eur
        data_type: DOUBLE
        description: Converted at the transaction date's ECB fixing, carried forward over closures.
        data_tests: [not_null]
      - name: line_amount_usd
        data_type: DOUBLE
        description: GBP to EUR to USD, both legs at the same date's fixing.
        data_tests: [not_null]
      - name: eur_per_gbp
        data_type: DOUBLE
      - name: fx_rate_source_date
        data_type: DATE
        description: >
          The date of the fixing actually used. Differs from `invoice_date` on
          13.1% of lines, almost all of them Sundays — this retailer trades on a
          day the ECB does not quote, which is the carry-forward earning its
          keep on real data rather than on a weekend in the abstract.
        data_tests: [not_null]
      - name: fx_rate_is_carried_forward
        data_type: BOOLEAN
      - name: is_revenue_line
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: is_stock_write_off
        data_type: BOOLEAN

  - name: dim_retail_product
    config:
      contract:
        enforced: true
      group: retail
    description: >
      One row per stock code (5,131), with a survivorship-picked description.
      1,192 codes carry more than one label across their lines and one carries
      nine, so the dimension has to choose — modal, then alphabetical, so that a
      rebuild picks the same one and a diff between builds means something.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [stock_code]}
      # `item_type` is derived per line and asserted constant per code. It is
      # constant by construction today; this is what stops that from becoming
      # untrue the first time somebody edits the CASE in staging.
      - dbt_utils.expression_is_true:
          name: dim_retail_product_item_type_is_constant_per_code
          arguments:
            expression: >
              (select count(*) from (
                 select stock_code from {{ ref('stg_retail_lines') }}
                 group by 1 having count(distinct item_type) > 1)) = 0
    columns:
      - name: stock_code
        data_type: VARCHAR
        data_tests: [not_null, unique]
      - name: description
        data_type: VARCHAR
        description: >
          Null for 4 codes that never carried one on any line. Not tested for
          nullity: an absent label is the source's answer, not a join failure.
      - name: item_type
        data_type: VARCHAR
        data_tests: [not_null]
      - name: n_lines
        data_type: BIGINT
      - name: n_invoices
        data_type: BIGINT
      - name: n_customers
        data_type: BIGINT
      - name: first_sold_date
        data_type: DATE
      - name: last_sold_date
        data_type: DATE
      - name: units_sold
        data_type: HUGEINT
      - name: units_returned
        data_type: HUGEINT
      - name: net_revenue_gbp
        data_type: DOUBLE
      - name: median_unit_price_gbp
        data_type: DOUBLE
        description: >
          Median, not mean. This retailer sells the same SKU at wholesale and
          retail prices, so the mean lands between two prices that both exist and
          on one that doesn't.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: min_unit_price_gbp
        data_type: DOUBLE
      - name: max_unit_price_gbp
        data_type: DOUBLE
      - name: n_descriptions
        data_type: BIGINT
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: has_multiple_descriptions
        data_type: BOOLEAN
      - name: is_non_product
        data_type: BOOLEAN

  - name: dim_retail_customer
    config:
      contract:
        enforced: true
      group: retail
    description: >
      One row per identified customer (5,881 of the 5,942 ids that appear; the
      other 61 never made a purchase). Covers 86.2% of net revenue — the rest is
      anonymous and structurally cannot be attributed, which every per-customer
      figure downstream inherits and which the Evidence page states rather than
      implies.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [customer_id]}
      # A customer cannot be active before they were acquired.
      - dbt_utils.expression_is_true:
          name: dim_retail_customer_last_order_is_not_before_first
          arguments: {expression: "last_order_date >= first_order_date"}
    columns:
      - name: customer_id
        data_type: VARCHAR
        data_tests: [not_null, unique]
      - name: country
        data_type: VARCHAR
      - name: n_countries
        data_type: BIGINT
      - name: has_moved_country
        data_type: BOOLEAN
      - name: first_order_date
        data_type: DATE
        data_tests: [not_null]
      - name: cohort_month
        data_type: VARCHAR
        description: Month of first *purchase*, not of first appearance.
        data_tests: [not_null]
      - name: last_order_date
        data_type: DATE
      - name: tenure_days
        data_type: BIGINT
        description: Zero for the 1,626 customers who ordered once — a fact, not a gap.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: n_orders
        data_type: BIGINT
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: n_cancellations
        data_type: BIGINT
      - name: n_active_months
        data_type: BIGINT
      - name: n_distinct_products
        data_type: BIGINT
      - name: units_bought
        data_type: HUGEINT
      - name: gross_revenue_gbp
        data_type: DOUBLE
      - name: returned_gbp
        data_type: DOUBLE
      - name: net_revenue_gbp
        data_type: DOUBLE
      - name: avg_order_value_gbp
        data_type: DOUBLE
      - name: return_rate_pct
        data_type: DOUBLE
        description: >
          By value, not by order count. Deliberately carries no upper bound: a
          customer who returns more than they bought in the window is a real
          pattern at the extract's edges, not a bug.
      - name: is_repeat_customer
        data_type: BOOLEAN
      - name: is_left_censored_cohort
        data_type: BOOLEAN
        description: >
          True for the 955 customers whose first order is in the extract's first
          month and who may have been customers for years already.
        data_tests: [not_null]

  - name: fct_retail_returns
    config:
      contract:
        enforced: true
      group: retail
    description: >
      Returns matched back to the sale they reverse, one row per return line
      (18,286). The source carries no link between the two — no order reference,
      no RMA — so the join is inferred by an `asof` on the same customer's most
      recent prior purchase of the same product, and the model reports how often
      that failed: 87.6% match cleanly, 2.0% match to a smaller purchase, 8.4%
      have no prior purchase in the window and 1.9% have no customer id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [invoice, line_number]}
      # A return cannot be matched to a sale that happened after it. The asof
      # join's inequality is what guarantees this, so the test is really on the
      # join direction — the single easiest thing to get backwards here.
      - dbt_utils.expression_is_true:
          name: fct_retail_returns_never_match_a_later_sale
          arguments:
            expression: "original_invoice_date <= invoice_date"
            config: {where: "is_matched"}
    columns:
      - name: invoice
        data_type: VARCHAR
        data_tests: [not_null]
      - name: line_number
        data_type: BIGINT
        data_tests: [not_null]
      - name: customer_id
        data_type: VARCHAR
      - name: stock_code
        data_type: VARCHAR
      - name: description
        data_type: VARCHAR
      - name: country
        data_type: VARCHAR
      - name: invoice_ts
        data_type: TIMESTAMP
      - name: invoice_date
        data_type: DATE
      - name: invoice_month
        data_type: VARCHAR
      - name: quantity_returned
        data_type: BIGINT
        description: Positive. The signed amount stays signed in `return_amount_gbp`.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: unit_price
        data_type: DOUBLE
      - name: return_amount_gbp
        data_type: DOUBLE
      - name: original_invoice
        data_type: VARCHAR
      - name: original_line_number
        data_type: BIGINT
      - name: original_invoice_date
        data_type: DATE
      - name: original_quantity
        data_type: BIGINT
      - name: original_unit_price
        data_type: DOUBLE
      - name: original_amount_gbp
        data_type: DOUBLE
      - name: days_to_return
        data_type: BIGINT
        description: >
          Median 10, mean 32, max 656. The shape is itself a check on the
          matching rule — an arbitrary match would spread flat over the window.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: is_matched
        data_type: BOOLEAN
        data_tests: [not_null]
      - name: match_status
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - matched
                  - 'matched, quantity exceeds purchase'
                  - no prior purchase in window
                  - no customer id
      - name: quantity_is_consistent
        data_type: BOOLEAN
      - name: price_differs_from_original
        data_type: BOOLEAN

  - name: fct_retail_customer_cohorts
    config:
      contract:
        enforced: true
      group: retail
    description: >
      Monthly acquisition cohorts and their retention, at
      (cohort_month, months_since_first_order). Ragged on purpose: a cohort only
      has rows for months it could have been observed in, so nothing averages in
      a period that had no chance to happen. Retention is against the cohort's
      own size, never against the previous month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, months_since_first_order]
      # Month zero is every cohort's own definition, so it must be exactly 100%.
      # This is the structural check on the whole triangle: an off-by-one in the
      # month arithmetic, a cohort assigned from the wrong date, or a customer
      # counted in two cohorts all show up here first.
      - dbt_utils.expression_is_true:
          name: fct_retail_cohorts_month_zero_is_full_retention
          arguments:
            expression: "retention_pct = 100"
            config: {where: "months_since_first_order = 0"}
      # `retail_max_cohort_age_months` is an upper bound on generation, and
      # setting it below the extract's span truncates the oldest cohorts into
      # what reads as churn — silently, because a short curve looks like a
      # result. The first cohort must reach the last month in the table.
      - dbt_utils.expression_is_true:
          name: fct_retail_cohorts_are_not_truncated
          arguments:
            expression: >
              (select max(p.months_since_first_order) + 1
               from {{ ref('fct_retail_customer_cohorts') }} as p
               where p.cohort_month = (select min(q.cohort_month)
                                       from {{ ref('fct_retail_customer_cohorts') }} as q))
              = (select count(distinct r.activity_month)
                 from {{ ref('fct_retail_customer_cohorts') }} as r)
    columns:
      - name: cohort_month
        data_type: VARCHAR
        data_tests: [not_null]
      - name: months_since_first_order
        data_type: INTEGER
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: activity_month
        data_type: VARCHAR
      - name: cohort_size
        data_type: BIGINT
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: active_customers
        data_type: BIGINT
      - name: net_revenue_gbp
        data_type: DOUBLE
      - name: retention_pct
        data_type: DOUBLE
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: revenue_per_active_customer_gbp
        data_type: DOUBLE
      - name: is_left_censored_cohort
        data_type: BOOLEAN
      - name: is_complete_period
        data_type: BOOLEAN
        description: >
          False for each cohort's final row: the extract stops on 2011-12-09, so
          every curve's last month is nine days long. A retention chart that ends
          on a cliff is reading that, not a collapse in loyalty.
        data_tests: [not_null]
