version: 2

models:
  - name: fct_retail_order_line
    config:
      contract:
        enforced: true
    description: >
      Order lines priced in GBP, EUR and USD and joined to `dim_date`, at
      (invoice, line_number). The warehouse's finest grain and the first fact in
      it that records something a person did. This is also where the currency and
      calendar work stops being a demonstration: it is the only fact here with a
      timestamp and a transactional money amount, which is the shape that
      actually needs both.

      **Converted at the transaction date's rate.** A line is a flow at an
      instant, so the daily fixing is its rate; the spot-or-average question of
      `fct_fx_rates_periods` arises only on aggregation, and summing converted
      lines answers it. The rate may be carried forward, and the row says so:
      139,658 lines (13.1%) fall on a day the ECB did not quote, so
      `fx_rate_source_date` and `fx_rate_is_carried_forward` travel with the
      amount. Every one is a Sunday: this business trades on Sundays (139,256
      lines, against 402 on Saturdays) and closes on the TARGET holidays.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice, line_number]
      # The fact must not lose or gain a line against staging. It is an inner
      # join to the date dimension, so a transaction dated outside the calendar's
      # range would vanish silently — this is what makes that loud.
      - dbt_utils.equal_rowcount:
          arguments: {compare_model: ref('stg_retail_lines')}
      # Every line converts. GBP is quoted for the whole 2009-2011 window so
      # there is no legitimate null here, and one would mean the carry-forward
      # cap had been hit — which for GBP would be news.
      - dbt_utils.expression_is_true:
          name: fct_retail_every_line_converts_to_eur
          arguments: {expression: "line_amount_eur is not null"}
    columns:
      - name: invoice
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
        description: >
          Source invoice number, prefix included: `C` marks a cancellation, `A` an
          adjustment.
        data_tests: [not_null]
      - name: line_number
        data_type: BIGINT
        meta:
          additivity: not_a_measure
        description: >
          Position within the invoice, assigned at ingest from file order. The source
          has no line identifier and exact duplicate rows occur, so content cannot key
          them.
        data_tests: [not_null]
      - name: invoice_type
        data_type: VARCHAR
        description: >
          `sale`, `cancellation` (prefix `C`) or `adjustment` (prefix `A`: bad-debt
          write-downs, the only negative prices).
      - name: item_type
        data_type: VARCHAR
        description: >
          What the line is for: `product` is merchandise; `shipping`, `fee`, `discount`,
          `sample`, `voucher`, `adjustment` and `test` are not. Filter on it before
          counting products.
      - name: stock_code
        data_type: VARCHAR
        description: >
          The product code, upper-cased and trimmed, so codes that differ only by case
          are one product. Joins to `dim_retail_product`.
      - name: description
        data_type: VARCHAR
        description: >
          The label on this line, as the source wrote it. Varies for the same
          `stock_code`; `dim_retail_product.description` is the most common one. Null on
          some lines.
      - name: customer_id
        data_type: VARCHAR
        meta:
          pii: direct_identifier
        description: >
          The customer's id, pseudonymised in the release. Null on the sales nobody
          signed in for, about a fifth of lines, so a customer-level total is not the
          business total.
      - name: country
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
        description: >
          The source's own country label, kept as written (`EIRE`, `RSA`, `USA`). Group
          by `country_iso3` to join the country tables.
      - name: country_iso3
        description: >
          The conformed country key, resolved from `country` through the
          `retail_country_map` seed. This is what joins retail to
          `dim_country_year` and everything built on it. Null on the 871 lines
          (0.08%) whose label is an aggregate or an absence — `European
          Community`, `West Indies`, `Unspecified` — so it is nullable on
          purpose and the seed's own tests pin which rows may do it.
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
      - name: invoice_ts
        data_type: TIMESTAMP
        meta:
          pii: quasi_identifier
        description: >
          Wall-clock shop time, stored without a timezone on purpose (see
          `stg_retail_lines`).
      - name: invoice_date
        data_type: DATE
        description: >
          The date of `invoice_ts`: the key to `dim_date` and the date the FX rate is
          taken on.
      - name: invoice_month
        data_type: VARCHAR
        description: >
          `YYYY-MM` of `invoice_date`, and the Dagster partition key.
      - name: date_key
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          `invoice_date` as `dim_date`'s integer surrogate, yyyymmdd.
        data_tests: [not_null]
      - name: year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          Calendar year, and the Parquet lake's partition column. Carried
          explicitly rather than reusing the `iso_year` beside it: the two agree
          on every row here only because the business shuts from 23 December to
          4 January, so no order lands on a day where ISO week 1 crosses the new
          year. Partitioning on `iso_year` would be correct today and wrong the
          first New Year they trade.
        data_tests: [not_null]
      - name: iso_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          ISO 8601 year of `invoice_date`, from `dim_date`. Pairs with `iso_week`; see
          `year` for why it is not the partition column.
      - name: iso_week
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: ISO 8601 week, 1-53, of `iso_year`.
      - name: iso_week_start_date
        data_type: DATE
        description: >
          The Monday that starts the ISO week: the column to group a weekly series on.
      - name: day_name
        data_type: VARCHAR
        description: >
          English day name. Sundays trade here although the ECB publishes no rate on
          them.
      - name: is_weekend
        data_type: BOOLEAN
        description: Saturday or Sunday.
      - name: fiscal_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The fiscal year from `dim_date`, named for the calendar year it ends in. It
          starts in the month set by `fiscal_year_start_month`, April in this build.
      - name: fiscal_quarter
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: Quarter of that fiscal year, 1-4.
      - name: quantity
        data_type: BIGINT
        meta:
          additivity: additive
        description: >
          Units, signed: negative on cancellations and on stock write-offs.
      - name: unit_price
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          Price per unit, GBP. Zero on free lines and negative on the bad-debt
          adjustments.
      - name: line_amount_gbp
        data_type: DOUBLE
        meta:
          additivity: additive
        description: >
          `quantity * unit_price`, signed, GBP. The source currency; net revenue is a
          plain sum over `is_revenue_line`.
        data_tests: [not_null]
      - name: line_amount_eur
        data_type: DOUBLE
        meta:
          additivity: additive
        description: Converted at the transaction date's ECB fixing, carried forward over closures.
        data_tests: [not_null]
      - name: line_amount_usd
        data_type: DOUBLE
        meta:
          additivity: additive
        description: GBP to EUR to USD, both legs at the same date's fixing.
        data_tests: [not_null]
      - name: eur_per_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The ECB rate the EUR and USD columns used: euros per pound on
          `fx_rate_source_date`.
      - name: fx_rate_source_date
        data_type: DATE
        description: >
          The date of the fixing actually used. Differs from `invoice_date` on
          13.1% of lines, almost all of them Sundays — this retailer trades on a
          day the ECB does not quote, which is the carry-forward earning its
          keep on real data rather than on a weekend in the abstract.
        data_tests: [not_null]
      - name: fx_rate_is_carried_forward
        data_type: BOOLEAN
        description: >
          True where `invoice_date` had no ECB rate (a Sunday or a TARGET holiday) and
          the last published one was used.
      - name: is_revenue_line
        data_type: BOOLEAN
        description: >
          A product sale, or a genuine return, that a customer was charged for: products
          only, no write-offs or adjustments. The filter behind every revenue figure in
          the retail group.
        data_tests: [not_null]
      - name: is_stock_write_off
        data_type: BOOLEAN
        description: >
          A negative quantity on a sale invoice: stock shrinkage posted through the
          sales ledger, not a customer return.

  - name: dim_retail_product
    config:
      contract:
        enforced: true
    description: >
      One row per stock code (5,131), with a survivorship-picked description.
      1,192 codes carry more than one label across their lines and one carries
      nine, so the dimension has to choose — modal, then alphabetical, so that a
      rebuild picks the same one and a diff between builds means something.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [stock_code]}
      # `item_type` is derived per line and asserted constant per code. It is
      # constant by construction today; this is what stops that from becoming
      # untrue the first time somebody edits the CASE in staging.
      - dbt_utils.expression_is_true:
          name: dim_retail_product_item_type_is_constant_per_code
          arguments:
            expression: >
              (select count(*) from (
                 select stock_code from {{ ref('stg_retail_lines') }}
                 group by 1 having count(distinct item_type) > 1)) = 0
    columns:
      - name: stock_code
        data_type: VARCHAR
        description: >
          The product code, upper-cased and trimmed. One row per code, products and
          non-products alike.
        data_tests: [not_null, unique]
      - name: description
        data_type: VARCHAR
        description: >
          Null for 4 codes that never carried one on any line. Not tested for
          nullity: an absent label is the source's answer, not a join failure.
      - name: item_type
        data_type: VARCHAR
        description: >
          What the code is for: `product`, `shipping`, `fee`, `discount`, `sample`,
          `voucher`, `adjustment` or `test`. Constant within a code.
        data_tests: [not_null]
      - name: n_lines
        data_type: BIGINT
        meta:
          additivity: additive
        description: Lines carrying the code, every invoice type included.
      - name: n_invoices
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: Distinct invoices carrying the code, cancellations included.
      - name: n_customers
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: >
          Distinct signed-in customers. Zero for a code only anonymous customers bought,
          so it undercounts buyers.
      - name: first_sold_date
        data_type: DATE
        description: Date of the first line carrying the code, of any invoice type.
      - name: last_sold_date
        data_type: DATE
        description: Date of the last line carrying the code, of any invoice type.
      - name: units_sold
        data_type: HUGEINT
        meta:
          additivity: additive
        description: Units on positive sale lines, before returns.
      - name: units_returned
        data_type: HUGEINT
        meta:
          additivity: additive
        description: >
          Units cancelled, as a **positive** count — the same direction
          `fct_retail_returns.quantity_returned` points, rather than the negative
          sign the source carries. Null for the 2,233 products never returned,
          which is an absence and not a zero.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: net_revenue_gbp
        data_type: DOUBLE
        # Deliberately not personal, and said out loud rather than left blank. This
        # is revenue per *product*; the name it shares with
        # `dim_retail_customer.net_revenue_gbp` is all the two have in common, and
        # `tests/test_privacy.py` requires the distinction be written down rather
        # than inferred from silence.
        meta:
          additivity: additive
          pii: non_personal
        description: >
          Revenue after returns, GBP, over `is_revenue_line`. Null for every non-product
          code, which is never revenue.
      - name: median_unit_price_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          Median, not mean. This retailer sells the same SKU at wholesale and
          retail prices, so the mean lands between two prices that both exist and
          on one that doesn't.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: min_unit_price_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The lowest positive unit price, GBP; free lines are left out. Null where the
          code never had a positive price.
      - name: max_unit_price_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: The highest unit price, GBP.
      - name: n_descriptions
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: How many distinct labels the code has carried.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: has_multiple_descriptions
        data_type: BOOLEAN
        description: >
          More than one label. `description` shows only the most common, so a rename or
          a typo fix hides here.
      - name: is_non_product
        data_type: BOOLEAN
        description: >
          `item_type` is anything but `product`: postage, fees, discounts and the like.
          Filter these out of any product ranking.

  - name: dim_retail_customer
    config:
      contract:
        enforced: true
    description: >
      One row per identified customer (5,881 of the 5,942 ids that appear; the
      other 61 never made a purchase). Covers 86.2% of net revenue — the rest is
      anonymous and structurally cannot be attributed, which every per-customer
      figure downstream (cohorts, RFM, average order value) inherits and which
      the Evidence page states rather than implies. The 243,007 anonymous lines
      are 22.8% of lines but 13.8% of revenue: quote the share you mean.
      `fct_retail_order_line` keeps every line.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [customer_id]}
      # A customer cannot be active before they were acquired.
      - dbt_utils.expression_is_true:
          name: dim_retail_customer_last_order_is_not_before_first
          arguments: {expression: "last_order_date >= first_order_date"}
    columns:
      - name: customer_id
        data_type: VARCHAR
        meta:
          pii: direct_identifier
        description: >
          The customer's id, pseudonymised in the release by a salted digest stable
          across releases. **Personal data**, and the columns beside it make a customer
          re-identifiable even without it. Only signed-in customers have a row.
        data_tests: [not_null, unique]
      - name: country
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
        description: >
          The source's country label. For a customer seen under two labels it is the
          alphabetically later one, not the latest: see `has_moved_country`.
      - name: country_iso3
        description: >
          The conformed key for the country named beside it, so a customer
          rollup can be grouped by `region` or `income_group`. Taken with
          `max_by` rather than `max`, so that for the 13 customers who transact
          from two countries the code is the one belonging to the label this row
          shows rather than an independent pick. Wrapped in a struct because
          `max_by` skips null values and three seed labels map to no code
          (`Unspecified`, `West Indies`, `European Community`): a customer seen in
          `United Kingdom` and `Unspecified` would otherwise pair `Unspecified`
          with `GBR`. Latent on current data; a unit test guards it.
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
      - name: n_countries
        description: >
          Almost always 1 (13 customers have two). Ships beside the label so a
          Type-1 overwrite of a moved customer's history is visible.
        data_type: BIGINT
        meta:
          additivity: non_additive
      - name: has_moved_country
        data_type: BOOLEAN
        description: >
          True where the customer's lines carry more than one country label. `country`
          shows only one of them.
      - name: first_order_date
        data_type: DATE
        meta:
          pii: quasi_identifier
        description: >
          Date of the first purchase invoice, not of the first line of any kind.
        data_tests: [not_null]
      - name: cohort_month
        data_type: VARCHAR
        description: Month of first *purchase*, not of first appearance.
        meta:
          pii: quasi_identifier
        data_tests: [not_null]
      - name: last_order_date
        data_type: DATE
        meta:
          pii: quasi_identifier
        description: Date of the last invoice of any kind, cancellations included.
      - name: tenure_days
        data_type: BIGINT
        meta:
          additivity: additive
        description: Zero for the 1,626 customers who ordered once — a fact, not a gap.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: n_orders
        data_type: BIGINT
        meta:
          additivity: additive
        description: Distinct sale invoices.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: n_cancellations
        data_type: BIGINT
        meta:
          additivity: additive
        description: >
          Distinct cancellation invoices. Invoices, not units or value; see
          `return_rate_pct` for value.
      - name: n_active_months
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: Distinct months with any invoice, cancellations included.
      - name: n_distinct_products
        data_type: BIGINT
        meta:
          additivity: non_additive
        description: >
          Distinct `product` stock codes the customer's lines touch, returns included.
      - name: units_bought
        data_type: HUGEINT
        meta:
          additivity: additive
        description: >
          Units on positive revenue lines: purchased, before returns.
      - name: gross_revenue_gbp
        data_type: DOUBLE
        meta:
          additivity: additive
        description: >
          Revenue lines with a positive quantity, GBP: sales before returns. Excludes
          postage, fees and adjustments.
      - name: returned_gbp
        data_type: DOUBLE
        meta:
          additivity: additive
        description: >
          Revenue lines with a negative quantity, GBP, **signed negative**. Gross plus
          returned is net.
      - name: net_revenue_gbp
        data_type: DOUBLE
        # A quasi-identifier: on its own it is unique for 97.4% of the 5,881
        # customers, and with `first_order_gbp` and `n_orders` for 98.6%. Shares,
        # not counts — the counts move between builds, since `sum()` over doubles
        # has no fixed order. A near-continuous money column at person grain is an
        # identifier, which is why deleting `customer_id` does not anonymise an
        # extract (`docs/DATA_PROTECTION.md`).
        meta:
          additivity: additive
          pii: quasi_identifier
        description: >
          Revenue after returns, GBP: `gross_revenue_gbp + returned_gbp`. Null for the
          few customers with no product line at all.
      - name: first_order_gbp
        data_type: DOUBLE
        description: >
          Net revenue of the customer's first *invoice*, not of their first day —
          393 customers bought twice on the day they arrived, and `n_orders`
          counts invoices. Null for the 47 whose first invoice held no product
          line (a `Manual` adjustment, the test SKU); zero would read as a free
          order rather than as an unpriced one; 28 of them have a null
          `net_revenue_gbp` for the same reason.
        # Part of the same quasi-identifying set as `net_revenue_gbp`, and the
        # sharper half of it: `(country, first_order_date, first_order_gbp)` is
        # unique for about 99.5% of the 5,881 customers.
        meta:
          additivity: additive
          pii: quasi_identifier
        data_tests:
          # A first order cannot be negative: the first purchase is a sale
          # invoice, and a negative sale line is a write-off `is_revenue_line`
          # excludes. Not `first_order_gbp <= net_revenue_gbp`: for one-order
          # customers those are the same money summed in a different order, and
          # comparing two independently summed doubles is a float-equality test.
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: avg_order_value_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          `net_revenue_gbp / n_orders`: net of returns, and over invoices, not days.
          Null where net revenue is.
      - name: return_rate_pct
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          By value, not by order count. Deliberately carries no upper bound: a
          customer who returns more than they bought in the window is a real
          pattern at the extract's edges, not a bug.
      - name: is_repeat_customer
        data_type: BOOLEAN
        description: More than one sale invoice. Two invoices on the first day count.
      - name: is_left_censored_cohort
        data_type: BOOLEAN
        description: >
          True for the 955 customers whose first order is in the extract's first
          month and who may have been customers for years already.
        data_tests: [not_null]

  - name: fct_retail_returns
    config:
      contract:
        enforced: true
    description: >
      Returns matched back to the sale they reverse, one row per return line
      (18,286). The source carries no link between the two — no order reference,
      no RMA — so the join is inferred by an `asof` on the same customer's most
      recent prior purchase of the same product, and the model reports how often
      that failed: 87.7% match cleanly, 2.0% match to a smaller purchase, 8.4%
      have no prior purchase in the window and 1.9% have no customer id. Lines
      with no customer id stay, rather than flattering the rate; most misses are
      goods bought before the extract opens on 2009-12-01. The 2.0% is the rule
      being wrong rather than the data absent, and an upper bound. The median
      return comes back 10 days after purchase, the plausible shape: arbitrary
      matches would spread flat.

      **The `original_*` columns are the output of a tie-break, and this file is
      where a consumer of the release finds that out.** A customer can buy the
      same product twice in one instant, and an `asof join` given several rows
      tied on its inequality key picks among them arbitrarily — so without a
      tie-break three of these columns changed between builds with no upstream
      change at all, and this table ships as Parquet every month to people who
      cannot be paged. `int_retail_return_matches` settles it by keeping the
      lowest invoice then the lowest line number, and carries the measurements;
      what matters here is that the choice is *fixed and arbitrary*, not that
      the chosen line is the better match.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [invoice, line_number]}
      # A return cannot be matched to a sale that happened after it. The asof
      # join's inequality is what guarantees this, so the test is really on the
      # join direction — the single easiest thing to get backwards here.
      - dbt_utils.expression_is_true:
          name: fct_retail_returns_never_match_a_later_sale
          arguments:
            expression: "original_invoice_date <= invoice_date"
            config: {where: "is_matched"}
    columns:
      - name: invoice
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
        description: The cancellation invoice the return is on (prefix `C`).
        data_tests: [not_null]
      - name: line_number
        data_type: BIGINT
        meta:
          additivity: not_a_measure
        description: >
          Position within the cancellation invoice. With `invoice`, the same key as
          `fct_retail_order_line`.
        data_tests: [not_null]
      - name: customer_id
        data_type: VARCHAR
        meta:
          pii: direct_identifier
        description: >
          Pseudonymised in the release. Null where nobody signed in; those returns
          cannot be matched and carry `no customer id`.
      - name: stock_code
        data_type: VARCHAR
        description: The returned product's code.
      - name: description
        data_type: VARCHAR
        description: The label on the return line, as the source wrote it.
      - name: country
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
        description: The source's own country label on the return.
      - name: country_iso3
        description: >
          The conformed country key, carried from `stg_retail_lines` through
          `int_retail_return_matches`. Nullable for the same three labels as on
          `fct_retail_order_line`.
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
      - name: invoice_ts
        data_type: TIMESTAMP
        meta:
          pii: quasi_identifier
        description: Wall-clock shop time of the return, stored without a timezone.
      - name: invoice_date
        data_type: DATE
        description: The date of the return.
      - name: invoice_month
        data_type: VARCHAR
        description: >
          `YYYY-MM` of the return.
      - name: date_key
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          The return date as `dim_date`'s integer surrogate — the conformed key
          `fct_retail_order_line` has always carried and this model, at the
          identical `(invoice, line_number)` grain, did not. It is the return's
          own date; `original_invoice_date` is a second role on the same
          dimension and deliberately carries no key.
        data_tests: [not_null]
      - name: quantity_returned
        data_type: BIGINT
        meta:
          additivity: additive
        description: Positive. The signed amount stays signed in `return_amount_gbp`.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: unit_price
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The price per unit on the return line, GBP. Compare with
          `original_unit_price`.
      - name: return_amount_gbp
        data_type: DOUBLE
        meta:
          additivity: additive
        description: >
          The return's value, GBP, **signed negative** as the source carries it, so it
          adds straight onto sales. `quantity_returned` is positive.
      - name: original_invoice
        description: >
          The inferred purchase, not a recorded one: the source carries no link
          between a return and its order. Null on the 1,888 unmatched rows, and
          `is_matched` is the column to filter on rather than this one.
        data_type: VARCHAR
        meta:
          pii: quasi_identifier
      - name: original_line_number
        description: >
          Which line of `original_invoice`, and **the column the tie-break
          decides**. Where a customer bought the same product more than once in
          the same instant this is the lowest `(invoice, line_number)` of the
          tied group — stable between builds, arbitrary within
          the group, and not a claim that the other lines are worse candidates.
          Diffing this column against an earlier release is the one place that
          choice becomes visible, so a row that moves with no upstream change is
          the tie-break and not a restatement. `int_retail_return_matches`
          carries the rule, how many rows it decides and what it costs; this
          description deliberately does not restate those figures.
        data_type: BIGINT
        meta:
          additivity: not_a_measure
      - name: original_invoice_date
        data_type: DATE
        description: >
          The date of the inferred purchase. A second role on `dim_date`, deliberately
          without a key. Null when unmatched.
      - name: original_quantity
        data_type: BIGINT
        meta:
          additivity: semi_additive
        description: >
          The matched *purchase* line's quantity, carried onto the return. It
          belongs to the purchase and not to this row: 16,398 matched returns
          point at 15,312 distinct purchase lines, so summing it across returns
          counts 1,086 purchases more than once. Compare it per row; aggregate
          `quantity_returned` instead.
      - name: original_unit_price
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          The unit price on the inferred purchase line, GBP. Null when unmatched.
      - name: original_amount_gbp
        data_type: DOUBLE
        meta:
          additivity: semi_additive
        description: >
          The matched purchase line's amount, and the same caution as
          `original_quantity` — a purchase matched by two returns is added
          twice.
      - name: days_to_return
        data_type: BIGINT
        meta:
          additivity: additive
        description: >
          Median 10, mean 32, max 656. The shape is itself a check on the
          matching rule — an arbitrary match would spread flat over the window.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: is_matched
        data_type: BOOLEAN
        description: >
          Whether a prior purchase was found. The column to filter on, rather than
          `original_invoice`.
        data_tests: [not_null]
      - name: match_status
        data_type: VARCHAR
        description: >
          `matched`, `matched, quantity exceeds purchase`, `no prior purchase in window`
          (usually goods bought before the extract opens) or `no customer id`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - matched
                  - 'matched, quantity exceeds purchase'
                  - no prior purchase in window
                  - no customer id
      - name: quantity_is_consistent
        data_type: BOOLEAN
        description: >
          Whether `quantity_returned` is no more than the matched purchase's quantity.
          Null when unmatched.
      - name: price_differs_from_original
        data_type: BOOLEAN
        description: >
          Whether the return was credited at a different unit price from the purchase.
          Null when unmatched or when the purchase was free.

  - name: fct_retail_customer_cohorts
    config:
      contract:
        enforced: true
    description: >
      Monthly acquisition cohorts and their retention, at
      (cohort_month, months_since_first_order). Ragged on purpose: a cohort only
      has rows for months it could have been observed in, so nothing averages in
      a period that had no chance to happen. Retention is against the cohort's
      own size, never against the previous month: month-over-month figures
      compound, so a cohort that loses 20% and wins some back would read as
      recovering while still down.

      **The first cohort is left-censored.** December 2009 is the extract's
      first month, so its 955 "new" customers include long-standing ones;
      `is_left_censored_cohort` lets a chart drop them. Anonymous orders cannot
      appear: this is retention among the identified customers of
      `dim_retail_customer`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, months_since_first_order]
      # Month zero is every cohort's own definition, so it must be exactly 100%.
      # This is the structural check on the whole triangle: an off-by-one in the
      # month arithmetic, a cohort assigned from the wrong date, or a customer
      # counted in two cohorts all show up here first.
      - dbt_utils.expression_is_true:
          name: fct_retail_cohorts_month_zero_is_full_retention
          arguments:
            expression: "retention_pct = 100"
            config: {where: "months_since_first_order = 0"}
      # `retail_max_cohort_age_months` is an upper bound on generation, and
      # setting it below the extract's span truncates the oldest cohorts into
      # what reads as churn — silently, because a short curve looks like a
      # result. The first cohort must reach the last month in the table.
      - dbt_utils.expression_is_true:
          name: fct_retail_cohorts_are_not_truncated
          arguments:
            expression: >
              (select max(p.months_since_first_order) + 1
               from {{ ref('fct_retail_customer_cohorts') }} as p
               where p.cohort_month = (select min(q.cohort_month)
                                       from {{ ref('fct_retail_customer_cohorts') }} as q))
              = (select count(distinct r.activity_month)
                 from {{ ref('fct_retail_customer_cohorts') }} as r)
    columns:
      - name: cohort_month
        data_type: VARCHAR
        # Cohort grain, not person grain — a row here is hundreds of customers, so
        # the columns that identify at customer grain do not identify here.
        meta:
          pii: non_personal
        description: >
          `YYYY-MM` of the cohort's first purchase, from `dim_retail_customer`.
        data_tests: [not_null]
      - name: months_since_first_order
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        description: >
          Months from `cohort_month` to `activity_month`; 0 is the first month. Capped
          at `retail_max_cohort_age_months`, and later cohorts stop sooner, so the
          triangle is ragged.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: activity_month
        data_type: VARCHAR
        description: >
          `YYYY-MM`: `cohort_month` plus `months_since_first_order`.
      - name: cohort_size
        data_type: BIGINT
        meta:
          additivity: semi_additive
        description: >
          Customers in the cohort, constant on every `months_since_first_order`
          row of it. Summing across cohorts at one offset is a real total;
          summing down one cohort multiplies it by the number of offsets that
          cohort has rows for, which is a different number per cohort because
          the triangle is ragged.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}
      - name: active_customers
        data_type: BIGINT
        meta:
          additivity: semi_additive
        description: >
          Distinct customers of the cohort who bought in that month. Additive
          across cohorts at one offset; summing across offsets gives
          customer-months rather than customers, because a customer who returns
          in three months is counted in all three.
      - name: net_revenue_gbp
        data_type: DOUBLE
        meta:
          additivity: additive
          pii: non_personal
        description: >
          Net revenue of the cohort's customers in `activity_month`, GBP, after
          returns. Only from customers who also bought that month, so a return in a
          month with no purchase is not here, and zero when nobody bought.
      - name: retention_pct
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          `active_customers / cohort_size`, %. 100 at month 0 by construction.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: revenue_per_active_customer_gbp
        data_type: DOUBLE
        meta:
          additivity: non_additive
        description: >
          `net_revenue_gbp / active_customers`, GBP. Null when nobody was active, not
          zero.
      - name: is_left_censored_cohort
        data_type: BOOLEAN
        description: >
          True for the extract's first month, whose customers may have been buying for
          years already. Its retention curve is not a new cohort's.
      - name: is_complete_period
        data_type: BOOLEAN
        description: >
          False for each cohort's final row: the extract stops on 2011-12-09, so
          every curve's last month is nine days long. A retention chart that ends
          on a cliff is reading that, not a collapse in loyalty.
        data_tests: [not_null]
