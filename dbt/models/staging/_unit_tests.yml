version: 2

# Unit tests for `stg_retail_lines`' classification.
#
# The model assigns labels — `invoice_type`, `item_type`, `is_stock_write_off`,
# `is_revenue_line` — which is what a data test is worst at: `accepted_values`
# proves an answer is in the list, not that it is the right one, and a
# misclassification moves money between buckets without changing any total.
#
# Measured rather than argued, by mutating the model against a copy of the
# warehouse and running its 20 data tests each time:
#
#   | mutation                                    | data tests | net revenue  |
#   |---------------------------------------------|------------|--------------|
#   | drop `upper()` from `stock_code`            | 19 pass    | +GBP 1,702   |
#   | `AMAZONFEE` falls through to `product`      | 19 pass    | -GBP 260,764 |
#   | `is_revenue_line` loses its adjustment term | 19 pass    | unchanged    |
#   | `is_stock_write_off` loses `invoice_type`   | **1 fails**| unchanged    |
#
# Three of the four are invisible to the data tests. The fourth is caught only
# as a side effect of `stg_retail_write_offs_are_never_priced`. The third moves
# nothing at all — no `A` invoice has ever carried a product code — so, like
# `dim_date`'s unbuilt fiscal policies, only a unit test can reach it.
#
# `format: dict`, inline: the model is 1:1 on its input, so the fixture is the
# size of the truth table. `line_number` is in every `expect` so rows that
# classify identically stay distinguishable in the diff.

unit_tests:
  - name: stg_retail_lines_separates_returns_from_write_offs_and_bad_debt
    model: stg_retail_lines
    description: >
      The truth table the three invoice prefixes produce. A negative quantity is
      a return on a `C` invoice, a stock write-off on a plain one and neither on
      an `A` — so `is_stock_write_off` cannot be `quantity < 0`, and dropping the
      `invoice_type` term takes it from 3,457 rows to 22,950. Two rows here are
      shapes the source has never sent, and they are the ones that earn the test:
      a negative adjustment, and a product on an adjustment invoice.
    given:
      - input: source('raw', 'retail_invoice_lines')
        rows:
          # A plain sale of a product: the ordinary row, and the only one of the
          # nine that everything downstream agrees is revenue.
          - {invoice: "536365", line_number: 1, stock_code: "85123A", quantity: 6, unit_price: 2.55}
          # A genuine return. Negative quantity, real price, `C` prefix — this is
          # revenue, negatively signed, and must not be a write-off.
          - {invoice: "C536379", line_number: 1, stock_code: "85123A", quantity: -6, unit_price: 2.55}
          # A write-off: negative quantity on a *sale* invoice, zero-priced. All
          # 3,457 of these in the source are zero-priced, which is what makes the
          # reading safe; `stg_retail_write_offs_are_never_priced` guards that.
          - {invoice: "536387", line_number: 1, stock_code: "85123A", quantity: -3, unit_price: 0.0}
          # Bad debt. The six `A` lines in the source are all stock code `B`, all
          # positive quantity, all negative price — GBP -147,614 between them.
          - {invoice: "A563186", line_number: 1, stock_code: "B", quantity: 1, unit_price: -11062.06}
          # A negative adjustment. Not in the source, and the point: this is the
          # row that fails if `is_stock_write_off` loses its `invoice_type` term.
          - {invoice: "A563187", line_number: 1, stock_code: "B", quantity: -1, unit_price: 11062.06}
          # A product on an adjustment invoice — also not in the source, and the
          # only row in the project that reaches `invoice_type <> 'adjustment'`.
          - {invoice: "A563188", line_number: 1, stock_code: "85123A", quantity: 5, unit_price: 2.55}
          # C496350, the one positive-quantity cancellation line in 1.07M rows: a
          # GBP 373.57 manual adjustment. Cancellation, but not a return and not
          # revenue, because `M` is not a product.
          - {invoice: "C496350", line_number: 1, stock_code: "M", quantity: 1, unit_price: 373.57}
          # Cancelled postage. A `C` invoice does not make a line revenue.
          - {invoice: "C536391", line_number: 1, stock_code: "POST", quantity: -1, unit_price: 18.0}
          # A stock code that begins with `C`, on an invoice that does not. The
          # prefix test reads `invoice`, and this is the row that says so.
          - {invoice: "536367", line_number: 1, stock_code: "C2", quantity: 1, unit_price: 50.0}
      # These rows carry no country, so the country map is mocked empty.
      - input: ref('retail_country_map')
        rows: []
    expect:
      rows:
        - {invoice: "536365",  line_number: 1, invoice_type: sale,         item_type: product,    is_stock_write_off: false, is_revenue_line: true}
        - {invoice: "C536379", line_number: 1, invoice_type: cancellation, item_type: product,    is_stock_write_off: false, is_revenue_line: true}
        - {invoice: "536387",  line_number: 1, invoice_type: sale,         item_type: product,    is_stock_write_off: true,  is_revenue_line: false}
        - {invoice: "A563186", line_number: 1, invoice_type: adjustment,   item_type: adjustment, is_stock_write_off: false, is_revenue_line: false}
        - {invoice: "A563187", line_number: 1, invoice_type: adjustment,   item_type: adjustment, is_stock_write_off: false, is_revenue_line: false}
        - {invoice: "A563188", line_number: 1, invoice_type: adjustment,   item_type: product,    is_stock_write_off: false, is_revenue_line: false}
        - {invoice: "C496350", line_number: 1, invoice_type: cancellation, item_type: adjustment, is_stock_write_off: false, is_revenue_line: false}
        - {invoice: "C536391", line_number: 1, invoice_type: cancellation, item_type: shipping,   is_stock_write_off: false, is_revenue_line: false}
        - {invoice: "536367",  line_number: 1, invoice_type: sale,         item_type: shipping,   is_stock_write_off: false, is_revenue_line: false}

  - name: stg_retail_lines_maps_each_stock_code_family_to_its_item_type
    model: stg_retail_lines
    description: >
      Every branch of the `item_type` case, one row each, with the real codes.
      Seven of the eight families are a handful of codes that arrived in the same
      column as the mugs, and getting one wrong is worth money the tests cannot
      see — moving AMAZONFEE into `product` costs GBP 260,764 with all 20 data
      tests green. The paired-case rows are here because `upper(trim(...))` turns
      out to be load-bearing for a whole branch: every one of the 100 voucher
      lines arrives lowercase (`gift_0001_20`), so without the fold the `voucher`
      family is empty and 100% of it books as product. Lowercase `m` is 5 more
      lines against `M`'s 1,421. The padded `POST` is the same failure with no
      witness in the source yet — the workbook is read all-text, so a reader
      change is all it would take. Bare `GIFT` is the near-miss the underscore in
      `GIFT_` exists to exclude, and the source really does send one.
    given:
      - input: source('raw', 'retail_invoice_lines')
        rows:
          - {invoice: "536365", line_number: 1,  stock_code: "85123A"}
          - {invoice: "536365", line_number: 2,  stock_code: "85123a"}
          - {invoice: "536365", line_number: 3,  stock_code: "POST"}
          - {invoice: "536365", line_number: 4,  stock_code: " POST "}
          - {invoice: "536365", line_number: 5,  stock_code: "DOT"}
          - {invoice: "536365", line_number: 6,  stock_code: "C2"}
          - {invoice: "536365", line_number: 7,  stock_code: "AMAZONFEE"}
          - {invoice: "536365", line_number: 8,  stock_code: "BANK CHARGES"}
          - {invoice: "536365", line_number: 9,  stock_code: "CRUK"}
          - {invoice: "536365", line_number: 10, stock_code: "D"}
          - {invoice: "536365", line_number: 11, stock_code: "S"}
          - {invoice: "536365", line_number: 12, stock_code: "M"}
          - {invoice: "536365", line_number: 13, stock_code: "m"}
          - {invoice: "536365", line_number: 14, stock_code: "B"}
          - {invoice: "536365", line_number: 15, stock_code: "ADJUST"}
          - {invoice: "536365", line_number: 16, stock_code: "GIFT_0001_20"}
          - {invoice: "536365", line_number: 17, stock_code: "gift_0001_20"}
          - {invoice: "536365", line_number: 18, stock_code: "GIFT"}
          - {invoice: "536365", line_number: 19, stock_code: "TEST001"}
      # These rows carry no country, so the country map is mocked empty.
      - input: ref('retail_country_map')
        rows: []
    expect:
      rows:
        - {line_number: 1,  stock_code: "85123A",       item_type: product}
        - {line_number: 2,  stock_code: "85123A",       item_type: product}
        - {line_number: 3,  stock_code: "POST",         item_type: shipping}
        - {line_number: 4,  stock_code: "POST",         item_type: shipping}
        - {line_number: 5,  stock_code: "DOT",          item_type: shipping}
        - {line_number: 6,  stock_code: "C2",           item_type: shipping}
        - {line_number: 7,  stock_code: "AMAZONFEE",    item_type: fee}
        - {line_number: 8,  stock_code: "BANK CHARGES", item_type: fee}
        - {line_number: 9,  stock_code: "CRUK",         item_type: fee}
        - {line_number: 10, stock_code: "D",            item_type: discount}
        - {line_number: 11, stock_code: "S",            item_type: sample}
        - {line_number: 12, stock_code: "M",            item_type: adjustment}
        - {line_number: 13, stock_code: "M",            item_type: adjustment}
        - {line_number: 14, stock_code: "B",            item_type: adjustment}
        - {line_number: 15, stock_code: "ADJUST",       item_type: adjustment}
        - {line_number: 16, stock_code: "GIFT_0001_20", item_type: voucher}
        - {line_number: 17, stock_code: "GIFT_0001_20", item_type: voucher}
        - {line_number: 18, stock_code: "GIFT",         item_type: product}
        - {line_number: 19, stock_code: "TEST001",      item_type: test}

  - name: stg_retail_lines_nulls_the_absent_customer_rather_than_blanking_it
    model: stg_retail_lines
    description: >
      `customer_id` is the warehouse's one direct identifier and 243,007 lines
      (22.8%) do not have one. The `nullif(trim(...), '')` is what makes that an
      absence rather than an empty-string customer who bought 22.8% of the shop —
      and `customer_id` is deliberately untested for nullity in `_staging.yml`,
      so no data test on this model can see it either way. It is defensive today:
      the workbook read returns NULL for an empty cell, so the source currently
      holds no blank string at all. It is one cast away from holding one, which
      is why the shape is pinned here rather than left to the reader.

      **All three text columns the model trims are here, and they did not always
      agree.** `country` was `trim(country)` with no `nullif` until 2026-09-05,
      so a blank country would have become a 44th label rather than an absence —
      unreachable in today's 1,067,371 rows, which is precisely the condition
      under which this project writes the fixture instead of arguing about the
      clause.
    given:
      - input: source('raw', 'retail_invoice_lines')
        rows:
          - {invoice: "536365", line_number: 1, customer_id: "17850",   description: "WHITE HANGING HEART",     country: "United Kingdom"}
          - {invoice: "536365", line_number: 2, customer_id: "",        description: "WHITE HANGING HEART",     country: "United Kingdom"}
          - {invoice: "536365", line_number: 3, customer_id: "   ",     description: "WHITE HANGING HEART",     country: "United Kingdom"}
          - {invoice: "536365", line_number: 4, customer_id: null,      description: "WHITE HANGING HEART",     country: "United Kingdom"}
          - {invoice: "536365", line_number: 5, customer_id: " 17850 ", description: "  WHITE HANGING HEART  ", country: "  United Kingdom  "}
          - {invoice: "536365", line_number: 6, customer_id: "17850",   description: "",                        country: "United Kingdom"}
          - {invoice: "536365", line_number: 7, customer_id: "17850",   description: "   ",                     country: "United Kingdom"}
          # `country` gets the same `nullif(trim(...), '')` as its neighbours;
          # without it a blank survives as `''` and joins to the seed as a
          # country of its own. Rows 8 and 9 separate the two treatments; the
          # source has sent neither.
          - {invoice: "536365", line_number: 8, customer_id: "17850",   description: "WHITE HANGING HEART",     country: ""}
          - {invoice: "536365", line_number: 9, customer_id: "17850",   description: "WHITE HANGING HEART",     country: "   "}
      # Every row here is the same country, so one mapping row is the whole
      # map. It is not decoration: line 5's label arrives padded, and the join
      # is on the *trimmed* value, so a resolution moved above the trim would
      # give that one row a null code and the other six GBR.
      - input: ref('retail_country_map')
        rows:
          - {retail_country: "United Kingdom", country_iso3: "GBR", mapping_basis: "name_match"}
    expect:
      rows:
        - {line_number: 1, customer_id: "17850", description: "WHITE HANGING HEART", country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 2, customer_id: null,    description: "WHITE HANGING HEART", country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 3, customer_id: null,    description: "WHITE HANGING HEART", country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 4, customer_id: null,    description: "WHITE HANGING HEART", country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 5, customer_id: "17850", description: "WHITE HANGING HEART", country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 6, customer_id: "17850", description: null,                  country: "United Kingdom", country_iso3: "GBR"}
        - {line_number: 7, customer_id: "17850", description: null,                  country: "United Kingdom", country_iso3: "GBR"}
        # Null, not `''`: an empty string would be a 44th "country" resolving to
        # no code, which the `relationships` test in `_staging.yml` ignores.
        - {line_number: 8, customer_id: "17850", description: "WHITE HANGING HEART", country: null,             country_iso3: null}
        - {line_number: 9, customer_id: "17850", description: "WHITE HANGING HEART", country: null,             country_iso3: null}

  - name: stg_retail_lines_keeps_a_line_whose_country_the_map_has_never_seen
    model: stg_retail_lines
    description: >
      The resolution is a left join, and the reason is not tidiness: an inner
      join deletes the rows it cannot resolve *and then the test that exists to
      catch them passes*, because the evidence is what it deleted.
      `_staging.yml` asserts `relationships` from `country` to the seed, and
      that test reads the built model — so a label missing from the seed only
      shows up there if the model still carries the row.

      Measured, by deleting `EIRE` from the seed and making the join inner
      against a copy of the warehouse: **17,866 order lines and GBP 615,520
      disappear, four customers with them, and all 90 nodes pass** — the
      relationships test included. The grain contract still holds on what is
      left, every `not_null` holds on rows that are no longer there, and
      `dbt_utils.equal_rowcount` compares this model to
      `fct_retail_order_line`, which is downstream and shrinks by exactly the
      same 17,866. Two things that fall together cannot measure each other.

      So the fourth row here is the test. `Poland` is deliberately absent from
      the mocked map — the shape of a country appearing in a re-ingest — and it
      has to survive with a null code, which is what leaves the relationships
      test something to fail on. `Unspecified` is the contrast: it *is* in the
      map and resolves to nothing, so an inner join keeps it, and a fixture
      built only from that row would pass a model that silently drops the other
      kind.

      Two of the other three unit tests on this model also go red on that
      mutation, and neither is a guard: their country map is mocked empty, so
      an inner join deletes their whole fixture. Give either of them a mapping
      row one day and they stop noticing. This one fails on the row that
      matters.
    given:
      - input: source('raw', 'retail_invoice_lines')
        rows:
          # Mapped, and the ordinary case.
          - {invoice: "536365", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "Germany"}
          # In the map, resolving to nothing on purpose. An inner join keeps it.
          - {invoice: "536367", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "Unspecified"}
          # Not in the map at all. An inner join eats this one, and the seed
          # test that should have named it goes green.
          - {invoice: "536368", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "Poland"}
      - input: ref('retail_country_map')
        rows:
          - {retail_country: "Germany",     country_iso3: "DEU", mapping_basis: "name_match"}
          - {retail_country: "Unspecified", country_iso3: null,  mapping_basis: "not_a_country"}
    expect:
      rows:
        - {invoice: "536365", country: "Germany",     country_iso3: "DEU"}
        - {invoice: "536367", country: "Unspecified", country_iso3: null}
        - {invoice: "536368", country: "Poland",      country_iso3: null}

  - name: stg_retail_lines_dates_a_line_by_the_till_time_it_carries
    model: stg_retail_lines
    description: >
      `invoice_date` is `cast(invoice_ts as date)` and was untested: the string
      `invoice_ts` appeared nowhere in this file. Its `not_null` cannot see a
      wrong date, only a missing one, and the column feeds `invoice_month` in
      every downstream grain — `fct_retail_customer_cohorts`, the RFM recency
      window, `days_to_return`.

      **The two are derived in different layers from the same timestamp, and
      nothing compares them.** `invoice_month` is computed at ingest, in the
      DuckDB query that reads the workbook (`strftime(invoice_ts, '%Y-%m')` in
      `ingest/sources/retail.py`); `invoice_date` is computed here. They agree on
      all 1,067,371 rows today, and no test says they must — so this fixture
      states the relation once, on the rows where it is least obvious.

      Those rows are the last minutes of a day and of a year, and the source has
      sent neither: the tills open at 06:10 and the latest stamp in the workbook
      is **21:52**, so nothing in the real data is within two hours of a date
      boundary. That is worth knowing before trusting the hazard
      `RETAIL_COLUMNS` describes to be visible — dlt's default `timestamp` maps
      to TIMESTAMP WITH TIME ZONE and renders a naive 07:45 as 08:45+01:00 on a
      CET machine, and at that offset **not one of the 1,067,371 rows changes
      date**. Push the same drift to six hours, the offset of a machine east of
      here, and it is not subtle any more and still not visible: **28,286 order
      lines move to a different `invoice_date`, 521 of them onto a date whose
      month contradicts the `invoice_month` the ingest layer computed, and the
      build finishes PASS=83 ERROR=0** across `stg_retail_lines` and everything
      downstream of it. Measured against a warehouse copy. Rows 1 and 2 here are
      red at either offset.
    given:
      - input: source('raw', 'retail_invoice_lines')
        rows:
          # Fifteen minutes before midnight, on the last day of a month. A cast
          # that rounds up, or an hour of drift, puts this in February and makes
          # it disagree with the `invoice_month` the ingest layer computed.
          - {invoice: "536365", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "United Kingdom", invoice_ts: "2024-01-31 23:45:00", invoice_month: "2024-01"}
          # One minute before midnight on New Year's Eve: the same trap across a
          # year boundary, where a wrong date is also a wrong year.
          - {invoice: "536366", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "United Kingdom", invoice_ts: "2023-12-31 23:59:00", invoice_month: "2023-12"}
          # Midnight exactly — the boundary itself, which belongs to the new day.
          - {invoice: "536367", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "United Kingdom", invoice_ts: "2024-02-01 00:00:00", invoice_month: "2024-02"}
          # An ordinary trading hour, so the fixture cannot pass by treating
          # every row as an edge case.
          - {invoice: "536368", line_number: 1, stock_code: "85123A", quantity: 1, unit_price: 2.55, country: "United Kingdom", invoice_ts: "2024-01-15 12:30:00", invoice_month: "2024-01"}
      - input: ref('retail_country_map')
        rows:
          - {retail_country: "United Kingdom", country_iso3: "GBR", mapping_basis: "name_match"}
    expect:
      rows:
        - {invoice: "536365", invoice_date: "2024-01-31", invoice_month: "2024-01"}
        - {invoice: "536366", invoice_date: "2023-12-31", invoice_month: "2023-12"}
        - {invoice: "536367", invoice_date: "2024-02-01", invoice_month: "2024-02"}
        - {invoice: "536368", invoice_date: "2024-01-15", invoice_month: "2024-01"}

  - name: stg_weather_daily_nulls_a_degree_day_it_cannot_compute
    model: stg_weather_daily
    description: >
      A day whose temperature the archive has not published yet must produce a
      null degree day, not a zero. `greatest()` ignores nulls in DuckDB, so the
      clamp has to be a `case` — and the failure mode of getting it wrong is a
      silent under-count of heating demand that every data test on both models
      accepts.
    given:
      - input: source('raw', 'om_weather_daily')
        rows:
          # A complete day: 15.5 - 3.5 = 12.0 heating, no cooling.
          - {country_iso3: "DEU", weather_date: "2024-01-01", temperature_2m_mean: 3.5, temperature_2m_max: 5.5, temperature_2m_min: 1.5, grid_latitude: 52.5, grid_longitude: 13.4, elevation_m: 38.0}
          # The mean is missing, the extremes are not. Only the mean-based pair
          # goes null; the (max + min)/2 convention is still computable.
          - {country_iso3: "DEU", weather_date: "2024-01-02", temperature_2m_mean: null, temperature_2m_max: 5.5, temperature_2m_min: 1.5, grid_latitude: 52.5, grid_longitude: 13.4, elevation_m: 38.0}
          # And the mirror image: one extreme missing nulls only the convention
          # that reads it.
          - {country_iso3: "DEU", weather_date: "2024-01-03", temperature_2m_mean: 25.0, temperature_2m_max: null, temperature_2m_min: 20.0, grid_latitude: 52.5, grid_longitude: 13.4, elevation_m: 38.0}
      - input: ref('stg_country')
        rows:
          - {country_iso3: "DEU", latitude: 52.5235, longitude: 13.4115}
    expect:
      rows:
        - {weather_date: "2024-01-01", hdd_c: 12.0,  hdd_minmax_c: 12.0, cdd_c: 0.0}
        - {weather_date: "2024-01-02", hdd_c: null,  hdd_minmax_c: 12.0, cdd_c: null}
        - {weather_date: "2024-01-03", hdd_c: 0.0,   hdd_minmax_c: null, cdd_c: 3.0}
