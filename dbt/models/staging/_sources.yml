version: 2

sources:
  - name: raw
    description: >
      Landing tables loaded by the dlt pipeline, in the DuckLake catalog under
      data/lakehouse/ — not in the DuckDB file. `database: lakehouse` is the
      ATTACH alias from profiles.yml and from `lake.lakehouse.ATTACH_ALIAS`;
      the three have to agree or dbt cannot resolve a single source.
    database: lakehouse
    schema: raw
    # Freshness measures when the pipeline last loaded (dlt's `_dlt_load_id`, a
    # unix epoch as a string), not when the publisher last updated: it catches a
    # stopped schedule or a failing source. Generous thresholds, because most
    # sources publish annually.
    loaded_at_field: "to_timestamp(cast(_dlt_load_id as double))"
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 30, period: day}
    tables:
      - name: owid_co2
      - name: owid_energy
      - name: wb_country
      - name: wb_wdi
      - name: eu_elec_prices
      - name: ecb_fx_rates
        description: >
          ECB daily euro foreign-exchange reference rates via Frankfurter, at
          (rate_date, quote_currency). The only source here with a sub-annual
          grain, and the only one that publishes on business days — so ~30% of
          calendar days carry no row at all, by design rather than by omission.
        # Overridden because this one *does* publish daily. The project-wide
        # 7/30-day thresholds are calibrated for annual releases and would let
        # this source stop for a month without a word.
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
      - name: om_weather_daily
        description: >
          Open-Meteo ERA5 daily weather at each EU/EEA capital city, at
          (country_iso3, weather_date). The only source joined on a *coordinate*
          rather than a code: the capital latitude/longitude the World Bank
          already publishes, which nothing in the warehouse read until this
          landed. Six daily variables, kept under the API's own names.

          Two things about it are unlike every other source here. It is
          **budget-limited** — the free tier allows 10,000 weighted calls a day
          and the full 2007- seed costs more than one day holds — so the rows
          are carried forward from the previous release rather than refetched,
          making this the only landing table a rebuild does not reproduce. And
          the recent tail is **preliminary**: Open-Meteo serves ERA5T within a
          day or two of real time and Copernicus supersedes it with final ERA5
          two to three months later, which is what the 90-day merge lookback is
          sized for.
        # Daily, like the FX rates, so the annual thresholds would let it stop
        # for a month unnoticed. Looser than FX's 2/7 because there is no
        # business-day calendar here — every day exists — but the load is paced
        # and a long backfill can legitimately hold the watermark still for
        # hours.
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 10, period: day}

      - name: retail_invoice_lines
        description: >
          UCI Online Retail II — a UK online gift retailer's order lines,
          2009-12-01 to 2011-12-09, at (invoice, line_number). The only source
          here below country grain and the only one that is a bulk file drop
          rather than an API: one 45 MB workbook, republished when the curator
          revises it. Landed exactly as sent, prefixes and blanks and negative
          quantities included — `stg_retail_lines` is where that becomes a
          taxonomy.
        # Freshness off: a closed archive (the study ended in 2011) would be
        # permanently red, and a permanently red check trains people to ignore it.
        freshness: null
        # The only source carrying anything personal. Classified at the landing
        # table, where the identifier enters; the export expands the declared
        # columns by name to every copy downstream.
        #
        # A `direct_identifier` singles out a person alone and is rewritten at
        # the publication boundary. A `quasi_identifier` does so only in
        # combination and is published unchanged, since generalising it would
        # destroy the analysis; naming it is what makes "we removed the id" a
        # measurable claim (`docs/DATA_PROTECTION.md` has the measurement).
        columns:
          - name: customer_id
            description: >
              The publisher's own pseudonym for a shopper — no name, no address,
              nothing to contact them with. Still personal data: pseudonymised
              data is, explicitly (GDPR Recital 26), and the label says so rather
              than treating "it's just a number" as the end of the question.
            meta:
              pii: direct_identifier
          - name: country
            meta:
              pii: quasi_identifier
          - name: invoice_ts
            description: >
              When the till rang, to the minute. A quasi-identifier rather than a
              bystander: anyone holding one receipt can find the line it came
              from, and from there the rest of that customer's orders.
            meta:
              pii: quasi_identifier
