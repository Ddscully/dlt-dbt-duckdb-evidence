version: 2

sources:
  - name: raw
    description: Landing tables loaded by the dlt pipeline.
    schema: raw
    # Freshness here measures when *we* last loaded, not when the upstream
    # publisher last updated: dlt stamps every row with `_dlt_load_id`, a unix
    # epoch as a string. So `dbt source freshness` answers "has the pipeline
    # run recently", which is the failure this catches — a stopped schedule or a
    # source that has been erroring long enough for the dashboard to go stale.
    # The sources themselves publish annually, hence the generous thresholds.
    loaded_at_field: "to_timestamp(cast(_dlt_load_id as double))"
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 30, period: day}
    tables:
      - name: owid_co2
      - name: owid_energy
      - name: wb_country
      - name: wb_wdi
      - name: eu_elec_prices
      - name: ecb_fx_rates
        description: >
          ECB daily euro foreign-exchange reference rates via Frankfurter, at
          (rate_date, quote_currency). The only source here with a sub-annual
          grain, and the only one that publishes on business days — so ~30% of
          calendar days carry no row at all, by design rather than by omission.
        # Overridden because this one *does* publish daily. The project-wide
        # 7/30-day thresholds are calibrated for annual releases and would let
        # this source stop for a month without a word.
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
      - name: retail_invoice_lines
        description: >
          UCI Online Retail II — a UK online gift retailer's order lines,
          2009-12-01 to 2011-12-09, at (invoice, line_number). The only source
          here below country grain and the only one that is a bulk file drop
          rather than an API: one 45 MB workbook, republished when the curator
          revises it. Landed exactly as sent, prefixes and blanks and negative
          quantities included — `stg_retail_lines` is where that becomes a
          taxonomy.
        # Freshness is switched off rather than loosened. The study period closed
        # in December 2011 and the file has not moved since 2023, so *every*
        # threshold would be permanently red and would train the eye to ignore
        # the check that matters. A stale-data alarm on a closed archive is
        # noise, not diligence.
        freshness: null
        # The only source here carrying anything personal, and the classification
        # starts at the landing table rather than at staging on purpose: `raw`
        # ships inside the published DuckDB file, so a policy that begins one
        # layer down has already let the clear value into the artifact.
        #
        # Two labels, and the difference between them is what gets done about
        # them. A `direct_identifier` singles out a person on its own and is
        # rewritten at the publication boundary. A `quasi_identifier` only does so
        # in combination — and is published unchanged, because generalising it
        # would destroy the analysis it exists for. Naming it is the point: it is
        # what makes "we removed the id" a measurable claim rather than a
        # comforting one. `docs/DATA_PROTECTION.md` carries the measurement.
        columns:
          - name: customer_id
            description: >
              The publisher's own pseudonym for a shopper — no name, no address,
              nothing to contact them with. Still personal data: pseudonymised
              data is, explicitly (GDPR Recital 26), and the label says so rather
              than treating "it's just a number" as the end of the question.
            meta:
              pii: direct_identifier
          - name: country
            meta:
              pii: quasi_identifier
          - name: invoice_ts
            description: >
              When the till rang, to the minute. A quasi-identifier rather than a
              bystander: anyone holding one receipt can find the line it came
              from, and from there the rest of that customer's orders.
            meta:
              pii: quasi_identifier
