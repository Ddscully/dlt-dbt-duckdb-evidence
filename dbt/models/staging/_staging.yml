version: 2

models:
  # Every fact-shaped staging model is one row per (country_iso3, year). That
  # grain is what the mart's four left joins assume, so it is asserted here
  # rather than left as a comment: a duplicate upstream row would otherwise
  # fan out `fct_emissions_energy` silently.
  #
  # Test args go under `arguments:` — the flat form is deprecated in dbt 1.10
  # and removed in Fusion.
  - name: stg_co2
    description: >
      OWID CO2, one row per (country_iso3, year). Aggregate rows ("World",
      "Europe", income groupings) are dropped by the 3-letter ISO filter.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(country_iso3) = 3"
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: co2_mt
        description: Territorial CO2 emissions, million tonnes.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: co2_per_capita
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_global_co2
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: coal_co2
        description: CO2 from coal, million tonnes. Sums with oil/gas/cement/flaring to `co2_mt`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: oil_co2
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: gas_co2
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: consumption_co2
        description: >
          Consumption-based CO2: territorial emissions plus the carbon embodied
          in imports, minus that embodied in exports. **Nullable on purpose** —
          OWID publishes it for ~120 countries and one year behind `co2_mt`, so
          most country-years legitimately have a number here and not there.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: consumption_co2_per_capita
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: trade_co2
        description: >
          `consumption_co2 - co2_mt`, million tonnes. **Signed on purpose**:
          positive means the country is a net importer of embodied carbon
          (the UK, France), negative a net exporter (China, Russia). No
          `min_value` for that reason.
      - name: trade_co2_share
        description: >
          `trade_co2` as a percent of territorial emissions. Range is roughly
          -98% to +1023% in the full data — Singapore imports ten times what it
          emits — so this is deliberately untested rather than bounded to
          0-100. A bound here would fail on reality, not on a bug.
      - name: cumulative_co2
        description: Every tonne emitted since 1750, million tonnes. The stock behind the flow.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: share_global_cumulative_co2
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}

  - name: stg_energy
    description: OWID energy, one row per (country_iso3, year).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(country_iso3) = 3"
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1750, max_value: 2030}
      - name: primary_energy_twh
        description: >
          Primary energy consumption, TWh. Covers ~210 countries through 2023
          and only ~79 from 2024 on — anything filtered to the mart's latest
          year loses two thirds of its sample here. The `*_elec` columns below
          do not have that cliff.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: renewables_share_pct
        description: >
          Renewables as a share of primary energy, percent. **Only 79
          countries** in any year — OWID's broad-coverage series is the
          electricity mix, not the primary-energy mix. Prefer
          `low_carbon_share_elec_pct` when country coverage matters.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: fossil_share_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: electricity_generation_twh
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: carbon_intensity_elec_g_kwh
        description: >
          Grams of CO2 per kWh of electricity generated. ~210 countries, so
          roughly three times the coverage of `renewables_share_pct`, and in a
          unit that reads directly. Ceiling is generous: the observed maximum is
          ~1307 (coal-only grids), so 2000 catches a unit error without failing
          on a real grid.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 2000}
      - name: low_carbon_share_elec_pct
        description: Renewables plus nuclear as a share of electricity generated, percent.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: solar_share_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: wind_share_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: nuclear_share_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: coal_share_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: gas_share_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: source_loaded_at
        description: >
          When dlt landed the row, from `_dlt_load_id` — the same field
          `dbt source freshness` reads, carried into the model so
          `dim_grid_emission_factors` can publish the vintage of the extract
          alongside the factor. One value per load, since this resource loads
          with `replace`.
        data_tests: [not_null]

  - name: stg_wdi
    description: >
      World Bank WDI pivoted from long (one row per indicator/country/year) to
      one row per (country_iso3, year) with a column per indicator. Adding an
      indicator means editing `WB_WDI_INDICATORS` in `ingest/pipeline.py`, the
      `max(case ...)` list here, and re-recording the fixtures.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(country_iso3) = 3"
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        # WDI starts in 1960; anything earlier means the pivot has picked up a
        # dimension that isn't the year.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1960, max_value: 2030}
      - name: gdp_constant_usd
        description: >
          GDP in constant 2015 US$ (NY.GDP.MKTP.KD). The real-terms denominator
          for anything measured over time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: gdp_usd
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: life_expectancy
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: population
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: poverty_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: internet_users_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: urban_pop_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: forest_area_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: renew_elec_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}

  - name: stg_eu_electricity_prices_semiannual
    description: >
      Eurostat household electricity prices at their published grain: one row per
      (country_iso3, year, half). EU/EEA only. This is the cleaning model — the
      geo -> ISO3 mapping happens here and `stg_eu_electricity_prices` averages
      it to the annual grain the rest of the warehouse uses.

      Kept alongside the annual model because the average hides real movement:
      the mean absolute half-over-half change ran 3-4% through the 2010s, 19% in
      2022 and 13% in 2023, and the largest single move is +320% (the Netherlands
      out of a rebate-suppressed 2022-S1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year, half]
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          # The series starts in 2007; nothing earlier should survive the
          # JSON-stat grid walk.
          - dbt_utils.accepted_range:
              arguments: {min_value: 2007, max_value: 2030}
      - name: half
        description: >
          Which half of the year, from Eurostat's period code — 'S1' is
          January-June, 'S2' July-December. Only ever those two; a third value
          would mean the period string has changed shape.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['S1', 'S2']}
      - name: period
        description: Eurostat's own period label, e.g. '2022-S1'. Sorts correctly as a string.
        data_tests: [not_null]
      - name: period_start_date
        description: >
          First day of the half-year (1 January or 1 July). Exists so a chart can
          use a real time axis rather than sorting period strings.
        data_tests: [not_null]
      - name: electricity_price_eur_kwh
        description: >
          EUR per kWh including all taxes, medium consumption band DC. The whole
          series sits under 0.60; a value above 1 would mean the JSON-stat index
          walk has drifted onto another unit or currency. The floor is 0 and not
          higher on purpose — the Dutch 2022-S1 figure really is 0.034.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}

  - name: stg_eu_electricity_prices
    description: >
      Eurostat household electricity prices averaged from semi-annual to annual,
      one row per (country_iso3, year). EU/EEA only. Derived from
      `stg_eu_electricity_prices_semiannual`, which holds the source grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, year]
    columns:
      - name: country_iso3
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 2007, max_value: 2030}
      - name: electricity_price_eur_kwh
        description: >
          EUR per kWh including all taxes, medium consumption band DC, averaged
          over the year's half-years. Check `n_half_years` before comparing the
          newest year to an older one.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: false}
      - name: n_half_years
        description: >
          How many half-years the average is over. 2 for a complete year, 1 for
          the newest year between Eurostat's S1 and S2 releases — in which case
          this "annual" price is a half-year figure. Never anything else: the
          grain test on the semi-annual model and the `accepted_values` on `half`
          are what make that true.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 2}

  - name: stg_fx_rates
    description: >
      ECB daily euro reference rates, one row per (rate_date, quote_currency).
      The only staging model that is not country-year keyed, and the only one
      with a sub-annual grain — the grain contract below is the same kind of
      assertion, just over different columns.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, quote_currency]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(quote_currency) = 3"
      # A rate quoted against anything but the euro would mean the request lost
      # its `base` parameter, and every converted figure downstream would be
      # wrong by whatever the new base happened to be.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "base_currency = 'EUR'"
    columns:
      - name: rate_date
        description: The ECB publication date. Business days only — see the mart.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: "'1999-01-04'", max_value: "current_date"}
      - name: quote_currency
        data_tests: [not_null]
      - name: units_per_eur
        description: >
          Units of the quote currency per 1 EUR, as the ECB quotes it. Untested
          for an upper bound on purpose: the range spans 0.85 (GBP) to 1,725,000
          (the pre-2005 Turkish lira), so any ceiling that would catch a real bug
          would also fail on the pre-redenomination series.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: eur_per_unit
        description: The reciprocal, shipped so nobody has to invert it themselves.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}

  - name: stg_country
    description: >
      Country dimension, one row per country_iso3: World Bank `/country` plus
      the `country_overrides` seed for the ISO3 codes it omits.
    columns:
      - name: country_iso3
        data_tests: [not_null, unique]
      - name: country_iso2
        data_tests: [not_null, unique]
      - name: country_name
        data_tests: [not_null]
      - name: region
        description: >
          Trimmed World Bank region. Never null here; the mart has one null
          region (Antarctica), which arrives from OWID and has no dimension row.
        data_tests: [not_null]
      - name: income_group
        description: >
          Null for the `country_overrides` territories the World Bank does not
          classify, so this is deliberately not tested for nullity.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - High income
                  - Upper middle income
                  - Lower middle income
                  - Low income
      - name: latitude
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -90, max_value: 90}
      - name: longitude
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -180, max_value: 180}
