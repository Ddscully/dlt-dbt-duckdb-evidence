# One `unit_tests:` key in this file, and it stays that way. dbt *merges* a
# second block rather than letting the last win, warning
# `DuplicateYAMLKeysDeprecation` — nothing red, nothing missing, and gone in
# Fusion.
#
# Six tests of rules that have a model of their own, so each mocks only the
# inputs its rule reads. `..._never_point_at_a_stock_write_off` covers a filter
# no data can reach.
unit_tests:
  # --- int_cbam_default_factors ---------------------------------------------
  #
  # Each mocks the seed the fallback rule reads and asserts the columns it
  # decides.

  - name: cbam_defaults_take_the_fallback_row_whole_or_not_at_all
    model: int_cbam_default_factors
    description: >
      The fallback is a row-level rule, not a column-level one. Where a listed
      country has no total for a good, the regulation sends the whole line to the
      "Other countries and territories" table — so direct, indirect and total
      must all come from that one row. Picking each column from whichever source
      happens to hold it produces a line that exists nowhere in the regulation,
      which is what a per-column `coalesce` once did to Chile's line pipe. That
      row was corrected out of the annex in July 2026 and **no row in the current
      source can reach this branch**: zero of the 12,540 seed rows have a null
      total beside a non-null direct or indirect. Chile is posed here for that
      reason. `production_route_code` follows the rule too, and the fixture is
      built to prove it rather than to record it: Chile carries a route of its
      own ("B") and the fallback carries a different one ("F"), so the only way
      to expect "F" is to read the route off the row the tonnages came from. It
      did not follow the rule until 2026-08-24 — 202 warehouse rows showed a
      blank route beside a tonnage whose fallback row had one.
    given:
      - input: ref('cbam_default_values')
        rows:
          # The annex's catch-all. Its own `country_iso3` is null, which is what
          # makes it the fallback, and it is `is_country_specific` because the
          # number on it is its own.
          - {country_or_territory: "Other countries and territories", country_iso3: null,  good_key: "7601-unwrought-aluminium", default_direct_t_co2e_per_t: 3.0, default_indirect_t_co2e_per_t: 7.0, default_total_t_co2e_per_t: 10.0, production_route_code: "F"}
          # A listed country with a value of its own: keeps all three columns.
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "7601-unwrought-aluminium", default_direct_t_co2e_per_t: 1.5, default_indirect_t_co2e_per_t: 3.5, default_total_t_co2e_per_t: 5.0, production_route_code: "A"}
          # The trap. Direct and indirect published, total absent, route
          # present *and different from the fallback's*. Under the rule this
          # line is the fallback's 3.0 / 7.0 / 10.0 on route F — never its own
          # 4.0 / 6.0 with someone else's total, and never route B.
          - {country_or_territory: "Chile", country_iso3: "CHL", good_key: "7601-unwrought-aluminium", default_direct_t_co2e_per_t: 4.0, default_indirect_t_co2e_per_t: 6.0, default_total_t_co2e_per_t: null, production_route_code: "B"}
    expect:
      rows:
        - {country_or_territory: "Other countries and territories", is_fallback_table: true,  is_country_specific: true,  production_route_code: "F", direct_t_co2e_per_t: 3.0, indirect_t_co2e_per_t: 7.0, total_t_co2e_per_t: 10.0}
        - {country_or_territory: "Norway", is_fallback_table: false, is_country_specific: true,  production_route_code: "A", direct_t_co2e_per_t: 1.5, indirect_t_co2e_per_t: 3.5, total_t_co2e_per_t: 5.0}
        - {country_or_territory: "Chile",  is_fallback_table: false, is_country_specific: false, production_route_code: "F", direct_t_co2e_per_t: 3.0, indirect_t_co2e_per_t: 7.0, total_t_co2e_per_t: 10.0}

  - name: cbam_defaults_drop_the_headings_that_no_country_prices
    model: int_cbam_default_factors
    description: >
      23 of the annex's 283 goods carry a description and no value anywhere, not
      even in the fallback table: they are 4-digit CN headings printed above the
      subheadings that hold the numbers, and two of them say "see below" where a
      value would go. They belong in the seed, which is a transcription, and not
      in a table of carbon intensities, where they could only ever be null. The
      filter is `having count(<total>) > 0` and the `count` is over the column
      rather than `count(*)` — the distinction is the entire test, because a
      heading has plenty of rows and no values. Asserted on which rows exist
      rather than on any number, since a heading's whole failure mode is being
      present.
    given:
      - input: ref('cbam_default_values')
        rows:
          # CN heading 3102: rows in every country, a value in none of them.
          - {country_or_territory: "Other countries and territories", country_iso3: null,  good_key: "3102-mineral-or-chemical-fertilisers-nitrogenous", default_direct_t_co2e_per_t: null, default_indirect_t_co2e_per_t: null, default_total_t_co2e_per_t: null, production_route_code: null}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "3102-mineral-or-chemical-fertilisers-nitrogenous", default_direct_t_co2e_per_t: null, default_indirect_t_co2e_per_t: null, default_total_t_co2e_per_t: null, production_route_code: null}
          # The subheading beneath it, which is where the numbers actually are.
          - {country_or_territory: "Other countries and territories", country_iso3: null,  good_key: "3102100000-urea", default_direct_t_co2e_per_t: 40.0, default_indirect_t_co2e_per_t: 10.0, default_total_t_co2e_per_t: 50.0, production_route_code: null}
          - {country_or_territory: "Norway", country_iso3: "NOR", good_key: "3102100000-urea", default_direct_t_co2e_per_t: 40.0, default_indirect_t_co2e_per_t: 10.0, default_total_t_co2e_per_t: 50.0, production_route_code: "A"}
    expect:
      rows:
        - {country_or_territory: "Other countries and territories", good_key: "3102100000-urea", total_t_co2e_per_t: 50.0}
        - {country_or_territory: "Norway", good_key: "3102100000-urea", total_t_co2e_per_t: 50.0}

  # --- int_retail_return_matches --------------------------------------------
  #
  # These assert the `asof join`'s own output. The third holds the only checks on
  # the `>=` boundary and the non-product filter, which the mart's tests cannot
  # reach because they mock this model.

  - name: return_matches_take_the_latest_purchase_before_the_return_and_no_other
    model: int_retail_return_matches
    description: >
      The asof join is "most recent prior", and all three words carry weight.
      Three purchases of the same product by the same customer: an earlier one,
      the one that should win, and one *after* the return that must never be
      reachable. `original_quantity` is the tell — 10 would mean the join took
      the first, 99 would mean it looked forward.
    given:
      - input: ref('stg_retail_lines')
        rows:
          - {invoice: "500", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 10, unit_price: 2.0, line_amount_gbp: 20.0, invoice_ts: "2024-01-01 09:00:00", invoice_date: "2024-01-01"}
          - {invoice: "501", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 5,  unit_price: 2.0, line_amount_gbp: 10.0, invoice_ts: "2024-01-05 09:00:00", invoice_date: "2024-01-05"}
          # After the return. Reachable only by a join that looks forward.
          - {invoice: "502", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 99, unit_price: 2.0, line_amount_gbp: 198.0, invoice_ts: "2024-01-20 09:00:00", invoice_date: "2024-01-20"}
          # Exactly what invoice 501 sold: a complete return, five days later.
          - {invoice: "C601", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "cancellation", item_type: "product", quantity: -5, unit_price: 2.0, line_amount_gbp: -10.0, invoice_ts: "2024-01-10 09:00:00", invoice_date: "2024-01-10"}
    expect:
      rows:
        - {invoice: "C601", quantity_returned: 5, original_invoice: "501", original_quantity: 5, original_invoice_date: "2024-01-05", original_unit_price: 2.0}

  - name: return_matches_break_a_tied_purchase_the_same_way_every_build
    model: int_retail_return_matches
    description: >
      An `asof join` with several rows tied on its inequality key picks one
      arbitrarily, and enough of this purchase universe is tied that the model
      was not reproducible between builds until 2026-08-24. **How much, and what
      choosing one tied line instead of summing them costs, is measured once —
      in the comment above `match_candidates` in the model** — and deliberately
      not restated here: that set of figures was written out in four places, so
      one re-measurement took four edits to land. `match_candidates` keeps the
      lowest invoice then the lowest line number at each (customer, product,
      instant), so the choice is stated instead of emergent. Nothing here claims
      the chosen line is the *better* match — only that it is always the same one.

      Everything below is this test's own, and is about the fixture rather than
      about the warehouse.

      **Four tie groups, because one group cannot catch the mutation this test
      exists for.** Delete the `qualify` and the model still returns *a* member
      of the tie group, and the tie-break's answer is always a member of that
      group — so no fixture can make a mismatch certain, and this test can only
      make it overwhelmingly likely. Measured 2026-09-01: DuckDB's *parallel*
      asof join draws a different tied row per run (at `threads=1` it is
      deterministic and takes the first row; above that it spreads), so a single
      group let the deleted tie-break through **28.7% of runs** — 287 of 1,000,
      which is how this test passed its own mutation for a week. Tie groups draw
      independently, so four of them take that to **1.1%** (22 of 2,000), and to
      **0%** single-threaded. The *healthy* model is stable at every thread count
      (100/100 at 1, 2, 4 and 8 threads), so this is never flaky in CI: the
      nondeterminism exists only while the model is already broken.

      The correct answer is never listed **first** — first is exactly what an
      un-tie-broken join takes single-threaded — and it sits at a different
      position in each group (3rd of 3, 2nd of 3, 4th of 5, 2nd of 3), so no
      positional rule satisfies all four. Each group also pins a different half
      of the ordering: lowest invoice beating lowest line number, lowest line
      within one invoice, both at once across four candidates, and the one
      nothing else asserts — `invoice` is a **string**, so "1000" sorts below
      "999" and the tie-break is lexicographic rather than numeric.
    given:
      - input: ref('stg_retail_lines')
        rows:
          # Group 1 — the winner is deliberately not listed first, since first
          # is what the un-tie-broken join takes. All three at one instant, the
          # lowest line number on the highest invoice, so ordering by line first
          # would pick 701/1: the fixture separates `(invoice, line_number)` from
          # `(line_number, invoice)`. Answer 700/3, listed third.
          - {invoice: "700", line_number: 5, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 9, unit_price: 1.0, line_amount_gbp: 9.0, invoice_ts: "2024-02-01 09:00:00", invoice_date: "2024-02-01"}
          - {invoice: "701", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 7, unit_price: 1.0, line_amount_gbp: 7.0, invoice_ts: "2024-02-01 09:00:00", invoice_date: "2024-02-01"}
          - {invoice: "700", line_number: 3, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 2, unit_price: 1.0, line_amount_gbp: 2.0, invoice_ts: "2024-02-01 09:00:00", invoice_date: "2024-02-01"}
          - {invoice: "C700", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "cancellation", item_type: "product", quantity: -4, unit_price: 1.0, line_amount_gbp: -4.0, invoice_ts: "2024-02-05 09:00:00", invoice_date: "2024-02-05"}
          # Group 2 — the tie is *within* one invoice, which group 1 cannot
          # test: 800/4 and 800/9 share an invoice, so only the line number
          # separates them. Answer 800/4, listed second.
          - {invoice: "810", line_number: 2, customer_id: "C2", stock_code: "SKU2", invoice_type: "sale", item_type: "product", quantity: 11, unit_price: 1.0, line_amount_gbp: 11.0, invoice_ts: "2024-03-01 09:00:00", invoice_date: "2024-03-01"}
          - {invoice: "800", line_number: 4, customer_id: "C2", stock_code: "SKU2", invoice_type: "sale", item_type: "product", quantity: 3, unit_price: 1.0, line_amount_gbp: 3.0, invoice_ts: "2024-03-01 09:00:00", invoice_date: "2024-03-01"}
          - {invoice: "800", line_number: 9, customer_id: "C2", stock_code: "SKU2", invoice_type: "sale", item_type: "product", quantity: 6, unit_price: 1.0, line_amount_gbp: 6.0, invoice_ts: "2024-03-01 09:00:00", invoice_date: "2024-03-01"}
          - {invoice: "C800", line_number: 1, customer_id: "C2", stock_code: "SKU2", invoice_type: "cancellation", item_type: "product", quantity: -1, unit_price: 1.0, line_amount_gbp: -1.0, invoice_ts: "2024-03-05 09:00:00", invoice_date: "2024-03-05"}
          # Group 3 — five candidates, both halves of the ordering at once: the
          # lowest invoice is 900 and it appears twice, so the answer needs the
          # line number too. Deepest group, and the one that contributes most of
          # the margin. Answer 900/2, listed fourth of five.
          - {invoice: "905", line_number: 1, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 12, unit_price: 1.0, line_amount_gbp: 12.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01"}
          - {invoice: "906", line_number: 2, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 13, unit_price: 1.0, line_amount_gbp: 13.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01"}
          - {invoice: "900", line_number: 7, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 14, unit_price: 1.0, line_amount_gbp: 14.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01"}
          - {invoice: "900", line_number: 2, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 5, unit_price: 1.0, line_amount_gbp: 5.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01"}
          - {invoice: "907", line_number: 3, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 15, unit_price: 1.0, line_amount_gbp: 15.0, invoice_ts: "2024-04-01 09:00:00", invoice_date: "2024-04-01"}
          - {invoice: "C900", line_number: 1, customer_id: "C3", stock_code: "SKU3", invoice_type: "cancellation", item_type: "product", quantity: -2, unit_price: 1.0, line_amount_gbp: -2.0, invoice_ts: "2024-04-05 09:00:00", invoice_date: "2024-04-05"}
          # Group 4 — `invoice` is a varchar, so the ordering is lexicographic:
          # "1000" < "1001" < "999". A numeric sort would pick 999/1 and the
          # model comment's claim about string ordering would be untested.
          # Answer 1000/2, listed second.
          - {invoice: "999", line_number: 1, customer_id: "C4", stock_code: "SKU4", invoice_type: "sale", item_type: "product", quantity: 20, unit_price: 1.0, line_amount_gbp: 20.0, invoice_ts: "2024-05-01 09:00:00", invoice_date: "2024-05-01"}
          - {invoice: "1000", line_number: 2, customer_id: "C4", stock_code: "SKU4", invoice_type: "sale", item_type: "product", quantity: 4, unit_price: 1.0, line_amount_gbp: 4.0, invoice_ts: "2024-05-01 09:00:00", invoice_date: "2024-05-01"}
          - {invoice: "1001", line_number: 1, customer_id: "C4", stock_code: "SKU4", invoice_type: "sale", item_type: "product", quantity: 21, unit_price: 1.0, line_amount_gbp: 21.0, invoice_ts: "2024-05-01 09:00:00", invoice_date: "2024-05-01"}
          - {invoice: "C999", line_number: 1, customer_id: "C4", stock_code: "SKU4", invoice_type: "cancellation", item_type: "product", quantity: -3, unit_price: 1.0, line_amount_gbp: -3.0, invoice_ts: "2024-05-05 09:00:00", invoice_date: "2024-05-05"}
    expect:
      rows:
        # Group 1's winner has quantity 2 against a return of 4, so this row is
        # also the 'matched, quantity exceeds purchase' artefact the model
        # comment quantifies — most of that bucket's tied rows would be plain
        # matches if the tied lines were summed instead of chosen between. That
        # is a separate decision and this test pins today's.
        - {invoice: "C700", original_invoice: "700", original_line_number: 3, original_quantity: 2, quantity_returned: 4}
        - {invoice: "C800", original_invoice: "800", original_line_number: 4, original_quantity: 3, quantity_returned: 1}
        - {invoice: "C900", original_invoice: "900", original_line_number: 2, original_quantity: 5, quantity_returned: 2}
        - {invoice: "C999", original_invoice: "1000", original_line_number: 2, original_quantity: 4, quantity_returned: 3}

  - name: return_matches_admit_a_same_instant_reversal_and_exclude_non_product_lines
    model: int_retail_return_matches
    description: >
      Two rules about which rows reach the join at all, both of which used to be
      checked from the mart. The POST cancellation is here to stay out: without
      `item_type = 'product'` on the `returns` filter the warehouse gains 1,207
      rows and reports returning things nobody buys. The last pair is bought and
      returned in the same instant, which the asof condition admits because it is
      `>=` — and that boundary is worth more than it looks: 88 matches in the
      warehouse share their purchase's instant, so tightening it to `>` costs 2
      of them a match and silently re-points the other 86 at an older sale,
      rewriting five columns with no change to the row count. Asserted on the
      rows that exist as well as on the match, because the POST line's whole
      failure mode is being present.
    given:
      - input: ref('stg_retail_lines')
        rows:
          - {invoice: "500", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 5, unit_price: 2.0, line_amount_gbp: 10.0, invoice_ts: "2024-01-05 10:00:00", invoice_date: "2024-01-05"}
          - {invoice: "C601", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "cancellation", item_type: "product", quantity: -3, unit_price: 2.0, line_amount_gbp: -6.0, invoice_ts: "2024-01-10 10:00:00", invoice_date: "2024-01-10"}
          # A cancelled postage line. A correction, not a return: must not appear.
          - {invoice: "C605", line_number: 1, customer_id: "C1", stock_code: "POST", invoice_type: "cancellation", item_type: "shipping", quantity: -1, unit_price: 18.0, line_amount_gbp: -18.0, invoice_ts: "2024-01-13 10:00:00", invoice_date: "2024-01-13"}
          # Bought and sent back in the same instant: the asof condition is `>=`,
          # not `>`, so a same-batch reversal still matches.
          - {invoice: "503", line_number: 1, customer_id: "C3", stock_code: "SKU3", invoice_type: "sale", item_type: "product", quantity: 4, unit_price: 3.0, line_amount_gbp: 12.0, invoice_ts: "2024-01-06 12:00:00", invoice_date: "2024-01-06"}
          - {invoice: "C606", line_number: 1, customer_id: "C3", stock_code: "SKU3", invoice_type: "cancellation", item_type: "product", quantity: -2, unit_price: 3.0, line_amount_gbp: -6.0, invoice_ts: "2024-01-06 12:00:00", invoice_date: "2024-01-06"}
    expect:
      rows:
        - {invoice: "C601", quantity_returned: 3, original_invoice: "500", original_quantity: 5}
        - {invoice: "C606", quantity_returned: 2, original_invoice: "503", original_quantity: 4}

  - name: return_matches_never_point_at_a_stock_write_off
    model: int_retail_return_matches
    description: >
      `purchases` requires `quantity > 0`, and that clause has never once been
      the deciding one: a negative quantity on a *sale* invoice is inventory
      shrinkage, all 3,457 of them are anonymous, and `customer_id is not null`
      excludes every one before this filter is reached. Delete it and no number
      in the warehouse moves — which is why it was recorded as a "nothing moves"
      mutation and left untested, and why it is the same category as
      `stg_retail_lines`' `invoice_type <> 'adjustment'` and `dim_date`'s eleven
      unbuilt fiscal policies: logic no data can reach, so a fixture is the only
      thing that can reach it. Confirmed against a warehouse copy — the clause
      deleted, `int_retail_return_matches` and everything downstream rebuilt,
      **PASS=16 ERROR=0** and not a row moved.

      The row that reaches it is a write-off *with a customer on it* — invoice
      501 here, a shape the source has never sent. It sits between the genuine
      purchase and the return, so an unfiltered `purchases` makes it the most
      recent prior "purchase" and the asof join takes it: `original_quantity`
      goes from 5 to **-2**, `original_invoice` names an order that sold
      nothing, and every downstream column follows. `quantity_returned >
      original_quantity` is then true, so `fct_retail_returns` files the row
      under 'matched, quantity exceeds purchase' — a legal value of a tested
      column, which is exactly what no data test can see. The zero price is
      deliberate too: it is what makes `original_amount_gbp` zero rather than
      absurd, so nothing downstream looks wrong either.
    given:
      - input: ref('stg_retail_lines')
        rows:
          # The genuine purchase, and the answer.
          - {invoice: "500", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: 5, unit_price: 2.0, line_amount_gbp: 10.0, invoice_ts: "2024-01-01 09:00:00", invoice_date: "2024-01-01"}
          # A write-off carrying a customer id. Negative quantity, zero price, a
          # plain (non-`C`) invoice — `stg_retail_lines` calls this
          # `is_stock_write_off` and it is not a sale to anybody.
          - {invoice: "501", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "sale", item_type: "product", quantity: -2, unit_price: 0.0, line_amount_gbp: 0.0, invoice_ts: "2024-01-05 09:00:00", invoice_date: "2024-01-05"}
          - {invoice: "C601", line_number: 1, customer_id: "C1", stock_code: "SKU1", invoice_type: "cancellation", item_type: "product", quantity: -3, unit_price: 2.0, line_amount_gbp: -6.0, invoice_ts: "2024-01-10 09:00:00", invoice_date: "2024-01-10"}
    expect:
      rows:
        - {invoice: "C601", quantity_returned: 3, original_invoice: "500", original_line_number: 1, original_quantity: 5, original_amount_gbp: 10.0}
