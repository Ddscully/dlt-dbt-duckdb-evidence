# Local dbt profile.
#
# Two databases now, and the split is the architecture: `raw` lives in the
# DuckLake catalog that dlt writes, and everything dbt *builds* goes into the
# DuckDB file, which is the whole of what the release publishes.
#
# WAREHOUSE_PATH and LAKEHOUSE_DIR override both so a fixture run can use
# throwaway copies; both must be **absolute**, since this file is resolved from
# `dbt/` while the Python layers resolve theirs from the repo root.
#
# The attach is what makes `source('raw', …)` resolve — `_sources.yml` declares
# `database: lakehouse`, and that name is this alias. Change one without the
# other and dbt cannot find the sources at all, which at least fails loudly;
# the silent version is renaming a dlt resource, which splits the asset graph.
#
# **One target, deliberately, and this is the decision a reviewer scans for.**
# dbt convention is `dev` / `ci` / `prod`, because on Snowflake or BigQuery a
# target separates *schemas inside one database* — that is the mechanism it
# exists to provide. DuckDB is a file, so `WAREHOUSE_PATH` swaps the whole
# database instead: a stronger separation than a schema prefix, and the one the
# three contexts here (local, CI-against-fixtures, release-against-live) already
# use. `.github/actions/setup` is the single definition of it for all four
# workflows, and `just` is the single definition locally.
#
# Adding `ci` and `prod` outputs would produce three copies of this block
# differing only in name, selected by a *second* environment variable on top of
# the one that already decides everything. It could not vary the schema either:
# `macros/generate_schema_name.sql` pins `staging` / `marts` / `analytics` to be
# identical in every context, which is what lets `marts.fct_emissions_energy`
# resolve the same on a laptop, in CI and inside the published release.
# Measured before deciding: `target.` appears **once** in this whole project, as
# `target.schema` in that macro, and no `--target` is ever passed.
#
# What a target *would* have bought is dbt's only "where am I" line —
# `Concurrency: 4 threads (target='dev')`. It names the target and never the
# file, so with one target it carries no information, and with three it would
# still not answer the question that matters here. `just where` prints the file
# instead, and every recipe that writes to it says so first.
#
# **Porting this to a real warehouse? Add the targets.** There the schema is the
# environment and this reasoning inverts — see `docs/REUSING_THIS_STACK.md`.
modern_data_stack:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
        - ducklake
      attach:
        - path: "ducklake:duckdb:{{ env_var('LAKEHOUSE_DIR', '../data/lakehouse') }}/catalog.duckdb"
          alias: lakehouse
          options:
            data_path: "{{ env_var('LAKEHOUSE_DIR', '../data/lakehouse') }}/data/"
