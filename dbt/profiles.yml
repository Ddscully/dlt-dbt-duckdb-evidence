# Local dbt profile.
#
# Two databases now, and the split is the architecture: `raw` lives in the
# DuckLake catalog that dlt writes, and everything dbt *builds* goes into the
# DuckDB file, which is the whole of what the release publishes.
#
# WAREHOUSE_PATH and LAKEHOUSE_DIR override both so a fixture run can use
# throwaway copies; both must be **absolute**, since this file is resolved from
# `dbt/` while the Python layers resolve theirs from the repo root.
#
# The attach is what makes `source('raw', …)` resolve — `_sources.yml` declares
# `database: lakehouse`, and that name is this alias. Change one without the
# other and dbt cannot find the sources at all, which at least fails loudly;
# the silent version is renaming a dlt resource, which splits the asset graph.
modern_data_stack:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
        - ducklake
      attach:
        - path: "ducklake:duckdb:{{ env_var('LAKEHOUSE_DIR', '../data/lakehouse') }}/catalog.duckdb"
          alias: lakehouse
          options:
            data_path: "{{ env_var('LAKEHOUSE_DIR', '../data/lakehouse') }}/data/"
