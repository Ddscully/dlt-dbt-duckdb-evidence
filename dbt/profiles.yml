# Local dbt profile.
#
# `raw` lives in the DuckLake catalog dlt writes, attached as `lakehouse`
# (`_sources.yml` declares `database: lakehouse`; change both or neither).
# Everything dbt builds goes into the DuckDB file, which is what the release
# publishes.
#
# WAREHOUSE_PATH and LAKEHOUSE_DIR override the two paths. Set them absolute:
# this file resolves relative paths from `dbt/`, the Python layers from the repo
# root. LAKEHOUSE_DATA_PATH moves the lakehouse's Parquet into a bucket
# (`.env.example`), and must reach this file spelled exactly as it reaches dlt.
# LAKEHOUSE_CATALOG moves the *catalog* into Postgres, with
# LAKEHOUSE_METADATA_SCHEMA naming the schema that then holds DuckLake's tables;
# the password is never here, because libpq reads PGPASSWORD and DuckDB's
# postgres extension is libpq. `lake/lakehouse.py` spells the same for Python.
#
# One target, deliberately. On Snowflake or BigQuery a target separates schemas
# inside one database; here WAREHOUSE_PATH swaps the whole database file, and
# `macros/generate_schema_name.sql` keeps schema names identical everywhere so
# `marts.fct_emissions_energy` resolves the same locally, in CI and in the
# release. More targets would differ in name only. Porting to a real warehouse?
# Add them — see `docs/REUSING_THIS_STACK.md`.
modern_data_stack:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
        - ducklake
        # For a catalog in Postgres. Listed rather than autoloaded for
        # httpfs's reason: a machine that has never downloaded it fails the
        # attach, not the query. Inert with LAKEHOUSE_CATALOG unset.
        - postgres
      # For a lakehouse whose Parquet is in a bucket: DuckDB reads no endpoint
      # from the environment, so the connection needs this secret, which
      # `storage_secret()` in lake/lakehouse.py spells for Python. It is scoped to
      # the data path, so with LAKEHOUSE_DATA_PATH unset it is inert.
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID', '') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY', '') }}"
          endpoint: "{{ env_var('LAKEHOUSE_S3_ENDPOINT', 's3.amazonaws.com').split('://')[-1].rstrip('/') }}"
          use_ssl: "{{ 'false' if env_var('LAKEHOUSE_S3_ENDPOINT', '').startswith('http://') else 'true' }}"
          region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
          url_style: path
          scope: "{{ env_var('LAKEHOUSE_DATA_PATH', 's3://lakehouse-data-path-unset/') }}"
      # One attach entry, conditional rather than two: `_sources.yml` names one
      # database, and a second entry would attach a second lakehouse.
      attach:
        - path: "{{ ('ducklake:postgres:' ~ env_var('LAKEHOUSE_CATALOG')) if env_var('LAKEHOUSE_CATALOG', '') else ('ducklake:duckdb:' ~ env_var('LAKEHOUSE_DIR', '../data/lakehouse') ~ '/catalog.duckdb') }}"
          alias: lakehouse
          options:
            data_path: "{{ env_var('LAKEHOUSE_DATA_PATH', env_var('LAKEHOUSE_DIR', '../data/lakehouse') ~ '/data/') }}"
            # Where the ducklake_* tables sit in the catalog database. A file
            # catalog keeps them in `main`, and DuckLake accepts that spelled
            # out (measured), so this stays one entry.
            metadata_schema: "{{ env_var('LAKEHOUSE_METADATA_SCHEMA', 'lakehouse') if env_var('LAKEHOUSE_CATALOG', '') else 'main' }}"
