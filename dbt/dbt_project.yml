name: "modern_data_stack"
version: "0.1.0"
config-version: 2

profile: "modern_data_stack"

# Keep the deprecation date the release notes promise. When
# `fct_emissions_energy_v1`'s `deprecation_date` (2026-11-01) passes, dbt by
# default logs a warning and exits 0 (measured); promoted, it fails `dbt parse`,
# CI's cheapest step.
#
# * `DeprecatedModel` — the date has passed (fires at parse, on the producer).
# * `DeprecatedReference` — a `ref` to a model past its date.
#
# `UpcomingReferenceDeprecation` stays a warning: a ref inside the migration
# window is what the window is for. Not `error: all`, which would fail the
# monthly release on any warning a future dbt adds.
flags:
  warn_error_options:
    error:
      - DeprecatedModel
      - DeprecatedReference

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The EU ETS price per CBAM certificate. A parameter, not a measurement: there is
  # no free API for EUA spot. EUR 75/t sits in the 2025-26 trading range (about
  # EUR 60-95) and matches the Commission's own costing. Override per run with
  # `dbt build --vars '{eu_ets_price_eur_per_t: 100}'`; `fct_cbam_exposure` also
  # ships tonnages, so the Evidence page re-prices without a rebuild.
  eu_ets_price_eur_per_t: 75

  # Degree-day bases: the outdoor temperatures below which buildings are assumed
  # to need heating, and above which cooling. Conventions, not measurements.
  # 15.5 C is the UK Met Office heating base; the US uses 65 F (18.3 C); Eurostat
  # counts from 18 C on days at or below a 15 C threshold. Cooling sits above
  # heating, leaving a band where a building needs neither. Vars because they are
  # policies (only unit tests pose other values), and `stg_weather_daily` carries
  # the base it used on every row.
  heating_degree_day_base_c: 15.5
  cooling_degree_day_base_c: 22.0

  # The month a fiscal year starts in: 4 = April (UK, India, Japan); 10 is the US
  # federal year, 1 the calendar. A var because it is a policy, not a fact about a
  # date; `dim_date` ships fiscal and calendar columns side by side and carries
  # `fiscal_year_start_month` on every row so a reader knows which built it.
  fiscal_year_start_month: 4

  # Days a published FX rate may be carried forward before the dense daily series
  # returns null. The ECB's longest gap is 5 calendar days (Christmas/New Year),
  # so 7 covers every closure; it deliberately does not bridge a currency that
  # stopped trading, such as the krona's nine-year gap from 2008.
  fx_max_carry_forward_days: 7

  # How far back `fct_fx_rates_published` re-processes on an incremental run. At
  # least `FX_LOOKBACK_DAYS` in `ingest/sources/ecb.py` (10), and larger on
  # purpose — see that model.
  fx_incremental_lookback_days: 30

  # The largest cohort age `fct_retail_customer_cohorts` generates. An upper
  # bound: each cohort is then cut to the months the extract observed, so too
  # large costs nothing and too small truncates old cohorts into apparent churn.
  # The extract spans 25 months, so 24 is exactly enough.
  retail_max_cohort_age_months: 36

models:
  modern_data_stack:
    staging:
      +materialized: view
      +schema: staging
      # A group's working copy of a source, not an interface: only models in the
      # same group may `ref` it. The two `protected` overrides in `_staging.yml`
      # are the only places one domain reads another's cleaning layer.
      +access: private
    intermediate:
      # `view`, not `ephemeral`: an ephemeral model has no relation, so it cannot
      # carry the unit tests these exist for.
      +materialized: view
      +schema: intermediate
      # Each is consumed only inside its own (domain) group.
      +access: private
    marts:
      +materialized: table
      +schema: marts
      # The interface: the monthly release ships every mart as Parquet.
      +access: public
      # One folder per subject area, matching `_groups.yml`, so `+group:` is set
      # per folder. All four inherit `+schema: marts`, so relation names, the
      # release layout and asset keys ignore the nesting.
      country_stats:
        +group: country_stats
      reference:
        +group: reference
      compliance:
        +group: compliance
      retail:
        +group: retail

seeds:
  modern_data_stack:
    cbam_default_values:
      +column_types:
        # Without this the fallback table's blank ISO3 column infers as a type
        # DuckDB then refuses to join to `country_iso3` elsewhere.
        country_iso3: varchar
    cbam_goods:
      +column_types:
        # "7601" is a code, not a number: inferred as BIGINT it loses the spaced
        # 4/6/8/10-digit form and stops joining to the values seed.
        cn_code: varchar
    currencies:
      +column_types:
        # Mostly empty — only 12 of the 47 rows carry one — and an all-blank
        # column would otherwise infer as text and fail the comparison against
        # `max(rate_date)` that checks the seed against the series.
        retired_on: date

snapshots:
  modern_data_stack:
    # The one schema no rebuild can reproduce.
    +schema: history

data_tests:
  # Each test's failing rows land in `dbt_test__audit.<test alias>`, so a red
  # check comes with the rows rather than a count.
  +store_failures: true
  +schema: dbt_test__audit
