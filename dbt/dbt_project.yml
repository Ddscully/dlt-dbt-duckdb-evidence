name: "modern_data_stack"
version: "0.1.0"
config-version: 2

profile: "modern_data_stack"

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The EU ETS spot price an importer will pay per CBAM certificate. It is a
  # *parameter*, not a measurement: there is no clean free API for EUA spot (ICAP's
  # allowance price explorer is the usual public reference), and a hardcoded number
  # would go stale silently inside a euro figure. EUAs traded around EUR 72/t in
  # April 2026 on a EUR 60-95 range across 2025-26, and the Commission's own
  # industrial decarbonisation fund was costed at EUR 75/t, so that is the default.
  #
  # Override per run — `dbt build --vars '{eu_ets_price_eur_per_t: 100}'` — and note
  # that `fct_cbam_exposure` also ships the tonnage, so the Evidence page derives its
  # whole sensitivity band from one build rather than needing one build per price.
  eu_ets_price_eur_per_t: 75

  # The month a fiscal year starts in. 4 = April, which is the UK, Indian and
  # Japanese convention; the US federal year starts in October and most of
  # continental Europe runs on the calendar (1).
  #
  # It is a var and not a column because it is a *policy*, not a fact about a
  # date: the same Tuesday belongs to FY2024 or FY2025 depending on whose books
  # you are keeping. `dim_date` ships `fiscal_year` and `fiscal_quarter` next to
  # the calendar ones so the difference is visible rather than assumed — set this
  # to 1 and the two collapse onto each other, which is the honest default for a
  # warehouse with no company in it. Anything joining on fiscal periods has to
  # know which convention built the table, hence the `fiscal_year_start_month`
  # column carried on every row.
  fiscal_year_start_month: 4

  # How many days a published FX rate may be carried forward before the dense
  # daily series gives up and returns null.
  #
  # The bound is measured, not guessed: across 7,066 publication days the longest
  # gap the ECB has ever left is 5 calendar days (36 times — the Christmas/New
  # Year runs), so 7 covers every weekend and TARGET holiday closure with room to
  # spare. What it deliberately does *not* cover is a currency the ECB stopped
  # quoting: the Icelandic krona has a 3,341-day hole from the 2008 banking
  # collapse to February 2018, and an uncapped carry-forward would fill nine
  # years with a pre-collapse rate that no one could have traded at.
  fx_max_carry_forward_days: 7

  # How far back `fct_fx_rates_published` re-processes on an incremental run.
  # Must be no smaller than `FX_LOOKBACK_DAYS` in `ingest/pipeline.py` (10), and
  # is set larger on purpose — see the comment in that model.
  fx_incremental_lookback_days: 30

models:
  modern_data_stack:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  modern_data_stack:
    cbam_default_values:
      +column_types:
        # Without this the fallback table's blank ISO3 column infers as a type
        # DuckDB then refuses to join to `country_iso3` elsewhere.
        country_iso3: varchar
    cbam_goods:
      +column_types:
        # "7601" is a CN code, not a number. Left to inference it lands as BIGINT,
        # loses the leading structure of the 4/6/8-digit forms, and stops joining
        # to the values seed's varchar key. Same lesson as dlt's type inference on
        # `wb_wdi`, one layer down.
        cn_code: varchar
    currencies:
      +column_types:
        # Mostly empty — only 12 of the 47 rows carry one — and an all-blank
        # column would otherwise infer as text and fail the comparison against
        # `max(rate_date)` that checks the seed against the series.
        retired_on: date

snapshots:
  modern_data_stack:
    # The one schema that isn't reproducible from the sources — see
    # snapshots/snap_co2_estimates.sql.
    +schema: history

data_tests:
  # A red check then links to the offending rows instead of just a count —
  # each test's failures land in <schema>/dbt_test__audit.<test_name>.
  +store_failures: true
  +schema: dbt_test__audit
