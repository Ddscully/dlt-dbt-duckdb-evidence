name: "modern_data_stack"
version: "0.1.0"
config-version: 2

profile: "modern_data_stack"

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  modern_data_stack:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

snapshots:
  modern_data_stack:
    # The one schema that isn't reproducible from the sources — see
    # snapshots/snap_co2_estimates.sql.
    +schema: history
