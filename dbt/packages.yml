packages:
  # For four generic tests: `unique_combination_of_columns` (the grain
  # contracts), `accepted_range`, `expression_is_true` and `equal_rowcount`.
  # `dbt deps` installs it into the gitignored dbt/dbt_packages/; the justfile
  # recipes run it first, and dagster-dbt does too, under `dagster dev` only.
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
