version: 2

seeds:
  - name: country_overrides
    config:
      group: reference
    description: >
      Manual country-dimension entries for ISO3 codes that OWID reports
      emissions for but the World Bank `/country` endpoint does not list, so
      they arrive with a null `region` and vanish from every regional rollup.

      Taiwan is the only material one — ~286 Mt CO2 in 2024, larger than the
      Netherlands — but the territories are included so that `region is null`
      means "genuinely not a country" rather than "not in the World Bank list".

      `region` is geographic fact and is filled for every row. `income_group` is
      a World Bank classification that these entries genuinely do not have, so
      it is left null rather than invented; Taiwan is the exception, being
      unambiguously high income by every other source.

      Antarctica (ATA) is deliberately absent: OWID reports ~0 Mt for research
      stations, but it is not a country and should not join a region.
    columns:
      - name: country_iso3
        data_tests: [not_null, unique]
      - name: region
        data_tests: [not_null]

  - name: example_scope2_sites
    config:
      group: compliance
    description: >
      **Invented data, and the only invented data in this warehouse.** Twelve
      sites of a hypothetical manufacturer — a name, a country and an annual
      electricity consumption — so that `fct_example_scope2_emissions` can show
      the arithmetic that turns `dim_grid_emission_factors` into a Scope 2
      disclosure line. The factors the meter readings are multiplied by are
      real; the meters are not.

      It is a seed rather than a source because there is nothing to fetch: this
      is the reader's own data in the real workflow, and every company's is
      different.

      **Every `country_iso3` here must be one of the 17 in `COUNTRIES` in
      `scripts/record_fixtures.py`.** The mart's `not_null` tests are real gates
      on the factor join, and `just test-pipeline` (which is what CI runs) builds
      against the fixture slice — a site in a country the fixtures don't carry
      fails CI while passing locally. That constraint is why this is a global
      footprint rather than the European one it started as, and the spread is
      better for it: Sweden at the clean end, South Africa at the other.
    columns:
      - name: site_id
        data_tests: [not_null, unique]
      - name: site_name
        data_tests: [not_null]
      - name: country_iso3
        description: >
          ISO3. Not tested against the country dimension here — the join in
          `fct_example_scope2_emissions` is a left join precisely so that a
          country with no published factor shows up as a null factor rather
          than a missing site.
        data_tests: [not_null]
      - name: annual_electricity_mwh
        description: Metered grid electricity for one year, MWh. Purchased, not generated on site.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}

  - name: cbam_goods
    config:
      group: compliance
    description: >
      The 283 goods Annex I of Implementing Regulation (EU) 2025/2621 — as
      corrected by (EU) 2026/1740 — sets default values for, across five product
      groups: cement, fertilisers, aluminium, hydrogen, and iron and steel.

      Normalised out of `cbam_default_values` because the descriptions are long
      — one runs to 250 characters — and 12,540 value rows share these 283
      triples. Repeated per row they are 1.6 MB of CSV and the same again in the
      warehouse; as a dimension they are 60 kB.

      **A CN code is not the key**, though the correction narrowed the case for
      saying so. 2523 10 00 was both white clinker and grey clinker, whose
      default values differ by more than a factor of two; they now carry the
      10-digit TARIC codes 2523 10 00 10 and 2523 10 00 90. The annex still
      prints 4- and 6-digit headings above the rows holding the numbers, so the
      grain stays (CN code, description) and `good_key` stays a slug of the pair
      — which is also what kept those two rows apart while the codes could not.
      An importer who knows only the customs code of what they are importing
      cannot resolve a single row here, which is a property of the annex rather
      than of this model.

      Regenerated wholesale by `scripts/build_cbam_seeds.py` from the
      Commission's published workbook; not hand-edited.
    columns:
      - name: good_key
        data_tests: [not_null, unique]
      - name: product_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Cement", "Fertilisers", "Aluminium", "Hydrogen", "Iron and steel"]
      - name: cn_code
        description: >
          Combined Nomenclature or TARIC code, as the annex prints it: 8 digits
          in 4/2/2 groups, 10 in 4/2/2/2 where the 2026/1740 correction split a
          good that used to share a CN code, or the 6- and 4-digit forms where
          the annex gives a value for a whole subheading. Forced to varchar in
          `dbt_project.yml` — "7601" left to inference lands as a BIGINT and
          stops joining.
        data_tests: [not_null]
      - name: goods_description
        data_tests: [not_null]

  - name: cbam_default_values
    config:
      group: compliance
    description: >
      Annex I of Commission Implementing Regulation (EU) 2025/2621, as corrected
      by (EU) 2026/1740: the country-specific default values for the specific
      embedded emissions of CBAM goods, in tonnes CO2e per tonne of good, which
      an importer uses from 2026 when they cannot get verified data from the
      installation that made the goods. One row per (country or territory, good)
      — 121 countries plus the "other countries and territories" fallback table,
      x 283 goods, minus the combinations the annex omits entirely.

      **Corrected, August 2026.** IR 2026/1740 replaced Annexes I and IV in full,
      in force 3 August and applying retroactively from 1 January 2026. The
      values barely moved — 66 of 10,503 comparable rows, 38 of them down by 2%
      or less — but the shape did: the three columns publishing each good's
      *marked-up* value for 2026, 2027 and 2028 are gone, so the phase-in
      schedule now comes from `cbam_markup_schedule` rather than being derived
      here. 10-digit TARIC codes appear (white and grey clinker were both
      `2523 10 00` and differ by more than 2x; they are `2523 10 00 10` and
      `2523 10 00 90` now), twelve sheet names changed, and Liberia and New
      Caledonia are new.

      **A seed rather than a dlt resource, on purpose.** Regulatory reference
      data is versioned by amendment, not by scrape; there is no API, and the
      values change when a new implementing regulation says so. The file name of
      the instrument is in the model description and the extractor, so the next
      amendment is a re-run of `scripts/build_cbam_seeds.py` and a reviewable
      diff. `country_overrides.csv` is the existing precedent for the shape.

      **Transcribed faithfully, defects included.** The annex is the legal
      instrument, so cleaning it here would put this project's judgement between
      the regulation and a euro figure. The correction fixed two of the three
      quirks the February version had — Albania's white Portland cement is a
      clean "-" now, and the five compounding cement rows had nothing left to
      compound once the mark-up columns went. See the extractor's docstring for
      the full account, including what the handling for them was.

      Verified against the OJ text rather than only against the Commission's
      "for information purposes only" workbook: for the seven countries whose
      table could be windowed cleanly out of the 2,400-page PDF, every row the
      OJ prints is reproduced here to the third decimal.
    columns:
      - name: country_or_territory
        description: The annex's own name for the country, or the fallback table's label.
        data_tests: [not_null]
      - name: country_iso3
        description: >
          Resolved once, at transcription time, by `SHEET_TO_ISO3` in the
          extractor — 102 of the 121 match `stg_country` by name and 19 need a
          human. Null for the "other countries and territories" row, which is a
          rule rather than a place. The map is exhaustive on purpose: when the
          correction relabelled ten countries, the extractor stopped and named
          all twelve unmapped sheets rather than writing blank codes and losing
          them at the mart's join.
      - name: good_key
        description: Foreign key to `cbam_goods`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cbam_goods')
                field: good_key
      - name: default_total_t_co2e_per_t
        description: >
          Direct + indirect embedded emissions, tCO2e per tonne of good. Null
          where the annex prints "-", which routes the row to the fallback table.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_or_territory, good_key]
      # Direct + indirect = total. This is what the mark-up tests used to do —
      # check the annex against itself — and with the mark-up columns gone it is
      # the only internal consistency the source still offers. Rows where any of
      # the three is blank are out of scope: a missing value is the annex's
      # fallback rule, not an arithmetic claim.
      #
      # **Which means it reaches 2,781 of the 12,540 rows, not most of them.**
      # `indirect` is published only for cement, fertilisers and 34 iron-and-steel
      # rows, so only that many rows have three values to add up; a further 8,129
      # carry direct and total with no indirect and nothing here checks them.
      # Worth stating, because "the annex checked against itself" invites the
      # assumption that it is checked throughout.
      #
      # The tolerance is 0.02 and it is not slack for its own sake. The annex
      # rounds each of the three columns *independently* before printing, so the
      # sum of two rounded numbers is not the rounding of their sum: Albania's
      # nitric acid is published 2,73 + 0,04 = 2,76, which is off by 0,01 and is
      # not an error in either the regulation or this transcription. 711 of those
      # 2,781 rows are inexact that way, every one of them by 0.001 to 0.01, so
      # 0.02 is double the worst case the source contains. What it still catches
      # is the failure that matters — a column read from the wrong position,
      # which is off by whole units, not hundredths.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              abs(default_direct_t_co2e_per_t + default_indirect_t_co2e_per_t
                  - default_total_t_co2e_per_t) <= 0.02
          config:
            where: >
              default_direct_t_co2e_per_t is not null
              and default_indirect_t_co2e_per_t is not null
              and default_total_t_co2e_per_t is not null
            severity: error

  - name: cbam_markup_schedule
    config:
      group: compliance
    description: >
      The CBAM phase-in mark-up, per product group and year: the percentage added
      to a default value before certificates are surrendered. 15 rows — five
      product groups x three years.

      **Asserted from the regulation, not measured, and that is a change.** Until
      the 2026/1740 correction Annex I published each good's marked-up value for
      2026, 2027 and 2028 beside the plain total, so `fct_cbam_exposure` divided
      one by the other and read the schedule off the data — which meant an
      amendment moving a rate needed no edit anywhere, and which is how the
      fertiliser exception was discovered rather than assumed. The correction
      publishes only direct, indirect and total. There is nothing left to divide,
      so the schedule has to be stated, and this is where it is stated.

      A seed rather than vars or a `case` in the model, so it stays reviewable as
      data and the fertiliser carve-out is a row rather than a branch. Note that
      it is **hand-maintained**: `scripts/build_cbam_seeds.py` does not write it,
      because it is not in the workbook. `currencies.csv` is the precedent for a
      seed that carries what the source cannot say about itself.

      Confirmed twice: against the articles (10 / 20 / 30% for cement, iron and
      steel, aluminium and hydrogen; a flat 1% for fertilisers, a food-security
      carve-out in the Omnibus) and against the February annex's own published
      columns, where all 10,929 priced rows imply exactly these rates. The stated
      rates are in fact *cleaner* than the published ones were — those carried
      rounding noise from the OJ's three decimals, so a handful of rows implied
      9,9% or 1,1%.
    columns:
      - name: product_group
        description: >
          Matches `cbam_goods.product_group` exactly — the annex's own group
          banner ("Cement", "Iron and steel", ...). The mart joins on it, so an
          unlisted group would silently price at null.
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2026, 2027, 2028]
                quote: false
      - name: markup_pct
        description: Percentage points added to the default value, e.g. 10 for +10%.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_group, year]
      # Every group the goods dimension knows must appear here with **all three
      # years**, or the mart's left join prices that group at null with nothing
      # to say why. This is the gate that replaces deriving the schedule from the
      # data — the old arrangement could not have this failure, because a group
      # with goods necessarily had published columns to divide.
      #
      # Checking presence alone is not enough, and that was the first version of
      # this test. The mart reads each year with its own
      # `max(markup_pct) filter (where year = ...)`, so a group seeded with only
      # a 2026 row yields null rates for 2027 and 2028 — and null euro figures in
      # two of the three years of a published Parquet, on a green build. The
      # `not_null` tests on the 2027 and 2028 columns in `_compliance.yml` are the
      # other half of that; this is the half that names the cause.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (select count(*) from (
                  select g.product_group
                  from {{ ref('cbam_goods') }} as g
                  left join {{ ref('cbam_markup_schedule') }} as m
                      on g.product_group = m.product_group
                  group by g.product_group
                  having count(distinct m.year) <> 3)) = 0

  - name: currencies
    config:
      group: reference
    description: >
      The 47 currency codes the ECB reference-rate series has ever contained,
      with the name to label them by and — for the twelve where it is a matter of
      public record — the date and reason the quote ended.

      Hand-maintained rather than generated, because Frankfurter's `/currencies`
      endpoint lists only the 30 codes that are still published and the
      interesting half of this table is the 17 that are not. It carries *no*
      dates the series can supply for itself: `first_published_date` and
      `last_published_date` are derived in `marts.dim_currency`, and the seed is
      checked against them rather than trusted.
    columns:
      - name: currency_code
        description: ISO 4217 alphabetic code.
        data_tests: [not_null, unique]
      - name: currency_name
        data_tests: [not_null]
      - name: retired_on
        description: >
          The first day the code was no longer a live quote — a euro adoption
          date or a redenomination date. Null for the 30 current codes and for
          the five whose quote simply ceased (ARS, DZD, MAD, TWD in October 2020
          and RUB in March 2022): the seed deliberately does not guess at a
          publisher's reason, and `dim_currency.retirement_is_explained` is how a
          consumer tells "still current" from "stopped, cause not recorded here".
      - name: retired_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [euro_adoption, redenomination]
      - name: replaced_by_currency
        description: >
          EUR for the ten euro adoptions; TRY and RON for the two 2005
          redenominations, where the money continued under a new code at
          1,000,000:1 and 10,000:1. A series charted by code rather than by money
          has a cliff at those two dates.
    data_tests:
      # Every retirement date the seed asserts has to be consistent with what the
      # ECB actually published — the last quote strictly before it. All twelve
      # land on the business day before, which is why the dates can be trusted at
      # all. Lives here rather than on the mart because it is the *seed* being
      # checked; the mart is only where the evidence lives.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              retired_on is null
              or retired_on > (
                  select max(rate_date) from {{ ref('stg_fx_rates') }} as r
                  where r.quote_currency = currency_code
              )
      - dbt_utils.expression_is_true:
          arguments:
            expression: "replaced_by_currency is not null"
          config:
            where: "retired_reason is not null"
