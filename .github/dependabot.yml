version: 2

# Green CI says nothing about outdated versions, so something has to watch them.
# The five ecosystems below are the ones with a pinned version in the tree.
# Monthly and grouped — one open PR per ecosystem — to match the release cadence
# rather than trickle single-dependency PRs.

updates:
  # `astral-sh/setup-uv` is pinned to an exact patch (it stopped publishing
  # moving major tags at v8), so it can only ever be bumped by something like
  # this. The rest track major tags and move on their own within a major.
  #
  # **`directories`, plural**: `directory: /` scans only `.github/workflows/`,
  # and the `setup-uv` pin lives in the composite action, where it would freeze
  # unnoticed. A glob, so a second composite action is covered too.
  # `tests/test_workflows.py` asserts the pair.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  # uv.lock is committed, so a lockfile refresh is a reviewable diff rather than
  # something that silently differs between a contributor's machine and CI.
  #
  # `lockfile-only` because the bounds in pyproject.toml are minimum-supported
  # versions, not pins (`duckdb>=1.1` sits far below what resolves). The default
  # strategy raises the lower bound on every upstream release instead.
  - package-ecosystem: uv
    directory: /
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]

  # Evidence and its adapters. `reports/`, not the root — that's where
  # package.json and package-lock.json live.
  #
  # Deliberately *not* lockfile-only, unlike uv above: these are `^` ranges, so
  # the major is the pin and an Evidence 40 -> 41 bump is a real upgrade worth
  # seeing as a PR. Lockfile-only would silently cap the site at 40.x forever.
  - package-ecosystem: npm
    directory: /reports
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      evidence:
        patterns: ["*"]

  # The service images in compose.yaml.
  #
  # **`docker-compose`, not `docker`.** They are separate ecosystems: `docker`
  # matches Dockerfiles, Containerfiles and Kubernetes manifests, and this repo
  # now has one of those — see the entry below, which is why both are here and
  # neither is redundant. `docker-compose`'s own pattern is
  # `(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml`, which the root
  # `compose.yaml` matches (dependabot-core, checked 2026-09-17).
  #
  # Not lockfile-only and not grouped away: the tags are exact (`postgres:17.11`),
  # so there is no range for a patch to arrive through silently and every bump
  # is a real one. Without this entry they would be versions that can only age
  # deliberately.
  #
  # **Except a Postgres major, which is a migration and not a bump**: a major can
  # move the image's data directory, and the stack then comes up on an empty
  # cluster with the health check passing, which CI, starting from an empty
  # volume, cannot see (docs/decisions/0008). Patches within 17 still arrive; a major waits for a mount change
  # plus a dump-and-restore, tested on a copy of a populated `mds_postgres`.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      containers:
        patterns: ["*"]

  # The three base images in the root `Dockerfile` — the Node toolchain, uv, and
  # the Python the venv is built on. The entry above does not cover them:
  # `docker-compose` matches compose files and `docker` matches Dockerfiles, and
  # a `FROM` is invisible to the first.
  #
  # A container looked like pinned versions nothing watches (docs/decisions/0005).
  # This entry is the answer: it is watched, so it is not one of the versions that can only age
  # deliberately. `tests/test_dagster_instance.py` refuses a tag Dependabot
  # could not bump.
  #
  # **Except a Python minor or a Node major, each of which has a second pin this
  # entry cannot see.** The Python image must carry `.python-version`'s minor:
  # the Dockerfile sets `UV_PYTHON_DOWNLOADS=never`, so `python:3.14` under a
  # 3.13 pin fails `uv sync` with "No interpreter found". The
  # Node image follows `pages.yml`'s `node-version`, the active LTS the published
  # site is built on. Both move by hand, in one PR with their partner;
  # `tests/test_dagster_instance.py` fails if they drift apart. And since the
  # group is one PR at `open-pull-requests-limit: 1`, a bump that cannot pass
  # also blocks every patch behind it, which is why these are ignored rather
  # than left for review.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
