name: live

# The other half of the test pyramid. `ci.yml` proves the repo works against
# recorded payloads; this proves the recorded payloads still resemble reality —
# it runs the same asset graph against the live OWID / World Bank / Eurostat
# endpoints and opens an issue when they've moved.
#
# It is also where the site's data comes from. The landing zone it fetches is
# cached, and `pages.yml` rebuilds the site from that cache on every push that
# cannot change what lands in `raw`, so a publisher that breaks reaches this
# run's issue rather than an unrelated commit's deploy.
#
# Expected failure modes, all of which are worth a human looking:
#   - a source renamed or dropped a column   -> stg_* breaks
#   - a WDI indicator was retired            -> wdi_indicators_all_present fails
#   - a publisher stopped updating           -> mart_covers_recent_years, below
#   - an endpoint moved                      -> http.get_json raises
#
# When it fires, fix the pipeline and re-record with `just record-fixtures`.

on:
  schedule:
    # Weekly, not daily: what meets the live sources next is `pages.yml`'s
    # Monday rebuild (06:40), which publishes what this run caches, and
    # `release-data.yml` (the 1st, 07:10), which fetches its own. A source that
    # breaks mid-week reaches neither until then. Each cron fires shortly before
    # one of those, which is when the alert can still act. Two lines, because
    # `20 5 1 * 1` means "the 1st or a Monday", which nobody reads it as.
    # 05:20 UTC — off the hour, since everyone's cron fires on it.
    - cron: "20 5 * * 1"
    - cron: "20 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The cache `pages.yml` restores. actions/cache matches on the path string as
# well as the key, so a mismatch is a miss rather than an error, and every push
# would go down the live path, green. `tests/test_workflows.py` holds both
# workflows to the same values.
env:
  RAW_CACHE_PATH: data/lakehouse
  RAW_CACHE_PREFIX: raw-lakehouse-

jobs:
  live:
    runs-on: ubuntu-latest
    # GitHub's default is six hours, and a hung run spends all of them: see
    # release-data.yml's weather step. A backstop: the steps that can hang carry
    # their own, because a job that times out is *cancelled*, and the issue step
    # below runs on failure() and so not at all.
    timeout-minutes: 55
    # No INGEST_FIXTURES anywhere in this workflow — that is the entire point of
    # it. The three paths come from the setup action.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          groups: --group dev --group orchestration

      # What `pages.yml` and the release build on, so the landing zone cached
      # below is one they could have fetched: the weather archive carried in
      # rather than cold-started, the snapshots restored. Without it the cache
      # would hold three years of weather, and the Weather page would thin for
      # a week. The cold start itself is what the fixture pipeline in `ci.yml`
      # covers. Soft-failing: a failed download should not stop the live check,
      # only the caching, which reads `carried`. No release at all is not a
      # failure: there is nothing to carry, and the cache is as good as any.
      - name: Borrow snapshot history and the landing zone from the latest data release
        id: borrow
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 30 --json tagName \
            --jq '[.[].tagName | select(startswith("data-"))] | first // empty')
          if [ -z "$prev" ]; then
            echo "No data-* release yet — the weather archive cold-starts."
            echo "carried=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$prev" --pattern warehouse.duckdb --dir prev-release
          # Beside the database, where `restore_history` looks. Whether the
          # release has one is asked, as release-data.yml asks, never inferred
          # from a failed download: that would cold-start the weather archive,
          # report `carried` and cache the thin archive for `pages.yml`.
          assets=$(gh release view "$prev" --json assets --jq '.assets[].name')
          if grep -qx 'lakehouse.tar.gz' <<<"$assets"; then
            gh release download "$prev" --pattern lakehouse.tar.gz --dir prev-release
          else
            echo "$prev has no lakehouse.tar.gz — the weather archive cold-starts."
          fi
          uv run python -m publish.restore_history prev-release/warehouse.duckdb
          rm -rf prev-release
          echo "carried=true" >> "$GITHUB_OUTPUT"

      # `just materialize` depends on `dbt-parse`, which writes the manifest
      # `@dbt_assets` reads at import time.
      # A step that times out *fails* (actions/runner, StepsRunner.cs), so the
      # issue still opens. About twice the longest run measured, 16.5 minutes,
      # most of it Open-Meteo refusing and the weather source waiting: room for
      # an hourly 429's 11-minute retry without a false alarm.
      - name: Materialize the asset graph against live sources
        timeout-minutes: 35
        run: just materialize

      # Before the freshness check, which can fail on a publisher two years
      # behind while the landing zone it read is still sound. The key carries
      # the epoch second, which `pages.yml` reads the cache's age from.
      - name: Name the cache entry for this landing zone
        id: stamp
        if: steps.borrow.outputs.carried == 'true'
        timeout-minutes: 1
        run: echo "key=${RAW_CACHE_PREFIX}$(date +%s)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache the landing zone for pages.yml
        if: steps.stamp.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.RAW_CACHE_PATH }}
          key: ${{ steps.stamp.outputs.key }}

      # `mart_covers_recent_years` is a WARN check, and a failed WARN check does
      # not fail the run: `just materialize` exits 0, so the issue step below
      # never fired for a publisher that stopped updating. It stays WARN in the
      # graph — a late publisher should not halt the release or the site — and
      # this job, whose purpose is to notice, calls it directly.
      - name: Fail when a source has stopped updating
        timeout-minutes: 5
        run: |
          uv run --group orchestration python - <<'PY'
          import sys

          from orchestration.assets import mart_covers_recent_years

          result = mart_covers_recent_years()
          behind = result.metadata["years_behind"].value
          print(f"years behind, per source: {behind}")
          if not result.passed:
              sys.exit(f"a source is more than two years behind: {behind}")
          PY

      # A build artifact, not a release: handy for diffing what the live sources
      # actually returned on the day the run went red. `release-data.yml` is the
      # durable, versioned, publicly downloadable version of the same file.
      #
      # Never the warehouse itself. It holds `customer_id` in clear, because the
      # id is pseudonymised at the export and never in a model, and anyone
      # signed in to GitHub can download a public repository's artifacts. The
      # upload is the copy the release would ship (staging made tables, every
      # direct identifier rewritten) under a salt made for this run and kept
      # nowhere, so its pseudonyms link to nothing. If the copy cannot be made,
      # nothing is uploaded. `tests/test_workflows.py` holds both halves.
      - name: Make a copy of the warehouse that is safe to upload
        if: always()
        timeout-minutes: 3
        run: >-
          uv run python -c "from publish.export_warehouse import pseudonymised_copy;
          pseudonymised_copy('artifact/warehouse.duckdb')"

      - name: Upload the warehouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warehouse-${{ github.run_id }}
          path: artifact/warehouse.duckdb
          retention-days: 7
          if-no-files-found: warn

      # One open issue at a time: a source that breaks tends to stay broken,
      # and a fresh issue every run would just train people to ignore them. Subsequent failures comment on the existing thread.
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'live-source-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = [
              `The weekly live-source run failed: ${runUrl}`,
              '',
              'This does **not** mean a pull request broke the repo — `ci.yml` runs',
              'against recorded fixtures and is unaffected. It means one of the',
              'upstream sources has changed, gone down, or stopped updating.',
              '',
              'Once the pipeline is fixed, re-record with `just record-fixtures`',
              'and commit `tests/fixtures/ingest/`.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              core.notice(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Live-source run failed (${new Date().toISOString().slice(0, 10)})`,
                labels: [label],
                body,
              });
              core.notice(`Opened issue #${issue.number}`);
            }
