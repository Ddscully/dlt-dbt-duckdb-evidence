name: pages

# Publishes the Evidence dashboard to GitHub Pages.
#
# Unlike `ci.yml`, this runs against the LIVE sources. The published site is the
# point of the repo, and a dashboard built from `tests/fixtures/ingest/` would
# show the 17-country slice rather than the world. That means this workflow can
# go red when an upstream source moves — `nightly.yml` is what alerts on that;
# here the previous deployment simply stays up.
#
# Requires Pages to be enabled once, with Settings -> Pages -> Source set to
# "GitHub Actions".

on:
  push:
    branches: [main]
    # An allowlist of what the site is actually built from, because this job is
    # a full ingest -> dbt -> Polars -> Evidence run against the LIVE
    # public APIs. Without it the cheapest commit in the repo costs the same
    # Actions minutes and the same API load as a data change: 23 of the 94
    # commits on main have been docs, skills or tests, and every one of them
    # rebuilt and redeployed an identical site.
    #
    # `paths-ignore: ['**.md']` is the obvious version and it is wrong. The
    # dashboard *is* markdown — `reports/pages/` holds the ten pages — so a
    # blanket markdown ignore would stop republishing the site exactly when a
    # page changed, which is this repo's collected failure mode: green and
    # wrong.
    #
    # An allowlist rather than an exclusion list, because the two get their
    # mistakes the right way round. A build input missing from this list makes
    # the site stale, which is visible and which the weekly cron below caps at
    # seven days. A doc directory missing from an exclusion list is invisible
    # and permanent.
    paths:
      - "ingest/**"
      - "transform/**"
      - "lake/**"
      - "orchestration/**"
      - "src/**"
      - "scripts/**"
      - "dbt/**"
      - "reports/**"
      # DAGSTER_HOME is the checked-out .dagster/, so the instance config the
      # build runs under is this file, not a runner default.
      - ".dagster/dagster.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/pages.yml"
  schedule:
    # Weekly, 06:40 UTC Monday. The sources publish annually, so a nightly
    # rebuild would burn Actions minutes to republish identical numbers.
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-deployed site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # No INGEST_FIXTURES: see the note at the top.
      # Absolute for the same reason, and here it is not merely tidiness: dlt
      # writes the catalog from the repo root, so DuckLake records an *absolute*
      # data_path, while dbt resolves profiles.yml's relative default from dbt/.
      # DuckLake stores the path as given and compares the two as strings, so
      # one directory under two spellings is refused — `DATA_PATH parameter
      # "../data/lakehouse/data/" does not match existing data path`.
      LAKEHOUSE_DIR: ${{ github.workspace }}/data/lakehouse
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact patch: setup-uv stopped publishing moving major/minor
      # tags at v8, so `@v9` does not resolve. Bump it by hand.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --group orchestration

      # dbt/dbt_packages/ and dbt/target/ are gitignored, and `prepare_if_dev`
      # only fires under `dagster dev` — so outside the UI the manifest has to
      # be built explicitly before the asset graph can load.
      - name: Install dbt packages and parse the project
        run: cd dbt && uv run dbt deps && uv run dbt parse

      # 24 is the active LTS; 20 went end-of-life in April 2026 and the runners
      # now force node20 actions onto 24 anyway. `package.json` only asks for
      # >=18, so this is the floor moving with upstream rather than a
      # requirement — but keep it an even (LTS) major.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reports/package-lock.json

      # Project Pages serve from https://<user>.github.io/<repo>/, so every
      # asset and link needs that prefix. Evidence reads it from
      # `deployment.basePath` in evidence.config.yaml and has no env-var
      # equivalent, so it's appended here at build time instead of committed —
      # a committed basePath would break `npm run dev` on localhost. It has to
      # happen before the site is built, i.e. before the job below.
      # Delete this step if you move the site to a custom domain or a
      # <user>.github.io repo, where the site is served from the root.
      - name: Set the Pages base path
        run: |
          printf '\ndeployment:\n  basePath: /%s\n' \
            '${{ github.event.repository.name }}' >> reports/evidence.config.yaml

      # ingest -> dbt build + test -> Polars -> Evidence, in asset-graph
      # order. `publish_site` is `full_refresh` plus `reports/evidence_site`,
      # which shells out to npm (install, `sources:strict`, `build`) — so the
      # site is a node in the graph here rather than three steps bolted on after
      # it. The site asset is why this job and not `full_refresh`, and why
      # `setup-node` runs above; the other three workflows use `full_refresh`
      # and need no Node at all.
      #
      # `sources:strict` is the load-bearing part: `evidence build` renders
      # whatever parquet `reports/.evidence/` already holds, that directory is
      # gitignored, and without the extraction this would deploy a site whose
      # every query reads "Table with name emissions_energy does not exist".
      # --strict makes an empty warehouse a red build instead.
      # The Restatements page can only show revisions the snapshot was present
      # for, and this job builds from an empty file — so the published page sat
      # permanently in its "nothing revised yet" branch. `release-data.yml`
      # accumulates that history across monthly releases; borrowing the newest
      # one here means the page shows what OWID has actually restated since.
      #
      # Soft-failing on purpose, unlike release-data.yml: there the snapshot is
      # the artifact and losing it is permanent, here it is a read-only display.
      # A missing release should cost one section of one page, not the deploy.
      - name: Borrow snapshot history from the latest data release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 30 --json tagName \
            --jq '[.[].tagName | select(startswith("data-"))] | first // empty')
          if [ -z "$prev" ]; then
            echo "No data-* release yet — the Restatements page will show version 1 only."
            exit 0
          fi
          gh release download "$prev" --pattern warehouse.duckdb --dir prev-release
          uv run python -m scripts.restore_history prev-release/warehouse.duckdb
          rm -rf prev-release

      - name: Build the warehouse and the site from live sources
        run: |
          mkdir -p "$DAGSTER_HOME"
          # Two jobs: an asset job takes one partitions definition, and the retail
          # ingest is monthly where wb_wdi is yearly. dbt reads the retail table, so
          # this one goes first (see orchestration/definitions.py).
          uv run dagster job execute -m orchestration.definitions -j load_retail
          uv run dagster job execute -m orchestration.definitions -j publish_site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: reports/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
