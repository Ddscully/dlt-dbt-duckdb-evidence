name: nightly

# The other half of the test pyramid. `ci.yml` proves the repo works against
# recorded payloads; this proves the recorded payloads still resemble reality —
# it runs the same asset graph against the live OWID / World Bank / Eurostat
# endpoints and opens an issue when they've moved.
#
# Expected failure modes, all of which are worth a human looking:
#   - a source renamed or dropped a column   -> stg_* breaks
#   - a WDI indicator was retired            -> wdi_indicators_all_present fails
#   - a publisher stopped updating           -> mart_covers_recent_years warns
#   - an endpoint moved                      -> _get_json raises
#
# When it fires, fix the pipeline and re-record with `just record-fixtures`.

on:
  schedule:
    # 05:20 UTC — off the hour, since everyone's cron fires on it.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      # No INGEST_FIXTURES here — that's the entire point of this workflow.
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --group dev --group orchestration

      - name: Materialize the asset graph against live sources
        run: |
          mkdir -p "$DAGSTER_HOME"
          uv run dagster job execute -m orchestration.definitions -j full_refresh

      # A build artifact, not a release: handy for diffing what the live sources
      # actually returned on the day the run went red.
      - name: Upload the warehouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-${{ github.run_id }}
          path: data/warehouse.duckdb
          retention-days: 7
          if-no-files-found: warn

      # One open issue at a time: a source that breaks tends to stay broken for
      # a few days, and a fresh issue every morning would just train people to
      # ignore them. Subsequent failures comment on the existing thread.
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = [
              `The nightly live-source run failed: ${runUrl}`,
              '',
              'This does **not** mean a pull request broke the repo — `ci.yml` runs',
              'against recorded fixtures and is unaffected. It means one of the',
              'upstream sources has changed, gone down, or stopped updating.',
              '',
              'Once the pipeline is fixed, re-record with `just record-fixtures`',
              'and commit `tests/fixtures/ingest/`.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              core.notice(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly live-source run failed (${new Date().toISOString().slice(0, 10)})`,
                labels: [label],
                body,
              });
              core.notice(`Opened issue #${issue.number}`);
            }
