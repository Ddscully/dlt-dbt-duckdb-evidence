name: ci

# Fast, deterministic, offline. Every network call the pipeline makes is served
# from `tests/fixtures/ingest/` (see ingest/fixtures.py), so a red build here
# means this repo broke — not that OWID was rate-limiting. The live sources are
# exercised once a day by `nightly.yml` instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Serve every source from the recorded fixtures.
      INGEST_FIXTURES: "1"
      # Absolute, because dbt resolves this from dbt/ and Python from the root.
      WAREHOUSE_PATH: ${{ github.workspace }}/data/warehouse.duckdb
      # Absolute for the same reason, and here it is not merely tidiness: dlt
      # writes the catalog from the repo root, so DuckLake records an *absolute*
      # data_path, while dbt resolves profiles.yml's relative default from dbt/.
      # DuckLake stores the path as given and compares the two as strings, so
      # one directory under two spellings is refused — `DATA_PATH parameter
      # "../data/lakehouse/data/" does not match existing data path`.
      LAKEHOUSE_DIR: ${{ github.workspace }}/data/lakehouse
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact patch: setup-uv stopped publishing moving major/minor
      # tags at v8, so `@v9` does not resolve. Bump it by hand.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --group dev --group orchestration

      # Mocked-payload unit tests over the parsing logic: retry/raise, WDI
      # pagination, the Eurostat stride walk, the Polars transform.
      - name: Unit tests
        run: uv run pytest

      # Parses the dbt manifest and resolves the whole asset graph, so a broken
      # ref, a renamed source or a dangling asset key fails before any I/O.
      #
      # Three test files run here rather than in the step above: each needs the
      # manifest that `dbt parse` writes, so in the unit-test tier they skip
      # themselves. This list is held to the tree by `tests/test_workflows.py` —
      # it named only `test_definitions.py` for months while the other two
      # skipped in the first step and were never re-run, so they ran nowhere in
      # CI at all and both said in their own headers that they did.
      #
      # What `validate` cannot see is an asset that was never registered — the
      # graph it checks is only the one `Definitions` was handed — so this is the
      # step that catches it.
      - name: Validate Dagster definitions
        run: |
          cd dbt && uv run dbt deps && uv run dbt parse && cd ..
          uv run dagster definitions validate -m orchestration.definitions
          uv run pytest tests/test_definitions.py tests/test_asset_checks.py tests/test_documented_counts.py

      # Runs ingest -> dbt build + test -> Polars in asset-graph order, and
      # evaluates the asset checks alongside dbt's tests — all against fixtures.
      - name: Materialize the asset graph
        run: |
          mkdir -p "$DAGSTER_HOME"
          # Two jobs: an asset job takes one partitions definition, and the retail
          # ingest is monthly where wb_wdi is yearly. dbt reads the retail table, so
          # this one goes first (see orchestration/definitions.py).
          uv run dagster job execute -m orchestration.definitions -j load_retail
          uv run dagster job execute -m orchestration.definitions -j full_refresh

      # The publish path (`release-data.yml`) against the fixture warehouse: a
      # renamed schema or a copy whose views don't survive fails here, on a pull
      # request, rather than on the first of the month.
      - name: Package the release artifact
        # The exporter refuses to run without a salt, including against a fixture
        # warehouse — see `docs/DATA_PROTECTION.md`. A fixed literal here on
        # purpose: this artifact is thrown away at the end of the job and is
        # never published, so a value in the clear is the honest signal that it
        # is not a release. `release-data.yml` passes the repository secret.
        env:
          PII_SALT: ci-not-a-release-salt
        run: |
          uv run python -m scripts.export_warehouse
          cd data/export && sha256sum -c SHA256SUMS

      # From dbt/: the dbt templater opens the warehouse via the profile's
      # relative path without chdir'ing into the project first. Same paths as
      # `just lint` and the pre-commit hook (which runs that recipe) — a narrower
      # set here would mean CI passing SQL a contributor's commit hook rejects.
      - name: Lint SQL
        run: cd dbt && uv run sqlfluff lint models snapshots

      # `sqlfluff-lint` is a `local` hook whose entry is the `just lint` recipe —
      # deliberately, so there is exactly one pinned sqlfluff (see
      # .pre-commit-config.yaml). The cost is that the runner needs `just` on
      # PATH: without it every pre-commit run fails with "Executable `just` not
      # found", and the SQL never gets linted by the hook at all.
      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ruff, formatting and whitespace. The same hooks contributors get from
      # `uv run pre-commit install`, run here because an outside PR arrives
      # from a clone where nobody ran that. Last, since it's the cheapest
      # failure to fix and the least interesting one to learn about first.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
