name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --group dev

      - name: Ingest sources
        run: uv run python -m ingest.pipeline

      - name: dbt build + test
        run: cd dbt && uv run dbt build

      - name: Polars transforms
        run: uv run python -m transform.co2_intensity

      - name: Lint SQL
        run: uv run sqlfluff lint dbt/models
