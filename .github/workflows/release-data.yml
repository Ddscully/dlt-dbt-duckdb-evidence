name: release-data

# Publishes the built warehouse as a versioned GitHub release, so the data is
# consumable without cloning the repo or re-running the pipeline:
#
#   ATTACH 'https://github.com/<owner>/<repo>/releases/latest/download/warehouse.duckdb'
#          AS warehouse (READ_ONLY);
#
# Like `pages.yml` this builds from the LIVE sources — a published dataset made
# of the 17-country fixture slice would be worse than none. `nightly.yml` is what
# alerts when a source moves; a failure here just means the last release stands.
#
# Monthly, because OWID and the World Bank publish annually and a nightly
# release would be 30 identical 29 MB uploads a month. Cut one on demand
# (`gh workflow run release-data.yml`) when a source has actually updated.

on:
  schedule:
    # 07:10 UTC on the 1st.
    - cron: "10 7 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: data-YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write # creates the tag, the release and its assets
  # `contents: write` alone was enough until 2026-07-30, when `gh release create`
  # began returning 403 "Resource not accessible by integration" — on a workflow
  # file unchanged since the release it cut the day before, with `Contents: write`
  # still logged in the run's own token permissions, no ruleset, no tag protection
  # and `default_workflow_permissions: write` on the repo. It failed twice, twelve
  # minutes apart, and succeeded on the next run with these two added.
  #
  # What is verified is the requirement, not the reason: the successful run logs
  # `Attestations: write` where the failed ones logged only Contents and Metadata,
  # and the release GitHub produced reports `immutable: false` — so this is *not*
  # the immutable-releases flow, whatever else it is. `id-token` went in at the
  # same time and was never isolated; dropping either one costs a ~7-minute run to
  # retest, so they stay together unless something forces the question.
  id-token: write
  attestations: write

# Two runs uploading assets to the same dated tag would race.
concurrency:
  group: release-data
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # No INGEST_FIXTURES: see the note at the top.
      # Absolute for the same reason, and here it is not merely tidiness: dlt
      # writes the catalog from the repo root, so DuckLake records an *absolute*
      # data_path, while dbt resolves profiles.yml's relative default from dbt/.
      # DuckLake stores the path as given and compares the two as strings, so
      # one directory under two spellings is refused — `DATA_PATH parameter
      # "../data/lakehouse/data/" does not match existing data path`.
      LAKEHOUSE_DIR: ${{ github.workspace }}/data/lakehouse
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact patch: setup-uv stopped publishing moving major/minor
      # tags at v8, so `@v9` does not resolve. Bump it by hand.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --group orchestration

      # dbt/dbt_packages/ and dbt/target/ are gitignored, and `prepare_if_dev`
      # only fires under `dagster dev` — so outside the UI the manifest has to
      # be built explicitly before the asset graph can load.
      - name: Install dbt packages and parse the project
        run: cd dbt && uv run dbt deps && uv run dbt parse

      # Two kinds of state cannot be rebuilt, for two different reasons, and they
      # now live in two different artifacts. The `history` schema is state *in
      # principle* — no rebuild invents a revision upstream has overwritten — and
      # it is inside `warehouse.duckdb`. `raw.om_weather_daily` is unreproducible
      # within a *budget* (Open-Meteo allows 10,000 weighted units a day and the
      # archive costs more), and it is in the `lakehouse.tar.gz` asset, because
      # dlt lands `raw` in a DuckLake catalog rather than in the database.
      #
      # `scripts/restore_history.py` carries both: it finds the lakehouse beside
      # the database rather than being told where it is, so the download has to
      # bring the pair. Copying them in *before* the build is what makes
      # `dbt snapshot` compare against last month and what keeps the weather
      # archive deepening instead of resetting to a three-year cold start.
      #
      # Only the "no previous release" case is allowed to skip. A download or
      # restore that fails is fatal: continuing would silently reset the carried
      # state to empty and the next release would inherit that, which is exactly
      # the failure this step exists to prevent.
      - name: Carry unreproducible tables forward from the previous release
        id: history
        run: |
          prev=$(gh release list --limit 30 --json tagName \
            --jq '[.[].tagName | select(startswith("data-"))] | first // empty')
          if [ -z "$prev" ]; then
            echo "No previous data-* release — the snapshot starts empty."
            echo "restored_rows=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Restoring history from $prev"
          gh release download "$prev" --pattern warehouse.duckdb --dir prev-release
          # The landing zone is one tarball beside the database, and
          # `restore_history` looks for it there. A release cut before the asset
          # existed simply has none, which `gh` reports as a failure — hence the
          # `|| true`. That is the "restoring nothing is normal" rule one level
          # down, and it is safe here for the same reason it is safe there: the
          # verify step below asserts what actually got carried.
          gh release download "$prev" --pattern lakehouse.tar.gz \
            --dir prev-release || true
          uv run python -m scripts.restore_history prev-release/warehouse.duckdb
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys

          import duckdb

          from modern_data_stack.history import carried_rows
          from scripts.restore_history import CARRIED

          # Counted through the same rules the restore used, rather than a schema
          # name written out again here: a relation added to `CARRIED` would
          # otherwise be carried forward but never checked, which is the same
          # silent-reset failure one step removed. That has already happened once
          # — `snap_grid_emission_factors` arrived beside a check that named
          # `snap_co2_estimates` by hand.
          #
          # stdout is $GITHUB_OUTPUT here, so the per-relation lines go to stderr.
          con = duckdb.connect("data/warehouse.duckdb", read_only=True)
          counts = carried_rows(con, CARRIED)
          for relation, n in counts.items():
              print(f"carried {relation}: {n:,} rows", file=sys.stderr)
          print(f"restored_rows={sum(counts.values())}")

          # The landing zone is counted separately because it is a separate
          # artifact — `CARRIED` names relations inside the database and the
          # weather archive is not in it any more. Two numbers because they can
          # fail independently: a missing `warehouse.duckdb` loses the revision
          # log, a missing `lakehouse.tar.gz` loses the weather archive, and
          # each is silent on its own.
          from lake import lakehouse

          weather = lakehouse.carried_rows()
          print(f"carried lakehouse: {weather:,} rows", file=sys.stderr)
          print(f"restored_lakehouse_rows={weather}")
          PY
          rm -rf prev-release

      # ingest -> dbt build + test -> Polars, in asset-graph order. dbt's 60
      # tests run inside `dbt build`, so a warehouse that fails its own
      # data-quality gates never reaches the release.
      #
      # The warehouse file already exists at this point when history was
      # restored. That's fine for dlt: it keys "fresh destination" on its own
      # bookkeeping inside `raw`, which a history-only file doesn't have.
      - name: Build the warehouse from live sources
        run: |
          mkdir -p "$DAGSTER_HOME"
          # Two jobs: an asset job takes one partitions definition, and the retail
          # ingest is monthly where wb_wdi is yearly. dbt reads the retail table, so
          # this one goes first (see orchestration/definitions.py).
          uv run dagster job execute -m orchestration.definitions -j load_retail
          uv run dagster job execute -m orchestration.definitions -j full_refresh

      # Writes data/export/: the DuckDB copy, a Parquet per modelled table,
      # manifest.json, SHA256SUMS, ATTRIBUTION.md and the release body.
      - name: Package the artifact
        id: export
        # Through the environment rather than interpolated into the script: it's
        # a string a human typed into the dispatch form.
        #
        # PII_SALT is the repository secret that pseudonymises `customer_id`
        # everywhere it appears in the published artifact. It is deliberately
        # **stable across releases**, not generated per run: a fresh salt every
        # month would repseudonymise all 5,881 customers for no change in the
        # data, so every retail file would differ in every release and a consumer
        # diffing two of them could never tell a restatement from a re-salting.
        # Stable means a consumer can follow a customer between releases, which
        # is what a surrogate key is for, and still cannot recover who they are.
        #
        # If the secret is not set the export **fails** rather than publishing
        # clear identifiers. That is the intended behaviour and not a bug to
        # route around — see `docs/DATA_PROTECTION.md`.
        env:
          TAG_INPUT: ${{ inputs.tag }}
          PII_SALT: ${{ secrets.PII_SALT }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            uv run python -m scripts.export_warehouse --tag "$TAG_INPUT"
          else
            uv run python -m scripts.export_warehouse
          fi
          echo "tag=$(jq -r .tag data/export/manifest.json)" >> "$GITHUB_OUTPUT"

      # Cheap insurance against publishing something unreadable: check the
      # sums, then read a `staging` view back out of the copied database. The
      # views are the part that can break — they store fully-qualified SQL
      # against a catalog named `warehouse`, so both the file name and the
      # ATTACH alias have to stay `warehouse`.
      #
      # "Unreadable" has a second meaning that this runner cannot test by
      # reading the file — it opens everything it wrote. So the storage format
      # is checked as a *number* against the ceiling the release notes promise,
      # the way the history is checked against what was carried forward. The
      # export already refuses to write one above it; this asserts the bytes
      # that are about to be uploaded agree with the manifest that describes
      # them, which is the pair a consumer actually receives.
      - name: Verify the artifact
        working-directory: data/export
        env:
          RESTORED_ROWS: ${{ steps.history.outputs.restored_rows }}
          RESTORED_LAKEHOUSE_ROWS: ${{ steps.history.outputs.restored_lakehouse_rows }}
          # `modern_data_stack` is a src-layout package and installs, so it
          # imports from anywhere; `scripts/` is a plain top-level directory and
          # does not, and this step runs from `data/export`. Without this the
          # ceiling import fails with `ModuleNotFoundError: No module named
          # 'scripts'` — after the release has already been built, and only on
          # the monthly run.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          sha256sum -c SHA256SUMS
          uv run --project "$GITHUB_WORKSPACE" python - <<'PY'
          import json
          import os
          from pathlib import Path

          import duckdb

          from modern_data_stack.export import storage_version
          from modern_data_stack.history import carried_rows
          from scripts.export_warehouse import (
              MAX_PUBLISHED_STORAGE_VERSION,
              MIN_READER_VERSION,
          )
          from scripts.restore_history import CARRIED

          manifest = json.loads(Path("manifest.json").read_text())
          on_disk = storage_version(Path("warehouse.duckdb"))
          claimed = manifest["storage_version"]
          assert on_disk == claimed, (
              f"manifest claims storage version {claimed}, the file is {on_disk}"
          )
          assert on_disk <= MAX_PUBLISHED_STORAGE_VERSION, (
              f"storage version {on_disk} is above the published ceiling "
              f"{MAX_PUBLISHED_STORAGE_VERSION}; the notes promise DuckDB "
              f"{MIN_READER_VERSION}+ can open this file"
          )
          print(
              f"warehouse.duckdb: storage version {on_disk}, written by DuckDB "
              f"{manifest['duckdb_version']}, readable by {MIN_READER_VERSION}+"
          )

          con = duckdb.connect()
          con.execute("attach 'warehouse.duckdb' as warehouse (read_only)")
          for relation in (
              "warehouse.staging.stg_co2",
              "warehouse.marts.fct_emissions_energy",
              "warehouse.analytics.co2_intensity",
              "'marts__fct_emissions_energy.parquet'",
          ):
              (rows,) = con.execute(f"select count(*) from {relation}").fetchone()
              assert rows > 0, f"{relation} is empty"
              print(f"{relation}: {rows:,} rows")

          # The landing zone is the *other* carried artifact and is checked on
          # its own terms: it has to be in the release at all, and it can only
          # grow. A release that shipped without it would look completely
          # healthy — every assertion above passes — and the cost would land on
          # the *next* run as a weather archive cold-started at three years.
          published = manifest["lakehouse"]
          assert published["file"], (
              "no lakehouse asset in this release: the landing zone was not "
              "published, so the next release cold-starts the weather archive"
          )
          carried_weather = int(os.environ.get("RESTORED_LAKEHOUSE_ROWS") or 0)
          assert published["rows"] >= carried_weather, (
              f"published lakehouse holds {published['rows']:,} rows, fewer than "
              f"the {carried_weather:,} carried in"
          )
          print(f"{published['file']}: {published['rows']:,} rows")

          # What was carried can only grow. Smaller than what went in means the
          # restore never reached the build, and this release would publish a
          # history that silently lost its earlier versions. Counted through
          # `CARRIED`, the same rules that produced `restored_rows`, so the two
          # sides cannot drift apart.
          restored = int(os.environ.get("RESTORED_ROWS") or 0)
          counts = carried_rows(con, CARRIED, database="warehouse")
          for relation, n in counts.items():
              print(f"warehouse.{relation}: {n:,} rows")
          rows = sum(counts.values())
          assert rows >= restored, (
              f"carried state shrank: {rows:,} rows, {restored:,} restored"
          )
          print(f"carried forward: {rows:,} rows total ({restored:,} restored)")
          PY

      # The notes are the release body, so they move out of the way and
      # everything left in data/export/ becomes an asset. `--clobber` on the
      # upload path so a same-day re-run replaces that day's assets rather than
      # failing on "asset already exists".
      - name: Publish the release
        env:
          TAG: ${{ steps.export.outputs.tag }}
        run: |
          mv data/export/RELEASE_NOTES.md release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" data/export/* --clobber
          else
            gh release create "$TAG" data/export/* \
              --target "$GITHUB_SHA" \
              --title "Warehouse snapshot ${TAG#data-}" \
              --notes-file release-notes.md
          fi
          {
            echo "## [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)"
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
