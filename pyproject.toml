[project]
name = "modern-data-stack"
version = "0.1.0"
description = "Emissions, energy and development across ~200 countries: a self-updating demo pipeline — dlt → DuckDB → dbt → Polars → Evidence, orchestrated by Dagster."
readme = "README.md"
authors = [{ name = "Daniel Scully", email = "danieldscully@gmail.com" }]
requires-python = ">=3.12"

# Runtime dependencies (the pipeline itself)
dependencies = [
    "dlt[duckdb]>=1.5",   # EL: API/file ingestion into DuckDB with schema inference
    "duckdb>=1.1",        # in-process analytical warehouse
    "polars>=1.17",       # heavy/columnar transforms in Python
    "dbt-duckdb>=1.9",    # T: dbt adapter targeting the DuckDB file
]

[dependency-groups]
# `uv sync --group dev` — tooling that isn't needed to run the pipeline
dev = [
    # Pinned exactly, and the pin is duplicated as the sqlfluff `rev` in
    # .pre-commit-config.yaml — pre-commit installs the linter into its own
    # isolated env, so a floating range here means `just lint` and the commit
    # hook can disagree about the same file. They did: 3.3.0 flagged an LT14
    # (`order by` in a window clause) that 4.2.2 accepts, so a tree that passed
    # `just lint` failed on commit. Bump both together or not at all.
    "sqlfluff==4.2.2",     # SQL linter/formatter (dbt templater)
    "sqlfluff-templater-dbt==4.2.2",  # .sqlfluff sets templater = dbt; useless without this
    "pre-commit>=4.0",     # git hooks
    "harlequin>=2.1",      # terminal SQL IDE for DuckDB
    "pytest>=8.3",         # unit tests over the ingest/transform logic (see tests/)
]
notebook = [
    "marimo>=0.10",        # reactive notebooks for the Polars exploration layer
]
# `uv sync --group orchestration` — the Dagster asset graph in orchestration/.
# The pipeline still runs without these (`just run`).
orchestration = [
    "dagster>=1.13.15",           # asset graph, schedules, freshness policies
    "dagster-dbt>=0.29.15",       # dbt manifest -> assets + tests as asset checks
    "dagster-dlt>=0.29.15",       # dlt resources -> assets, with subset loading
    "dagster-webserver>=1.13.15", # the UI behind `just dagster`
]

[project.scripts]
mds = "modern_data_stack:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# keep dev/notebook groups out of the default sync if desired:
# default-groups = ["dev"]

[tool.ruff]
# The Python here was written to ~100 columns and `.sqlfluff` caps SQL at 120;
# ruff's 88-column default would reflow every existing file on first run.
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# `ingest`, `transform` and `scripts` are top-level directories, not installed
# packages (only src/modern_data_stack is). Everything else reaches them via
# `python -m` from the repo root; pytest needs telling.
pythonpath = ["."]
# The unit tests mock every HTTP call; `just test-pipeline` is the integration
# path and runs the real modules against checked-in fixtures instead.
addopts = "-q"

[tool.dagster]
# Lets `uv run dagster dev` find the code location with no extra flags.
module_name = "orchestration.definitions"
code_location_name = "modern_data_stack"
