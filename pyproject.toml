[project]
name = "modern-data-stack"
version = "0.1.0"
description = "Emissions, energy and development across ~200 countries: a self-updating demo pipeline — dlt → DuckDB → dbt → Polars → Evidence, orchestrated by Dagster."
readme = "README.md"
authors = [{ name = "Daniel Scully", email = "danieldscully@gmail.com" }]
requires-python = ">=3.13"

# Runtime dependencies (the pipeline itself)
dependencies = [
    "dlt[duckdb]>=1.5",   # EL: API/file ingestion into DuckDB with schema inference
    "duckdb>=1.1",        # in-process analytical warehouse
    "polars>=1.17",       # heavy/columnar transforms in Python
    # Required at runtime, not a convenience: DuckDB reaches pyarrow for both
    # `to_arrow_reader()` (the retail ingest) and `.pl()` (both Polars
    # transforms), so an install without it raises ModuleNotFoundError from
    # three places. It used to arrive only as harlequin's grand-transitive,
    # which meant the runtime set was incomplete for as long as it was
    # undeclared and nothing said so. See CLAUDE.md.
    "pyarrow>=17",        # DuckDB's Arrow bridge — needed by the ingest and both transforms
    "dbt-duckdb>=1.9",    # T: dbt adapter targeting the DuckDB file
]

[dependency-groups]
# `uv sync --group dev` — tooling that isn't needed to run the pipeline
dev = [
    # Pinned exactly, and this is the *only* place it is pinned. The upstream
    # sqlfluff pre-commit hook used to carry a second `rev`, and the two drifted:
    # 3.3.0 there flagged an LT14 (`order by` in a window clause) that the venv's
    # 4.2.2 accepts, so a tree that passed `just lint` failed on commit. The hook
    # is now a `local` one that shells out to the recipe, so there is one copy.
    # Don't reintroduce a second pin. (ruff is the other way round — it lives
    # only in .pre-commit-config.yaml, and that `rev` is its single pin.)
    "sqlfluff==4.2.2",     # SQL linter/formatter (dbt templater)
    "sqlfluff-templater-dbt==4.2.2",  # .sqlfluff sets templater = dbt; useless without this
    "pre-commit>=4.0",     # git hooks
    "pytest>=8.3",         # unit tests over the ingest/transform logic (see tests/)
    # Type checker. Astral's, so it reads `requires-python` for the target
    # version exactly as ruff does — 3.13 stays declared in one place. It lives
    # in this group (unlike ruff) because there is no second copy to drift from:
    # nothing in .pre-commit-config.yaml or CI runs it, and the editor/LSP entry
    # in .claude/marketplace/ty-lsp shells out to `uv run ty`, so uv.lock is the
    # only pin.
    # A `>=` bound rather than sqlfluff's `==` for the same reason — no CI gate
    # can go red from a version move. Promote it to an exact pin *before*
    # putting it in pre-commit or a workflow: it is 0.0.x and pre-1.0, and its
    # diagnostics change between patch releases.
    "ty>=0.0.74",           # `just typecheck`; agent/editor LSP via `ty server`
    # The CLI as a PyPI wheel, official (`duckdb` org), not the `duckdb` library
    # already above — that ships no `duckdb` command. Pinning it here instead of
    # `curl https://install.duckdb.org | sh` means `just sql` needs no separate
    # install step and can't drift from the library version `uv.lock` already
    # resolves: both landed on 1.5.5. A bare `uvx duckdb-cli` would dodge that
    # lock the same way `uvx dg` does — see CLAUDE.md.
    "duckdb-cli>=1.5.5",    # `just sql`; the CLI binary, via `uv run duckdb`
]
# `uv sync --group orchestration` — the Dagster asset graph in orchestration/.
# The pipeline still runs without these (`just run`).
orchestration = [
    "dagster>=1.13.15",           # asset graph, schedules, freshness policies
    "dagster-dbt>=0.29.15",       # dbt manifest -> assets + tests as asset checks
    "dagster-dlt>=0.29.15",       # dlt resources -> assets, with subset loading
    "dagster-webserver>=1.13.15", # the UI behind `just dagster`
]

[project.scripts]
mds = "modern_data_stack:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# keep dev/notebook groups out of the default sync if desired:
# default-groups = ["dev"]

[tool.ruff]
# The Python here was written to ~100 columns and `.sqlfluff` caps SQL at 120;
# ruff's 88-column default would reflow every existing file on first run.
line-length = 100

[tool.ruff.lint]
# No `select`: this project runs ruff's own default rules, which 0.16 widened
# from 59 to 413 (https://docs.astral.sh/ruff/default-rules/). The default set is
# curated per release rather than fixed, so what holds it still is the exact
# `rev` in .pre-commit-config.yaml — that file is the pin, and `pre-commit
# autoupdate` is the only thing that can move the rule set. There is no second
# copy of ruff to drift from it (unlike sqlfluff, it isn't in the dev group).
#
# 0.16 also *dropped* 18 opinionated pycodestyle/pyflakes rules from the default
# set. They were enforced here before the widening and the tree still passes
# them, so they go back explicitly rather than being lost to a version bump —
# star imports and stray `==`/`is` comparisons are exactly what you want caught
# in a repo where the linter is the only reviewer.
extend-select = [
    "E401", "E402",                                   # multiple / non-top-level imports
    "E701", "E702", "E703",                           # colons and stray semicolons
    "E711", "E712", "E713", "E714", "E721",           # comparison style
    "E731", "E741", "E742", "E743",                   # lambda assignment, ambiguous names
    "F403", "F405", "F406",                           # star imports
    "F722",                                           # syntax error in forward annotation
]

[tool.ruff.lint.isort]
# Keep `from x import a, run as b` on one statement. ruff's default splits the
# aliased name onto a second `from x import …` line, which would have turned the
# eight-line import block at the top of orchestration/assets.py into twelve and
# separated `run as write_lake` from the module it comes from — noise, given the
# `run as …` aliases exist precisely because four layers each export a `run()`.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `ingest`, `transform` and `scripts` are top-level directories, not installed
# packages (only src/modern_data_stack is). Everything else reaches them via
# `python -m` from the repo root; pytest needs telling.
pythonpath = ["."]
# The unit tests mock every HTTP call; `just test-pipeline` is the integration
# path and runs the real modules against checked-in fixtures instead.
addopts = "-q"

[tool.ty]
# Deliberately no `rules` overrides: like ruff above, this runs the checker's own
# defaults, and uv.lock is what holds them still. Suppressions are inline
# `# ty: ignore[rule]` at the point of the decision instead, so the reason sits
# next to the code rather than in a list nobody reads.

[tool.ty.environment]
# Explicit, though ty finds it unaided. The LSP server is launched by the editor
# from a cwd this project does not choose, and a type checker that cannot see
# the venv does not fail — it reports every third-party import as missing and
# buries the real diagnostics. (Measured: pyright did exactly that here, 54
# phantom `reportMissingImports` until it was pointed at the same path.)
python = "./.venv"

[tool.dagster]
# Lets `uv run dagster dev` find the code location with no extra flags.
module_name = "orchestration.definitions"
code_location_name = "modern_data_stack"
